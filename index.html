<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>현지공인중개사 매물지도</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:
    "Pretendard",
    "Noto Sans KR",
    Arial,
    sans-serif;
  color:#202124;
  background:#f5f7fa;
}

button,
input,
select,
textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

/* =========================
   HEADER
========================= */

.header{
  height:68px;
  background:#ffffff;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  position:relative;
  z-index:20;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:21px;
  font-weight:800;
}

.logo-mark{
  width:36px;
  height:36px;
  border-radius:12px;
  background:#2f855a;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}

.header-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.admin-email{
  color:#6b7280;
  font-size:13px;
}

.login-btn,
.logout-btn{
  border:0;
  border-radius:10px;
  padding:10px 15px;
  font-weight:700;
}

.login-btn{
  background:#202124;
  color:#fff;
}

.logout-btn{
  background:#f0f2f5;
  color:#333;
}

/* =========================
   FILTER BAR
========================= */

.filter-bar{
  min-height:64px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:10px 18px;
  display:flex;
  align-items:center;
  gap:9px;
  overflow-x:auto;
  position:relative;
  z-index:15;
}

.filter-input{
  width:270px;
  min-width:220px;
  height:42px;
  border:1px solid #d8dde5;
  border-radius:11px;
  padding:0 14px;
  outline:none;
  font-size:14px;
}

.filter-input:focus{
  border-color:#2f855a;
}

.filter-select{
  height:42px;
  border:1px solid #d8dde5;
  border-radius:11px;
  background:#fff;
  padding:0 14px;
  font-size:14px;
  min-width:120px;
}

.total-badge{
  margin-left:auto;
  white-space:nowrap;
  background:#eaf6ef;
  color:#257047;
  font-size:14px;
  font-weight:800;
  border-radius:20px;
  padding:11px 16px;
}

/* =========================
   MAIN
========================= */

.main{
  height:calc(100vh - 132px);
  display:flex;
  position:relative;
}

/* =========================
   MAP
========================= */

.map-wrap{
  flex:1;
  position:relative;
  min-width:0;
}

#map{
  width:100%;
  height:100%;
}

/* =========================
   DONG COUNT
========================= */

.dong-count{
  background:#2f855a;
  color:white;
  min-width:48px;
  height:48px;
  padding:0 12px;
  border-radius:50px;
  border:4px solid white;
  box-shadow:0 4px 16px rgba(0,0,0,.18);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.dong-count strong{
  font-size:17px;
  line-height:17px;
}

.dong-count span{
  font-size:9px;
  margin-top:2px;
  opacity:.9;
}

/* =========================
   MAP INFO
========================= */

.map-info{
  position:absolute;
  top:18px;
  left:18px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);
  border-radius:14px;
  padding:13px 16px;
  box-shadow:0 4px 18px rgba(0,0,0,.1);
  z-index:5;
}

.map-info-title{
  font-weight:800;
  font-size:14px;
}

.map-info-sub{
  margin-top:4px;
  color:#6b7280;
  font-size:12px;
}

/* =========================
   LIST
========================= */

.list-panel{
  width:430px;
  background:#f8fafb;
  border-left:1px solid #e5e7eb;
  overflow-y:auto;
  z-index:10;
}

.list-head{
  padding:18px 18px 12px;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
}

.list-title{
  font-size:18px;
  font-weight:900;
}

.list-sub{
  margin-top:5px;
  font-size:12px;
  color:#7b8190;
}

.property-card{
  margin:12px;
  background:#fff;
  border:1px solid #e7e9ed;
  border-radius:16px;
  overflow:hidden;
  transition:.2s;
}

.property-card:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(0,0,0,.08);
}

.property-photo{
  width:100%;
  height:205px;
  background:#eef1f4;
  position:relative;
  overflow:hidden;
}

.property-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.no-photo{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#9ca3af;
  font-size:14px;
}

.type-label{
  position:absolute;
  top:12px;
  left:12px;
  background:#202124;
  color:#fff;
  border-radius:8px;
  padding:6px 9px;
  font-size:11px;
  font-weight:800;
}

.property-body{
  padding:15px;
}

.property-title{
  font-size:17px;
  font-weight:900;
  line-height:1.35;
}

.property-address{
  margin-top:7px;
  color:#737985;
  font-size:12px;
}

.price-row{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:14px;
}

.price-item{
  display:flex;
  align-items:center;
  gap:5px;
}

.price-label{
  font-size:10px;
  color:#fff;
  border-radius:5px;
  padding:4px 6px;
  font-weight:800;
}

.deposit{
  background:#4d9c68;
}

.rent{
  background:#4d9c68;
}

.management{
  background:#e79a2b;
}

.keymoney{
  background:#dc4c42;
}

.price-value{
  font-size:14px;
  font-weight:900;
}

.card-bottom{
  margin-top:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.card-info{
  color:#777;
  font-size:11px;
}

.detail-btn{
  border:0;
  background:#202124;
  color:#fff;
  border-radius:9px;
  padding:8px 11px;
  font-size:11px;
  font-weight:800;
}

/* =========================
   ADMIN PANEL
========================= */

.admin-panel{
  position:fixed;
  top:0;
  right:-520px;
  width:500px;
  max-width:94vw;
  height:100vh;
  background:#fff;
  z-index:100;
  box-shadow:-10px 0 35px rgba(0,0,0,.18);
  transition:right .25s ease;
  overflow-y:auto;
}

.admin-panel.open{
  right:0;
}

.admin-header{
  height:65px;
  padding:0 20px;
  border-bottom:1px solid #e5e7eb;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.admin-header h2{
  margin:0;
  font-size:19px;
}

.close-admin{
  border:0;
  background:#f2f3f5;
  width:36px;
  height:36px;
  border-radius:50%;
  font-size:20px;
}

.admin-content{
  padding:20px;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:7px;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  border:1px solid #d7dce3;
  border-radius:10px;
  padding:11px 12px;
  font-size:14px;
  outline:none;
  background:#fff;
}

.form-group textarea{
  resize:vertical;
  min-height:110px;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
  border-color:#2f855a;
}

.two-col{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.photo-preview{
  width:100%;
  height:210px;
  border-radius:12px;
  overflow:hidden;
  background:#f1f3f5;
  margin-top:8px;
  display:none;
}

.photo-preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.photo-note{
  font-size:11px;
  color:#7a808a;
  margin-top:6px;
  line-height:1.5;
}

.register-btn{
  width:100%;
  border:0;
  background:#2f855a;
  color:white;
  height:48px;
  border-radius:11px;
  font-size:15px;
  font-weight:900;
  margin-top:8px;
}

.register-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* =========================
   ADMIN BUTTON
========================= */

.admin-open-btn{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:30;
  border:0;
  border-radius:50px;
  background:#202124;
  color:#fff;
  padding:13px 18px;
  font-weight:900;
  box-shadow:0 6px 20px rgba(0,0,0,.2);
  display:none;
}

.admin-open-btn.show{
  display:block;
}

/* =========================
   MODAL
========================= */

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:700px;
  max-width:100%;
  max-height:90vh;
  overflow-y:auto;
  background:#fff;
  border-radius:20px;
  box-shadow:0 15px 60px rgba(0,0,0,.25);
}

.modal-photo{
  width:100%;
  height:370px;
  background:#eee;
}

.modal-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.modal-content{
  padding:22px;
}

.modal-title{
  font-size:24px;
  font-weight:900;
}

.modal-address{
  color:#777;
  font-size:13px;
  margin-top:7px;
}

.modal-price{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  margin-top:18px;
}

.modal-price-box{
  background:#f5f7f8;
  border-radius:11px;
  padding:12px;
}

.modal-price-box span{
  display:block;
  font-size:11px;
  color:#7a8089;
}

.modal-price-box strong{
  display:block;
  margin-top:4px;
  font-size:17px;
}

.modal-description{
  white-space:pre-wrap;
  line-height:1.7;
  margin-top:20px;
  font-size:14px;
  color:#444;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:20px;
}

.external-btn{
  flex:1;
  height:45px;
  border:0;
  background:#2f855a;
  color:#fff;
  border-radius:10px;
  font-weight:900;
}

.delete-btn{
  height:45px;
  padding:0 17px;
  border:0;
  background:#dc4c42;
  color:#fff;
  border-radius:10px;
  font-weight:900;
}

.close-modal{
  position:absolute;
  right:15px;
  top:15px;
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.6);
  color:#fff;
  font-size:20px;
}

/* =========================
   EMPTY
========================= */

.empty{
  padding:50px 20px;
  text-align:center;
  color:#8b919b;
  font-size:14px;
}

/* =========================
   LOADING
========================= */

.loading{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.75);
  backdrop-filter:blur(3px);
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
}

.loading.show{
  display:flex;
}

.loading-box{
  background:#fff;
  border-radius:15px;
  padding:22px 28px;
  box-shadow:0 8px 30px rgba(0,0,0,.15);
  font-weight:800;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

  .main{
    display:block;
    height:calc(100vh - 132px);
  }

  .map-wrap{
    height:55%;
  }

  .list-panel{
    width:100%;
    height:45%;
    border-left:0;
    border-top:1px solid #ddd;
  }

  .header{
    padding:0 12px;
  }

  .logo{
    font-size:16px;
  }

  .admin-email{
    display:none;
  }

  .filter-bar{
    padding:8px;
  }

  .filter-input{
    width:190px;
  }

  .admin-panel{
    width:100%;
    max-width:100%;
  }
}

@media(max-width:500px){

  .property-photo{
    height:180px;
  }

  .modal-photo{
    height:250px;
  }

  .modal-price{
    grid-template-columns:1fr;
  }

  .two-col{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="logo">
    <div class="logo-mark">📍</div>
    현지공인중개사 매물지도
  </div>

  <div class="header-right">

    <span id="adminEmail" class="admin-email"></span>

    <button
      id="loginBtn"
      class="login-btn"
      onclick="googleLogin()">
      Google 로그인
    </button>

    <button
      id="logoutBtn"
      class="logout-btn"
      onclick="googleLogout()"
      style="display:none;">
      로그아웃
    </button>

  </div>

</header>


<!-- =========================
     FILTER
========================= -->

<div class="filter-bar">

  <input
    id="searchInput"
    class="filter-input"
    placeholder="매물번호, 제목, 주소 검색"
    oninput="renderProperties()">

  <select
    id="typeFilter"
    class="filter-select"
    onchange="renderProperties()">

    <option value="">전체 종류</option>
    <option value="상가">상가</option>
    <option value="공장">공장</option>
    <option value="원룸">원룸</option>
    <option value="투룸">투룸</option>
    <option value="아파트">아파트</option>
    <option value="기타">기타</option>

  </select>

  <select
    id="dongFilter"
    class="filter-select"
    onchange="renderProperties()">

    <option value="">전체 지역</option>

  </select>

  <div id="totalBadge" class="total-badge">
    매물 0개
  </div>

</div>


<!-- =========================
     MAIN
========================= -->

<main class="main">

  <section class="map-wrap">

    <div id="map"></div>

    <div class="map-info">

      <div class="map-info-title">
        현지공인중개사 실매물 지도
      </div>

      <div class="map-info-sub">
        지도에서 지역별 매물 수를 확인할 수 있습니다.
      </div>

    </div>

  </section>


  <aside class="list-panel">

    <div class="list-head">

      <div class="list-title">
        등록 매물
      </div>

      <div class="list-sub">
        매물을 클릭하면 상세정보를 확인할 수 있습니다.
      </div>

    </div>

    <div id="propertyList"></div>

  </aside>

</main>


<!-- =========================
     ADMIN BUTTON
========================= -->

<button
  id="adminOpenBtn"
  class="admin-open-btn"
  onclick="openAdminPanel()">

  + 매물 등록

</button>


<!-- =========================
     ADMIN PANEL
========================= -->

<aside
  id="adminPanel"
  class="admin-panel">

  <div class="admin-header">

    <h2>매물 등록</h2>

    <button
      class="close-admin"
      onclick="closeAdminPanel()">
      ×
    </button>

  </div>


  <div class="admin-content">

    <div class="form-group">

      <label>매물 제목 *</label>

      <input
        id="fTitle"
        placeholder="예: 성정동 대로변 1층 상가">

    </div>


    <div class="form-group">

      <label>주소 *</label>

      <input
        id="fAddress"
        placeholder="예: 충남 천안시 서북구 성정동 123-4">

      <div class="photo-note">
        입력한 주소를 카카오 주소검색으로 좌표화하여 지도에 표시합니다.
      </div>

    </div>


    <div class="form-group">

      <label>매물 종류 *</label>

      <select id="fType">

        <option value="상가">상가</option>
        <option value="공장">공장</option>
        <option value="원룸">원룸</option>
        <option value="투룸">투룸</option>
        <option value="아파트">아파트</option>
        <option value="기타">기타</option>

      </select>

    </div>


    <div class="two-col">

      <div class="form-group">

        <label>보증금 (만원)</label>

        <input
          id="fDeposit"
          type="number"
          placeholder="3000">

      </div>


      <div class="form-group">

        <label>월세 (만원)</label>

        <input
          id="fRent"
          type="number"
          placeholder="250">

      </div>

    </div>


    <div class="two-col">

      <div class="form-group">

        <label>관리비 (만원)</label>

        <input
          id="fManagement"
          type="number"
          placeholder="20">

      </div>


      <div class="form-group">

        <label>권리금 (만원)</label>

        <input
          id="fKeyMoney"
          type="number"
          placeholder="1500">

      </div>

    </div>


    <div class="two-col">

      <div class="form-group">

        <label>면적</label>

        <input
          id="fArea"
          placeholder="89.9㎡">

      </div>


      <div class="form-group">

        <label>층</label>

        <input
          id="fFloor"
          placeholder="1층">

      </div>

    </div>


    <div class="form-group">

      <label>외부 상세페이지 주소</label>

      <input
        id="fExternalUrl"
        type="url"
        placeholder="https://...">

      <div class="photo-note">
        매물마다 직접 주소를 넣으면 일반 방문자가 상세보기 버튼을 눌러 해당 사이트로 이동합니다.
      </div>

    </div>


    <div class="form-group">

      <label>매물 설명</label>

      <textarea
        id="fDescription"
        placeholder="상가 특징, 위치, 주차, 시설 등을 입력하세요."></textarea>

    </div>


    <div class="form-group">

      <label>대표사진 1장</label>

      <input
        id="fPhoto"
        type="file"
        accept="image/*"
        onchange="previewPhoto(event)">

      <div
        id="photoPreview"
        class="photo-preview">

        <img id="previewImage">

      </div>

      <div class="photo-note">

        사진은 1장만 저장합니다.
        Firebase Storage를 사용하지 않고 압축하여 Firestore에 저장합니다.

      </div>

    </div>


    <button
      id="registerBtn"
      class="register-btn"
      onclick="registerProperty()">

      매물 등록하기

    </button>

  </div>

</aside>


<!-- =========================
     DETAIL MODAL
========================= -->

<div
  id="modalBg"
  class="modal-bg"
  onclick="closeModal(event)">

  <div
    class="modal"
    onclick="event.stopPropagation()">

    <div
      id="modalPhoto"
      class="modal-photo">
    </div>

    <div class="modal-content">

      <div
        id="modalTitle"
        class="modal-title">
      </div>

      <div
        id="modalAddress"
        class="modal-address">
      </div>

      <div
        id="modalPrice"
        class="modal-price">
      </div>

      <div
        id="modalDescription"
        class="modal-description">
      </div>

      <div class="modal-actions">

        <button
          id="externalBtn"
          class="external-btn"
          onclick="openExternalUrl()"
          style="display:none;">

          상세 매물정보 보기

        </button>

        <button
          id="deleteBtn"
          class="delete-btn"
          onclick="deleteCurrentProperty()"
          style="display:none;">

          매물 삭제

        </button>

      </div>

    </div>

  </div>

</div>


<!-- =========================
     LOADING
========================= -->

<div
  id="loading"
  class="loading">

  <div class="loading-box">
    처리 중입니다...
  </div>

</div>


<!-- =========================
     KAKAO MAP
========================= -->

<script
src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=175758acb1d968a612c27e344b435346&libraries=services,clusterer&autoload=false">
</script>


<!-- =========================

function searchAddress(address){

  return new Promise(
    (resolve, reject) => {

      if(
        !kakaoReady ||
        !window.kakao ||
        !kakao.maps.services
      ){

        reject(
          new Error(
            "카카오 주소검색 서비스가 준비되지 않았습니다."
          )
        );

        return;

      }


      const geocoder =
        new kakao.maps.services.Geocoder();


      geocoder.addressSearch(
        address,
        (result, status) => {

          if(
            status ===
            kakao.maps.services.Status.OK
          ){

            const item =
              result[0];


            resolve({

              lat:
                Number(item.y),

              lng:
                Number(item.x),

              dong:
                item.address &&
                item.address.region_3depth_name
                  ? item.address.region_3depth_name
                  : ""

            });

          }

          else{

            reject(
              new Error(
                "주소를 찾을 수 없습니다."
              )
            );

          }

        }
      );

    }
  );

}

/* =========================
   사진 압축
========================= */

function compressImage(file){

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload =
        function(e){

          const img =
            new Image();


          img.onload =
            function(){

              const maxSize =
                1200;

              let width =
                img.width;

              let height =
                img.height;


              if(width > height){

                if(width > maxSize){

                  height =
                    height *
                    maxSize /
                    width;

                  width =
                    maxSize;

                }

              }

              else{

                if(height > maxSize){

                  width =
                    width *
                    maxSize /
                    height;

                  height =
                    maxSize;

                }

              }


              const canvas =
                document.createElement(
                  "canvas"
                );

              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              canvas.toBlob(
                blob => {

                  if(!blob){

                    reject(
                      new Error(
                        "사진 압축에 실패했습니다."
                      )
                    );

                    return;

                  }


                  if(
                    blob.size >
                    850000
                  ){

                    reject(
                      new Error(
                        "사진 용량이 너무 큽니다. 다른 사진을 선택해주세요."
                      )
                    );

                    return;

                  }


                  const fr =
                    new FileReader();


                  fr.onload =
                    () => resolve(
                      fr.result
                    );


                  fr.onerror =
                    reject;


                  fr.readAsDataURL(
                    blob
                  );

                },
                "image/jpeg",
                0.72
              );

            };


          img.onerror =
            reject;


          img.src =
            e.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}

/* =========================
   매물 불러오기
========================= */

async function loadProperties(){

  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "properties"
        )
      );


    properties =
      snapshot.docs.map(
        item => ({

          id:
            item.id,

          ...item.data()

        })
      );


    properties.sort(
      (a,b) => {

        const aTime =
          a.createdAt?.seconds ||
          0;

        const bTime =
          b.createdAt?.seconds ||
          0;

        return bTime - aTime;

      }
    );


    updateDongFilter();

    renderProperties();

    drawMap();

  }

  catch(error){

    console.error(error);

    alert(
      "매물을 불러오지 못했습니다.\n\n" +
      error.message
    );

  }

}


/* =========================
   동 필터
========================= */

function updateDongFilter(){

  const select =
    document.getElementById(
      "dongFilter"
    );


  const current =
    select.value;


  const dongs =
    [...new Set(
      properties
        .map(p => p.dong)
        .filter(Boolean)
    )]
    .sort();


  select.innerHTML =
    `<option value="">전체 지역</option>`;


  dongs.forEach(
    dong => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        dong;

      option.textContent =
        dong;

      select.appendChild(
        option
      );

    }
  );


  select.value =
    dongs.includes(current)
      ? current
      : "";

}


/* =========================
   필터링
========================= */

function getFilteredProperties(){

  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  const type =
    document
      .getElementById(
        "typeFilter"
      )
      .value;


  const dong =
    document
      .getElementById(
        "dongFilter"
      )
      .value;


  return properties.filter(
    p => {

      const text =
        [

          p.id,
          p.title,
          p.address,
          p.dong,
          p.type

        ]
        .join(" ")
        .toLowerCase();


      if(
        search &&
        !text.includes(search)
      ){

        return false;

      }


      if(
        type &&
        p.type !== type
      ){

        return false;

      }


      if(
        dong &&
        p.dong !== dong
      ){

        return false;

      }


      return true;

    }
  );

}


/* =========================
   숫자 표시

function money(value){

  if(
    value === null ||
    value === undefined ||
    value === ""
  ){

    return "-";

  }


  return Number(value).toLocaleString(
    "ko-KR"
  ) + "만원";

}

  function(){

    if(
      !currentProperty ||
      !currentProperty.externalUrl
    ){

      return;

    }


    let url =
      currentProperty.externalUrl.trim();


    if(
      !url.startsWith("http://") &&
      !url.startsWith("https://")
    ){

      url =
        "https://" + url;

    }


    window.open(
      url,
      "_blank",
      "noopener,noreferrer"
    );

  };

/* =========================
   지도
========================= */

function drawMap(){

  if(!map){

    return;

  }


  /* 기존 마커 삭제 */

  markers.forEach(
    marker =>
      marker.setMap(null)
  );

  markers = [];


  /* 기존 동 오버레이 삭제 */

  dongOverlays.forEach(
    overlay =>
      overlay.setMap(null)
  );

  dongOverlays = [];


  const filtered =
    getFilteredProperties();


  /* 매물 마커 */

  filtered.forEach(
    p => {

      if(
        typeof p.lat !== "number" ||
        typeof p.lng !== "number"
      ){

        return;

      }


      const position =
        new kakao.maps.LatLng(
          p.lat,
          p.lng
        );


      const marker =
        new kakao.maps.Marker({

          position,

          map

        });


      kakao.maps.event.addListener(
        marker,
        "click",
        () => {

          openProperty(p.id);

        }
      );


      markers.push(
        marker
      );

    }
  );


  /* 동별 개수 */

  const dongGroups =
    {};


  filtered.forEach(
    p => {

      if(
        !p.dong ||
        typeof p.lat !== "number" ||
        typeof p.lng !== "number"
      ){

        return;

      }


      if(
        !dongGroups[p.dong]
      ){

        dongGroups[p.dong] = {

          count:0,

          lat:0,

          lng:0

        };

      }


      dongGroups[p.dong].count++;

      dongGroups[p.dong].lat +=
        p.lat;

      dongGroups[p.dong].lng +=
        p.lng;

    }
  );


  Object.keys(
    dongGroups
  ).forEach(
    dong => {

      const group =
        dongGroups[dong];


      const lat =
        group.lat /
        group.count;

      const lng =
        group.lng /
        group.count;


      const content = `

        <div
          class="dong-count"
          title="${dong} 매물 ${group.count}개">

          <strong>
            ${group.count}
          </strong>

          <span>
            ${escapeHtml(dong)}
          </span>

        </div>

      `;


      const overlay =
        new kakao.maps.CustomOverlay({

          position:
            new kakao.maps.LatLng(
              lat,
              lng
            ),

          content,

          yAnchor:1.3,

          zIndex:5

        });


      overlay.setMap(
        map
      );


      dongOverlays.push(
        overlay
      );

    }
  );


  /* 매물이 있으면 지도 중심 이동 */

  if(filtered.length){

    const bounds =
      new kakao.maps.LatLngBounds();


    filtered.forEach(
      p => {

        if(
          typeof p.lat === "number" &&
          typeof p.lng === "number"
        ){

          bounds.extend(
            new kakao.maps.LatLng(
              p.lat,
              p.lng
            )
          );

        }

      }
    );


    if(!bounds.isEmpty()){

      map.setBounds(
        bounds
      );

    }

  }

}


/* =========================
   XSS 방지
========================= */

function escapeHtml(value){

  if(
    value === null ||
    value === undefined
  ){

    return "";

  }


  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================
   필터 변경시 지도도 변경
========================= */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    () => {

      renderProperties();

      drawMap();

    }
  );


document
  .getElementById(
    "typeFilter"
  )
  .addEventListener(
    "change",
    () => {

      renderProperties();

      drawMap();

    }
  );


document
  .getElementById(
    "dongFilter"
  )
  .addEventListener(
    "change",
    () => {

      renderProperties();

      drawMap();

    }
  );


/* =========================
   카카오 시작
========================= */

if(
  window.kakao &&
  kakao.maps
){

  startKakaoMap();

}

else{

  alert(
    "카카오맵 SDK를 불러오지 못했습니다.\n카카오 개발자센터의 JavaScript SDK 도메인을 확인해주세요."
  );

}
