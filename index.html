<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>현지공인중개사 매물지도</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:Arial,"Malgun Gothic","Noto Sans KR",sans-serif;
    background:#f5f6f8;
    color:#222;
}

button,
input,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

#app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* =========================
   상단
========================= */

.header{
    height:64px;
    background:#ffffff;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    flex-shrink:0;
}

.logo{
    font-size:20px;
    font-weight:800;
    color:#222;
}

.logo span{
    color:#3973e6;
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.user-email{
    font-size:13px;
    color:#666;
}

.btn{
    border:0;
    border-radius:8px;
    padding:10px 15px;
    font-size:14px;
    font-weight:600;
}

.btn-primary{
    background:#3973e6;
    color:#fff;
}

.btn-dark{
    background:#222;
    color:#fff;
}

.btn-light{
    background:#f1f3f5;
    color:#333;
}

.btn-danger{
    background:#e74c3c;
    color:#fff;
}

/* =========================
   메인
========================= */

.main{
    flex:1;
    min-height:0;
    display:flex;
}

/* =========================
   왼쪽 패널
========================= */

.sidebar{
    width:390px;
    background:#fff;
    border-right:1px solid #ddd;
    display:flex;
    flex-direction:column;
    flex-shrink:0;
}

.sidebar-header{
    padding:18px;
    border-bottom:1px solid #eee;
}

.sidebar-title{
    font-size:18px;
    font-weight:800;
    margin-bottom:5px;
}

.sidebar-desc{
    font-size:12px;
    color:#888;
}

.property-list{
    flex:1;
    overflow-y:auto;
    padding:10px;
}

/* =========================
   매물 카드
========================= */

.property-card{
    background:#fff;
    border:1px solid #e1e4e8;
    border-radius:10px;
    padding:14px;
    margin-bottom:10px;
    transition:.15s;
}

.property-card:hover{
    border-color:#3973e6;
    box-shadow:0 3px 10px rgba(0,0,0,.07);
}

.property-type{
    display:inline-block;
    background:#eef4ff;
    color:#3973e6;
    font-size:11px;
    font-weight:700;
    padding:4px 7px;
    border-radius:5px;
    margin-bottom:7px;
}

.property-title{
    font-size:16px;
    font-weight:800;
    margin-bottom:7px;
}

.property-address{
    font-size:13px;
    color:#555;
    line-height:1.5;
    margin-bottom:8px;
}

.property-price{
    font-size:15px;
    font-weight:800;
    margin-bottom:5px;
}

.property-info{
    font-size:12px;
    color:#777;
    line-height:1.6;
}

.card-buttons{
    display:flex;
    gap:6px;
    margin-top:10px;
}

.card-buttons button{
    flex:1;
    padding:7px;
    border:0;
    border-radius:6px;
    font-size:12px;
    font-weight:600;
}

/* =========================
   지도
========================= */

.map-wrap{
    flex:1;
    min-width:0;
    position:relative;
}

#map{
    width:100%;
    height:100%;
}

.map-message{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    background:#fff;
    border-radius:8px;
    padding:10px 15px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
    font-size:13px;
    display:none;
}

/* =========================
   로그인
========================= */

.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
}

.modal-bg.show{
    display:flex;
}

.modal{
    width:420px;
    max-width:calc(100% - 30px);
    background:#fff;
    border-radius:14px;
    padding:25px;
    box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.modal-title{
    font-size:20px;
    font-weight:800;
    margin-bottom:20px;
}

.input-group{
    margin-bottom:13px;
}

.input-group label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:6px;
}

.input{
    width:100%;
    height:43px;
    border:1px solid #d5d9df;
    border-radius:7px;
    padding:0 12px;
    font-size:14px;
    outline:none;
}

.input:focus{
    border-color:#3973e6;
}

.modal-buttons{
    display:flex;
    gap:8px;
    margin-top:18px;
}

.modal-buttons button{
    flex:1;
}

.error-message{
    color:#e74c3c;
    font-size:13px;
    margin-top:10px;
}

/* =========================
   등록 폼
========================= */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.form-full{
    grid-column:1 / -1;
}

.address-row{
    display:flex;
    gap:7px;
}

.address-row .input{
    flex:1;
}

.address-result{
    margin-top:7px;
    font-size:12px;
    color:#3973e6;
}

.admin-only{
    display:none;
}

body.admin .admin-only{
    display:block;
}

.login-required{
    text-align:center;
    padding:30px 15px;
    color:#777;
}

/* =========================
   모바일
========================= */

@media(max-width:800px){

    .header{
        height:58px;
        padding:0 12px;
    }

    .logo{
        font-size:16px;
    }

    .user-email{
        display:none;
    }

    .main{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        height:45%;
        border-right:0;
        border-bottom:1px solid #ddd;
    }

    .map-wrap{
        height:55%;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-full{
        grid-column:auto;
    }
}
</style>
</head>

            <input

<!-- =========================
     FIREBASE
========================= -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    updateDoc,
    deleteDoc,
    doc,
    onSnapshot,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   FIREBASE 설정
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAcY9YI780LAKD4KJNJZT6KRrheVG5GpVM",

    authDomain:
        "hyunji-8fc9c.firebaseapp.com",

    projectId:
        "hyunji-8fc9c",

    storageBucket:
        "hyunji-8fc9c.firebasestorage.app",

    messagingSenderId:
        "659657503337",

    appId:
        "1:659657503337:web:aa2e24ae4d37ed29d6a8f8",

    measurementId:
        "G-1LPMGC6317"
};


/* =====================================================
   관리자 이메일
===================================================== */

const ADMIN_EMAIL =
    "khj0108279@gmail.com";


/* =====================================================
   FIREBASE 초기화
===================================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =====================================================
   전역 변수
===================================================== */

let currentUser = null;

let properties = [];

let editingPropertyId = null;

let map = null;

let geocoder = null;

let markers = [];

let mapReady = false;


/* =====================================================
   KAKAO MAP 초기화
===================================================== */

function initKakaoMap(){

    if(
        typeof kakao === "undefined" ||
        !kakao.maps
    ){

        console.error(
            "카카오 지도 SDK를 불러오지 못했습니다."
        );

        return;
    }

    const container =
        document.getElementById("map");

    const options = {

        center:
            new kakao.maps.LatLng(
                36.8151,
                127.1139
            ),

        level:5
    };

    map =
        new kakao.maps.Map(
            container,
            options
        );

    geocoder =
        new kakao.maps.services.Geocoder();

    mapReady = true;

    renderMarkers();
}


/* =====================================================
   주소 → 좌표 자동 검색
===================================================== */

window.searchAddress =
function(){

    const address =
        document
            .getElementById(
                "propertyAddress"
            )
            .value
            .trim();

    const result =
        document.getElementById(
            "addressResult"
        );

    if(!address){

        result.textContent =
            "주소를 입력해주세요.";

        return;
    }

    if(!geocoder){

        result.textContent =
            "지도 준비 중입니다.";

        return;
    }

    result.textContent =
        "주소를 검색하고 있습니다...";


    geocoder.addressSearch(
        address,
        function(results,status){

            if(
                status ===
                kakao.maps.services.Status.OK
            ){

                const item =
                    results[0];

                const lat =
                    Number(item.y);

                const lng =
                    Number(item.x);


                document
                    .getElementById(
                        "addressResult"
                    )
                    .textContent =
                    "✓ 주소 확인 완료";


                document
                    .getElementById(
                        "propertyAddress"
                    )
                    .dataset.lat =
                    lat;

                document
                    .getElementById(
                        "propertyAddress"
                    )
                    .dataset.lng =
                    lng;


                map.setCenter(
                    new kakao.maps.LatLng(
                        lat,
                        lng
                    )
                );


                map.setLevel(3);


                showTemporaryMarker(
                    lat,
                    lng
                );

            }else{

                result.textContent =
                    "주소를 찾지 못했습니다. 주소를 다시 확인해주세요.";

            }

        }
    );
};


/* =====================================================
   임시 핀 표시
===================================================== */

let temporaryMarker = null;

function showTemporaryMarker(
    lat,
    lng
){

    if(temporaryMarker){

        temporaryMarker.setMap(null);

    }

    temporaryMarker =
        new kakao.maps.Marker({

            position:
                new kakao.maps.LatLng(
                    lat,
                    lng
                ),

            map:map
        });

}


/* =====================================================
   로그인 상태
===================================================== */

onAuthStateChanged(
    auth,
    function(user){

        currentUser = user;

        if(
            user &&
            user.email === ADMIN_EMAIL
        ){

            document.body.classList.add(
                "admin"
            );

            document
                .getElementById(
                    "userEmail"
                )
                .textContent =
                user.email;

            document
                .getElementById(
                    "loginBtn"
                )
                .style.display =
                "none";

            document
                .getElementById(
                    "logoutBtn"
                )
                .style.display =
                "block";

            document
                .getElementById(
                    "addBtn"
                )
                .style.display =
                "block";

        }else{

            document.body.classList.remove(
                "admin"
            );

            document
                .getElementById(
                    "userEmail"
                )
                .textContent =
                "";

            document
                .getElementById(
                    "loginBtn"
                )
                .style.display =
                "block";

            document
                .getElementById(
                    "logoutBtn"
                )
                .style.display =
                "none";

            document
                .getElementById(
                    "addBtn"
                )
                .style.display =
                "none";

        }

        renderPropertyList();

    }
);


/* =====================================================
   로그인
===================================================== */

window.login =
async function(){

    const email =
        document
            .getElementById(
                "loginEmail"
            )
            .value
            .trim();

    const password =
        document
            .getElementById(
                "loginPassword"
            )
            .value;

    const error =
        document
            .getElementById(
                "loginError"
            );

    error.textContent = "";


    if(!email || !password){

        error.textContent =
            "이메일과 비밀번호를 입력해주세요.";

        return;
    }


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        closeLoginModal();

    }catch(e){

        console.error(e);

        error.textContent =
            "로그인에 실패했습니다. 이메일 또는 비밀번호를 확인해주세요.";

    }

};


/* =====================================================
   로그아웃
===================================================== */

window.logout =
async function(){

    await signOut(auth);

};


/* =====================================================
   로그인 모달
===================================================== */

window.openLoginModal =
function(){

    document
        .getElementById(
            "loginModal"
        )
        .classList.add("show");

};


window.closeLoginModal =
function(){

    document
        .getElementById(
            "loginModal"
        )
        .classList.remove("show");

};


/* =====================================================
   매물 모달
===================================================== */

window.openPropertyModal =
function(property=null){

    if(
        !currentUser ||
        currentUser.email !== ADMIN_EMAIL
    ){

        alert(
            "관리자만 매물을 등록할 수 있습니다."
        );

        return;
    }


    editingPropertyId =
        property
        ? property.id
        : null;


    document
        .getElementById(
            "propertyModalTitle"
        )
        .textContent =
        property
        ? "매물 수정"
        : "매물 등록";


    document
        .getElementById(
            "propertyId"
        )
        .value =
        property
        ? property.id
        : "";


    document
        .getElementById(
            "propertyType"
        )
        .value =
        property?.type ||
        "상가";


    document
        .getElementById(
            "propertyTitle"
        )
        .value =
        property?.title ||
        "";


    document
        .getElementById(
            "propertyAddress"
        )
        .value =
        property?.address ||
        "";


    document
        .getElementById(
            "propertyDeposit"
        )
        .value =
        property?.deposit ||
        "";


    document
        .getElementById(
            "propertyRent"
        )
        .value =
        property?.rent ||
        "";


    document
        .getElementById(
            "propertyArea"
        )
        .value =
        property?.area ||
        "";


    document
        .getElementById(
            "propertyFloor"
        )
        .value =
        property?.floor ||
        "";


    document
        .getElementById(
            "propertyDescription"
        )
        .value =
        property?.description ||
        "";


    const addressInput =
        document
            .getElementById(
                "propertyAddress"
            );


    if(property?.lat){

        addressInput.dataset.lat =
            property.lat;

        addressInput.dataset.lng =
            property.lng;

    }else{

        delete addressInput.dataset.lat;
        delete addressInput.dataset.lng;

    }


    document
        .getElementById(
            "propertyError"
        )
        .textContent =
        "";


    document
        .getElementById(
            "addressResult"
        )
        .textContent =
        property?.lat
        ? "✓ 저장된 위치가 있습니다."
        : "";


    document
        .getElementById(
            "propertyModal"
        )
        .classList.add("show");

};


window.closePropertyModal =
function(){

    document
        .getElementById(
            "propertyModal"
        )
        .classList.remove("show");

};


/* =====================================================
   매물 저장
===================================================== */

window.saveProperty =
async function(){

    if(
        !currentUser ||
        currentUser.email !== ADMIN_EMAIL
    ){

        alert(
            "관리자만 저장할 수 있습니다."
        );

        return;
    }


    const addressInput =
        document
            .getElementById(
                "propertyAddress"
            );


    const address =
        addressInput.value.trim();


    const title =
        document
            .getElementById(
                "propertyTitle"
            )
            .value
            .trim();


    const type =
        document
            .getElementById(
                "propertyType"
            )
            .value;


    const deposit =
        document
            .getElementById(
                "propertyDeposit"
            )
            .value
            .trim();


    const rent =
        document
            .getElementById(
                "propertyRent"
            )
            .value
            .trim();


    const area =
        document
            .getElementById(
                "propertyArea"
            )
            .value
            .trim();


    const floor =
        document
            .getElementById(
                "propertyFloor"
            )
            .value
            .trim();


    const description =
        document
            .getElementById(
                "propertyDescription"
            )
            .value
            .trim();


    const error =
        document
            .getElementById(
                "propertyError"
            );


    error.textContent = "";


    if(!title){

        error.textContent =
            "매물명을 입력해주세요.";

        return;
    }


    if(!address){

        error.textContent =
            "주소를 입력해주세요.";

        return;
    }


    /* -----------------------------------------
       좌표가 없으면 주소를 자동 검색
    ----------------------------------------- */

    let lat =
        Number(
            addressInput.dataset.lat
        );

    let lng =
        Number(
            addressInput.dataset.lng
        );


    if(!lat || !lng){

        if(!geocoder){

            error.textContent =
                "카카오 지도 준비가 되지 않았습니다.";

            return;
        }


        const result =
            await geocodeAddress(
                address
            );


        if(!result){

            error.textContent =
                "주소를 찾지 못했습니다. 정확한 주소를 입력해주세요.";

            return;
        }


        lat =
            result.lat;

        lng =
            result.lng;

    }


    const data = {

        type:type,

        title:title,

        address:address,

        deposit:deposit,

        rent:rent,

        area:area,

        floor:floor,

        description:description,

        lat:lat,

        lng:lng,

        updatedAt:
            serverTimestamp(),

        updatedBy:
            currentUser.email

    };


    try{

        if(editingPropertyId){

            await updateDoc(

                doc(
                    db,
                    "properties",
                    editingPropertyId
                ),

                data

            );

        }else{

            data.createdAt =
                serverTimestamp();

            data.createdBy =
                currentUser.email;


            await addDoc(

                collection(
                    db,
                    "properties"
                ),

                data

            );

        }


        closePropertyModal();


        if(temporaryMarker){

            temporaryMarker.setMap(null);

            temporaryMarker = null;

        }


    }catch(e){

        console.error(e);

        error.textContent =
            "저장 중 오류가 발생했습니다.";

    }

};


/* =====================================================
   주소 → 좌표 Promise
===================================================== */

function geocodeAddress(address){

    return new Promise(
        function(resolve){

            geocoder.addressSearch(

                address,

                function(
                    results,
                    status
                ){

                    if(
                        status ===
                        kakao.maps.services.Status.OK
                    ){

                        const item =
                            results[0];

                        resolve({

                            lat:
                                Number(
                                    item.y
                                ),

                            lng:
                                Number(
                                    item.x
                                )

                        });

                    }else{

                        resolve(null);

                    }

                }

            );

        }
    );

}


/* =====================================================
   Firestore 실시간 매물
===================================================== */

onSnapshot(

    collection(
        db,
        "properties"
    ),

    function(snapshot){

        properties =
            snapshot.docs.map(
                function(item){

                    return {

                        id:item.id,

                        ...item.data()

                    };

                }
            );


        renderPropertyList();

        renderMarkers();

    },

    function(error){

        console.error(
            "Firestore 오류:",
            error
        );

        document
            .getElementById(
                "propertyList"
            )
            .innerHTML =

            `<div class="login-required">
                매물을 불러오지 못했습니다.
            </div>`;

    }

);


/* =====================================================
   매물 목록
===================================================== */

function renderPropertyList(){

    const list =
        document
            .getElementById(
                "propertyList"
            );


    if(!properties.length){

        list.innerHTML =

            `<div class="login-required">
                등록된 매물이 없습니다.
            </div>`;

        return;
    }


    list.innerHTML =
        properties
            .map(
                function(property){

                    return `

                    <div
                        class="property-card"
                        onclick="focusProperty('${property.id}')">

                        <div class="property-type">
                            ${escapeHtml(property.type || "매물")}
                        </div>

                        <div class="property-title">
                            ${escapeHtml(property.title || "")}
                        </div>

                        <div class="property-address">
                            📍 ${escapeHtml(property.address || "")}
                        </div>

                        <div class="property-price">
                            ${escapeHtml(property.deposit || "")}
                            /
                            ${escapeHtml(property.rent || "")}
                        </div>

                        <div class="property-info">

                            ${escapeHtml(property.area || "")}

                            ${property.floor
                                ? " · " + escapeHtml(property.floor)
                                : ""}

                            ${property.description
                                ? "<br>" + escapeHtml(property.description)
                                : ""}

                        </div>


                        ${
                            currentUser &&
                            currentUser.email === ADMIN_EMAIL
                            ?

                            `

                            <div class="card-buttons">

                                <button
                                    class="btn-light"
                                    onclick="event.stopPropagation(); editProperty('${property.id}')">
                                    수정
                                </button>

                                <button
                                    class="btn-danger"
                                    onclick="event.stopPropagation(); deleteProperty('${property.id}')">
                                    삭제
                                </button>

                            </div>

                            `

                            :

                            ""

                        }

                    </div>

                    `;

                }
            )
            .join("");

}


/* =====================================================
   지도 마커
===================================================== */

function renderMarkers(){

    if(
        !mapReady ||
        !map
    ){

        return;
    }


    markers.forEach(
        function(marker){

            marker.setMap(null);

        }
    );


    markers = [];


    properties.forEach(
        function(property){

            if(
                !property.lat ||
                !property.lng
            ){

                return;
            }


            const position =
                new kakao.maps.LatLng(
                    Number(property.lat),
                    Number(property.lng)
                );


            const marker =
                new kakao.maps.Marker({

                    position:
                        position,

                    map:
                        map

                });


            const infoWindow =
                new kakao.maps.InfoWindow({

                    content:

                    `

                    <div style="
                        padding:10px;
                        min-width:190px;
                        font-size:13px;
                        line-height:1.5;
                    ">

                        <strong>
                            ${escapeHtml(property.title || "")}
                        </strong>

                        <br>

                        ${escapeHtml(property.address || "")}

                        <br>

                        <b>
                            ${escapeHtml(property.deposit || "")}
                            /
                            ${escapeHtml(property.rent || "")}
                        </b>

                    </div>

                    `

                });


            kakao.maps.event.addListener(

                marker,

                "click",

                function(){

                    infoWindow.open(
                        map,
                        marker
                    );

                }

            );


            markers.push(marker);

        }
    );

}


/* =====================================================
   매물 위치 이동
===================================================== */

window.focusProperty =
function(id){

    const property =
        properties.find(
            function(item){

                return item.id === id;

            }
        );


    if(
        !property ||
        !property.lat ||
        !property.lng
    ){

        return;
    }


    const position =
        new kakao.maps.LatLng(
            Number(property.lat),
            Number(property.lng)
        );


    map.setCenter(
        position
    );

    map.setLevel(3);

};


/* =====================================================
   매물 수정
===================================================== */

window.editProperty =
function(id){

    if(
        !currentUser ||
        currentUser.email !== ADMIN_EMAIL
    ){

        alert(
            "관리자만 수정할 수 있습니다."
        );

        return;
    }


    const property =
        properties.find(
            function(item){

                return item.id === id;

            }
        );


    if(property){

        openPropertyModal(
            property
        );

    }

};


/* =====================================================
   매물 삭제
===================================================== */

window.deleteProperty =
async function(id){

    if(
        !currentUser ||
        currentUser.email !== ADMIN_EMAIL
    ){

        alert(
            "관리자만 삭제할 수 있습니다."
        );

        return;
    }


    const ok =
        confirm(
            "이 매물을 삭제하시겠습니까?"
        );


    if(!ok){

        return;

    }


    try{

        await deleteDoc(

            doc(
                db,
                "properties",
                id
            )

        );

    }catch(e){

        console.error(e);

        alert(
            "삭제 중 오류가 발생했습니다."
        );

    }

};


/* =====================================================
   HTML 보안 처리
===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   초기 실행
===================================================== */

window.addEventListener(
    "load",
    function(){

        initKakaoMap();

    }
);

</script>
