<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>현지공인중개사 매물지도</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif;
    color:#151827;
    background:#f5f6fa;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}

.header{
    height:74px;
    background:#fff;
    border-bottom:1px solid #e4e6ed;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    position:relative;
    z-index:1000;
}

.logo{
    font-size:24px;
    font-weight:900;
    display:flex;
    align-items:center;
    gap:10px;
}

.contact{
    display:flex;
    align-items:center;
    gap:20px;
    font-weight:800;
    color:#333846;
}

.contact a{
    color:inherit;
    text-decoration:none;
}

.authArea{
    display:flex;
    align-items:center;
    gap:12px;
}

.loginBtn{
    border:0;
    background:#5368df;
    color:#fff;
    border-radius:12px;
    padding:12px 18px;
    font-weight:800;
}

.logoutBtn{
    border:1px solid #ddd;
    background:#fff;
    border-radius:10px;
    padding:10px 14px;
}

.adminText{
    font-size:13px;
    color:#5368df;
    font-weight:800;
}

.layout{
    width:100%;
    height:calc(100vh - 74px);
    display:flex;
}

.mapArea{
    position:relative;
    flex:1;
    min-width:0;
    height:100%;
}

#map{
    width:100%;
    height:100%;
}

.searchBox{
    position:absolute;
    left:20px;
    top:20px;
    z-index:20;
    display:flex;
    width:480px;
    max-width:calc(100% - 40px);
    box-shadow:0 5px 20px rgba(0,0,0,.13);
    border-radius:14px;
    overflow:hidden;
}

.searchBox input{
    flex:1;
    height:54px;
    border:0;
    outline:0;
    padding:0 18px;
    background:#fff;
    font-size:16px;
}

.searchBtn{
    width:76px;
    border:0;
    background:#596de1;
    color:#fff;
    font-weight:900;
}

.side{
    width:420px;
    height:100%;
    background:#fff;
    border-left:1px solid #e2e4eb;
    overflow-y:auto;
    z-index:30;
}

.sideTop{
    padding:16px;
    border-bottom:1px solid #e7e8ee;
    position:sticky;
    top:0;
    background:#fff;
    z-index:5;
}

.categories{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.cat{
    border:1px solid #dfe2e9;
    background:#fff;
    border-radius:10px;
    padding:10px 14px;
    font-weight:800;
}

.cat.active{
    background:#5368df;
    color:#fff;
    border-color:#5368df;
}

.adminPanelBtn,
.requestBtn{
    width:100%;
    margin-top:10px;
    padding:13px;
    border:0;
    border-radius:10px;
    font-weight:900;
}

.adminPanelBtn{
    background:#171a28;
    color:#fff;
}

.requestBtn{
    background:#f2f4ff;
    color:#5368df;
}

.countInfo{
    margin-top:14px;
    font-size:14px;
    color:#777d8c;
}

.countInfo strong{
    color:#5368df;
}

.list{
    padding:12px;
}

.propertyCard{
    border:1px solid #e5e7ec;
    border-radius:16px;
    margin-bottom:12px;
    overflow:hidden;
    background:#fff;
    transition:.15s;
}

.propertyCard:hover{
    box-shadow:0 8px 25px rgba(0,0,0,.08);
    transform:translateY(-1px);
}

.cardImg{
    width:100%;
    height:190px;
    object-fit:cover;
    background:#f1f2f6;
}

.noImg{
    width:100%;
    height:190px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f1f2f6;
    color:#a1a5af;
    font-weight:800;
}

.cardBody{
    padding:15px;
}

.badge{
    display:inline-block;
    padding:6px 10px;
    border-radius:8px;
    background:#eef1ff;
    color:#5368df;
    font-size:13px;
    font-weight:900;
}

.cardTitle{
    margin:9px 0 5px;
    font-size:18px;
    font-weight:900;
}

.cardAddress{
    color:#737887;
    font-size:14px;
}

.price{
    margin-top:12px;
    font-weight:900;
    font-size:17px;
}

.premium{
    color:#c45b2e;
    margin-left:8px;
}

.cardBottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
    color:#707583;
    font-size:13px;
}

.dongCount{
    background:#fff;
    border-radius:14px;
    padding:10px 16px;
    box-shadow:0 4px 15px rgba(0,0,0,.16);
    font-weight:900;
    border:1px solid #e1e4eb;
    white-space:nowrap;
}

.dongCount strong{
    color:#5368df;
    font-size:20px;
    margin-right:5px;
}

.modalBg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.58);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:5000;
    padding:20px;
}

.modalBg.show{
    display:flex;
}

.modal{
    width:760px;
    max-width:100%;
    max-height:92vh;
    overflow-y:auto;
    background:#fff;
    border-radius:22px;
    position:relative;
    box-shadow:0 25px 70px rgba(0,0,0,.3);
}

.close{
    position:absolute;
    right:18px;
    top:15px;
    z-index:20;
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.92);
    font-size:28px;
    line-height:1;
    color:#222;
}

.detailImg{
    width:100%;
    height:360px;
    object-fit:cover;
    background:#f2f3f6;
}

.detailNoImg{
    width:100%;
    height:260px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f2f3f6;
    color:#aaa;
    font-weight:800;
}

.detail{
    padding:26px;
}

.detail h2{
    margin:12px 0 20px;
    font-size:27px;
}

.row{
    display:grid;
    grid-template-columns:100px 1fr;
    border-bottom:1px solid #e7e8ec;
    padding:15px 0;
    gap:15px;
}

.row strong{
    color:#6c7180;
}

.detailCall{
    display:block;
    margin-top:22px;
    padding:17px;
    border-radius:13px;
    background:#151827;
    color:#fff;
    text-align:center;
    font-size:18px;
    font-weight:900;
    text-decoration:none;
}

.external{
    display:block;
    margin-top:10px;
    padding:15px;
    border-radius:13px;
    background:#eef1ff;
    color:#5368df;
    text-align:center;
    font-weight:900;
    text-decoration:none;
}

.adminActions{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.editBtn,
.deleteBtn{
    flex:1;
    border:0;
    border-radius:12px;
    padding:15px;
    font-weight:900;
}

.editBtn{
    background:#5368df;
    color:#fff;
}

.deleteBtn{
    background:#fff0ed;
    color:#c4452c;
}

.formModal,
.requestForm{
    max-width:100%;
    max-height:94vh;
    overflow-y:auto;
    background:#fff;
    border-radius:22px;
    padding:26px;
    position:relative;
}

.formModal{width:700px}
.requestForm{width:650px}

.formModal h2,
.requestForm h2{
    margin:0 0 20px;
}

.formGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.formFull{
    grid-column:1 / -1;
}

.field{
    margin-bottom:12px;
}

.field label{
    display:block;
    font-size:13px;
    font-weight:900;
    margin-bottom:7px;
}

.field input,
.field select,
.field textarea{
    width:100%;
    border:1px solid #dcdfe7;
    border-radius:11px;
    padding:13px;
    outline:0;
    background:#fff;
}

.field textarea{
    min-height:120px;
    resize:vertical;
}

.photoPreview{
    width:100%;
    max-height:280px;
    object-fit:cover;
    border-radius:12px;
    display:none;
    margin-top:10px;
}

.formButtons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.formButtons button{
    flex:1;
    padding:15px;
    border-radius:12px;
    border:0;
    font-weight:900;
}

.cancelBtn{
    background:#f1f2f5;
}

.submitBtn{
    background:#5368df;
    color:#fff;
}

.requestNotice{
    background:#f5f6ff;
    color:#596173;
    padding:14px;
    border-radius:12px;
    font-size:13px;
    line-height:1.6;
    margin-bottom:16px;
}

.requestList{
    margin-top:15px;
}

.requestItem{
    border:1px solid #e2e4ea;
    border-radius:12px;
    padding:15px;
    margin-bottom:10px;
}

.requestItem strong{
    display:block;
    margin-bottom:7px;
}

.empty{
    text-align:center;
    padding:70px 20px;
    color:#969ba7;
}

.loading{
    text-align:center;
    padding:40px;
    color:#777;
}

@media(max-width:900px){

    .header{
        height:auto;
        min-height:68px;
        padding:12px 15px;
        flex-wrap:wrap;
        gap:8px;
    }

    .logo{
        font-size:19px;
    }

    .contact{
        display:none;
    }

    .layout{
        height:calc(100vh - 68px);
    }

    .side{
        width:350px;
    }

    .searchBox{
        width:calc(100% - 30px);
        left:15px;
        top:15px;
    }
}

@media(max-width:650px){

    .layout{
        display:block;
        position:relative;
        height:calc(100vh - 68px);
    }

    /* 모바일에서 지도 높이를 줄여 아래 매물 메뉴를 더 크게 표시 */
    .mapArea{
        height:38%;
        min-height:260px;
    }

    /* 모바일에서 카테고리와 매물목록을 더 넓게 사용 */
    .side{
        width:100%;
        height:62%;
        border-left:0;
        border-top:1px solid #ddd;
        overflow-y:auto;
    }

    .formGrid{
        grid-template-columns:1fr;
    }

    .formFull{
        grid-column:auto;
    }

    .detailImg{
        height:260px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        📍 <span>현지공인중개사 매물지도</span>
    </div>

    <div class="contact">
        <a href="tel:0414141124">041-414-1124</a>
        <a href="tel:01082793919">010-8279-3919</a>
    </div>

    <div class="authArea" id="authArea">
        <button class="loginBtn" onclick="googleLogin()">
            Google 로그인
        </button>
    </div>

</header>

<div class="layout">

    <main class="mapArea">

        <div class="searchBox">

            <input
                id="searchInput"
                placeholder="주소·동·매물명 검색"
                onkeydown="if(event.key==='Enter') searchProperties()"
            >

            <button
                class="searchBtn"
                onclick="searchProperties()"
            >
                검색
            </button>

        </div>

        <div id="map"></div>

    </main>

    <aside class="side">

        <div class="sideTop">

            <div class="categories">

                <button class="cat active"
                    onclick="selectCategory('전체',this)">
                    전체
                </button>

                <button class="cat"
                    onclick="selectCategory('상가',this)">
                    상가
                </button>

                <button class="cat"
                    onclick="selectCategory('공장',this)">
                    공장
                </button>

                <button class="cat"
                    onclick="selectCategory('토지',this)">
                    토지
                </button>

                <button class="cat"
                    onclick="selectCategory('원·투룸',this)">
                    원·투룸
                </button>

                <button class="cat"
                    onclick="selectCategory('주택',this)">
                    주택
                </button>

                <button class="cat"
                    onclick="selectCategory('아파트',this)">
                    아파트
                </button>

            </div>

            <button
                class="requestBtn"
                onclick="openRequestModal()"
            >
                📝 매물접수
            </button>

            <button
                id="adminPanelBtn"
                class="adminPanelBtn"
                style="display:none"
                onclick="openAdminPanel()"
            >
                🔐 관리자 매물관리
            </button>

            <div
                class="countInfo"
                id="countInfo"
            >
                매물 불러오는 중...
            </div>

        </div>

        <div
            class="list"
            id="propertyList"
        >
            <div class="loading">
                매물을 불러오는 중입니다.
            </div>
        </div>

    </aside>
</div>


<div
    class="modalBg"
    id="detailModal"
    onclick="backgroundClose(event,'detailModal')"
>

    <div
        class="modal"
        id="detailContent"
        onclick="event.stopPropagation()"
    ></div>

</div>


<div
    class="modalBg"
    id="propertyModal"
    onclick="backgroundClose(event,'propertyModal')"
>

    <div
        class="formModal"
        onclick="event.stopPropagation()"
    >

        <button
            class="close"
            onclick="closeModal('propertyModal')"
        >
            ×
        </button>

        <h2 id="propertyFormTitle">
            매물 등록
        </h2>

        <form id="propertyForm">

            <input
                type="hidden"
                id="editId"
            >

            <div class="formGrid">

                <div class="field formFull">

                    <label>매물 제목</label>

                    <input
                        id="fTitle"
                        required
                        placeholder="예: 두정동 1층 상가"
                    >

                </div>

                <div class="field">

                    <label>주소</label>

                    <input
                        id="fAddress"
                        required
                        placeholder="예: 성정동 666-5"
                    >

                </div>

                <div class="field">

                    <label>매물 종류</label>

                    <select id="fType">

                        <option>상가</option>
                        <option>공장</option>
                        <option>토지</option>
                        <option>원·투룸</option>
                        <option>주택</option>
                        <option>아파트</option>

                    </select>

                </div>

                <div class="field">

                    <label>보증금(만원)</label>

                    <input
                        id="fDeposit"
                        type="number"
                        min="0"
                    >

                </div>

                <div class="field">

                    <label>월세(만원)</label>

                    <input
                        id="fRent"
                        type="number"
                        min="0"
                    >

                </div>

                <div class="field">

                    <label>매매가(만원)</label>

                    <input
                        id="fSale"
                        type="number"
                        min="0"
                    >

                </div>

                <div class="field">

                    <label>권리금(만원)</label>

                    <input
                        id="fPremium"
                        type="number"
                        min="0"
                        placeholder="없으면 0"
                    >

                </div>

                <div class="field">

                    <label>면적(㎡)</label>

                    <input
                        id="fArea"
                        type="number"
                        step="0.01"
                    >

                </div>

                <div class="field">

                    <label>층</label>

                    <input
                        id="fFloor"
                        placeholder="예: 1층"
                    >

                </div>

                <div class="field">

                    <label>관리비(만원)</label>

                    <input
                        id="fMaintenance"
                        type="number"
                        min="0"
                    >

                </div>

                <div class="field formFull">

                    <label>상세정보 사이트 주소</label>

                    <input
                        id="fDetailUrl"
                        type="url"
                        placeholder="https://..."
                    >

                </div>

                <div class="field formFull">

                    <label>매물 설명</label>

                    <textarea
                        id="fDescription"
                        placeholder="매물의 특징과 장점을 입력하세요."
                    ></textarea>

                </div>

                <div class="field formFull">

                    <label>대표사진 1장</label>

                    <input
                        id="fImage"
                        type="file"
                        accept="image/*"
                        onchange="previewPhoto(this)"
                    >

                    <img
                        id="photoPreview"
                        class="photoPreview"
                    >

                </div>

            </div>

            <div class="formButtons">

                <button
                    type="button"
                    class="cancelBtn"
                    onclick="closeModal('propertyModal')"
                >
                    취소
                </button>

                <button
                    type="submit"
                    class="submitBtn"
                >
                    매물 등록
                </button>

            </div>

        </form>

    </div>

</div>


<div
    class="modalBg"
    id="requestModal"
    onclick="backgroundClose(event,'requestModal')"
>

    <div
        class="requestForm"
        onclick="event.stopPropagation()"
    >

        <button
            class="close"
            onclick="closeModal('requestModal')"
        >
            ×
        </button>

        <h2>📝 매물 접수</h2>

        <div class="requestNotice">
            접수해주신 내용은 현지공인중개사에서 확인 후 연락드립니다.
            <br>
            입력하신 매물 정보는 일반 방문자에게 공개되지 않습니다.
        </div>

        <form id="requestForm">

            <div class="field">
                <label>성함</label>
                <input id="rName" required>
            </div>

            <div class="field">
                <label>연락처</label>
                <input
                    id="rPhone"
                    required
                    placeholder="010-0000-0000"
                >
            </div>

            <div class="field">
                <label>매물 종류</label>

                <select id="rType">
                    <option>상가</option>
                    <option>공장</option>
                    <option>토지</option>
                    <option>원·투룸</option>
                    <option>주택</option>
                    <option>아파트</option>
                </select>
            </div>

            <div class="field">
                <label>매물 주소</label>

                <input
                    id="rAddress"
                    required
                    placeholder="주소를 입력해주세요."
                >
            </div>

            <div class="field">
                <label>접수 내용</label>

                <textarea
                    id="rDescription"
                    required
                    placeholder="보증금, 월세, 매매가, 면적, 권리금 등 알고 계신 내용을 적어주세요."
                ></textarea>
            </div>

            <div class="formButtons">

                <button
                    type="button"
                    class="cancelBtn"
                    onclick="closeModal('requestModal')"
                >
                    취소
                </button>

                <button
                    type="submit"
                    class="submitBtn"
                >
                    매물 접수하기
                </button>

            </div>

        </form>

    </div>

</div>


<div
    class="modalBg"
    id="adminRequestModal"
    onclick="backgroundClose(event,'adminRequestModal')"
>

    <div
        class="requestForm"
        onclick="event.stopPropagation()"
    >

        <button
            class="close"
            onclick="closeModal('adminRequestModal')"
        >
            ×
        </button>

        <h2>🔐 관리자 매물관리</h2>

        <button
            class="submitBtn"
            style="
                width:100%;
                border:0;
                padding:15px;
                border-radius:12px;
                font-weight:900;
            "
            onclick="
                closeModal('adminRequestModal');
                openPropertyForm();
            "
        >
            + 새 매물 등록
        </button>

        <div
            id="requestList"
            class="requestList"
        >
            불러오는 중...
        </div>

    </div>

</div>


<script type="module">

async function loadInitialProperties(){

    properties = [];

    lastVisible = null;

    hasMoreProperties = true;


    document.getElementById(
        "propertyList"
    ).innerHTML = `

        <div class="loading">
            매물을 불러오는 중입니다.
        </div>

    `;


    await loadNextPage();

}


async function loadNextPage(){

    if(
        isLoadingMore ||
        !hasMoreProperties
    ){
        return;
    }


    isLoadingMore = true;


    try{

        let q;


        if(lastVisible){

            q =
                query(
                    collection(
                        db,
                        "properties"
                    ),
                    orderBy(
                        "createdAt",
                        "desc"
                    ),
                    startAfter(
                        lastVisible
                    ),
                    limit(
                        PAGE_SIZE
                    )
                );

        }
        else{

            q =
                query(
                    collection(
                        db,
                        "properties"
                    ),
                    orderBy(
                        "createdAt",
                        "desc"
                    ),
                    limit(
                        PAGE_SIZE
                    )
                );

        }


        let snapshot;


        try{

            snapshot =
                await getDocs(q);

        }
        catch(error){

            const fallback =
                await getDocs(
                    collection(
                        db,
                        "properties"
                    )
                );


            const all =
                fallback.docs.map(
                    d => ({
                        id:d.id,
                        ...d.data()
                    })
                );


            all.sort(
                (a,b) =>
                timestampValue(
                    b.createdAt
                )
                -
                timestampValue(
                    a.createdAt
                )
            );


            properties =
                all.slice(
                    0,
                    PAGE_SIZE
                );


            hasMoreProperties =
                all.length >
                PAGE_SIZE;


            lastVisible = null;

            applyFilter();

            isLoadingMore = false;

            return;

        }


        if(
            snapshot.empty
        ){

            hasMoreProperties =
                false;

            isLoadingMore = false;

            applyFilter();

            return;

        }


        const newProperties =
            snapshot.docs.map(
                d => ({
                    id:d.id,
                    ...d.data()
                })
            );


        properties =
            mergeProperties(
                properties,
                newProperties
            );


        lastVisible =
            snapshot.docs[
                snapshot.docs.length - 1
            ];


        if(
            snapshot.docs.length <
            PAGE_SIZE
        ){

            hasMoreProperties =
                false;

        }


        applyFilter();

    }
    catch(error){

        console.error(error);

        document.getElementById(
            "propertyList"
        ).innerHTML = `

            <div class="empty">
                매물을 불러오지 못했습니다.
                <br><br>
                ${escapeHtml(
                    error.message
                )}
            </div>

        `;

    }
    finally{

        isLoadingMore = false;

    }

}


function mergeProperties(
    oldList,
    newList
){

    const mapData =
        new Map();


    oldList.forEach(
        p =>
        mapData.set(
            p.id,
            p
        )
    );


    newList.forEach(
        p =>
        mapData.set(
            p.id,
            p
        )
    );


    return Array.from(
        mapData.values()
    );

}

async function searchProperties(){

    const keyword =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toLowerCase();


    let result =
        filterLocal(
            keyword
        );


    if(
        keyword &&
        result.length === 0 &&
        hasMoreProperties
    ){

        document.getElementById(
            "propertyList"
        ).innerHTML = `

            <div class="loading">
                검색 중...
            </div>

        `;


        let safety = 0;


        while(
            result.length === 0 &&
            hasMoreProperties &&
            safety < 50
        ){

            await loadNextPage();

            result =
                filterLocal(
                    keyword
                );

            safety++;

        }

    }


    applyFilter();

}


function filterLocal(
    keyword
){

    return properties.filter(
        p => {

            const typeOK =
                currentCategory ===
                "전체"
                ||
                p.type ===
                currentCategory;


            if(!typeOK){
                return false;
            }


            if(!keyword){
                return true;
            }


            const text = (

                (p.title || "")
                + " "
                + (p.address || "")
                + " "
                + (p.description || "")
                + " "
                + getDong(
                    p.address || ""
                )

            ).toLowerCase();


            return text.includes(
                keyword
            );

        }
    );

}


function applyFilter(){

    const keyword =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toLowerCase();


    filteredProperties =
        filterLocal(
            keyword
        );


    renderList();

    renderMarkers();

    updateCount();

}

function getDong(address){

    if(!address){
        return "";
    }


    const match =
        address.match(
            /([가-힣]+동)/
        );


    return match
        ? match[1]
        : "";

}

    }
    else{

    }


    const premium =
        p.premium &&
        Number(p.premium) > 0

        ?

        `

        </span>

    return `

            class="propertyCard"

                <span class="badge">

                        p.type || "기타"
                    )}

                        p.title || "매물"
                    )}
                </div>

                </div>

                <div class="price">
                    ${price}
                    ${premium}
                </div>

                <div class="cardBottom">

                    <span>
                        ${getDong(
                            p.address || ""
                        )}
                    </span>

                    <span>
                        ${
                            p.area
                            ?
                            p.area + "㎡"
                            :
                            ""
                        }
                    </span>

                </div>

            </div>

        </div>

    `;

}


function renderMarkers(){

    if(!map){
        return;
    }


    markers.forEach(
        marker =>
        marker.setMap(null)
    );


    overlays.forEach(
        overlay =>
        overlay.setMap(null)
    );


    markers = [];

    overlays = [];


    const geocoder =
        new kakao.maps.services.Geocoder();


    filteredProperties
    .slice(0,50)
    .forEach(
        p => {

            if(!p.address){
                return;
            }


            geocoder.addressSearch(
                p.address,
                function(
                    result,
                    status
                ){

                    if(
                        status !==
                        kakao.maps.services.Status.OK
                    ){
                        return;
                    }


                    const position =
                        new kakao.maps.LatLng(
                            result[0].y,
                            result[0].x
                        );


                    const marker =
                        new kakao.maps.Marker({
                            map:map,
                            position:position
                        });


                    markers.push(
                        marker
                    );


                    kakao.maps.event.addListener(
                        marker,
                        "click",
                        function(){

                            openDetail(p);

                        }
                    );

                }
            );

        }
    );


    const dongMap = {};


    filteredProperties.forEach(
        p => {

            const dong =
                getDong(
                    p.address || ""
                );


            if(!dong){
                return;
            }


            if(
                !dongMap[dong]
            ){

                dongMap[dong] = {
                    count:0,
                    property:p
                };

            }


            dongMap[dong].count++;

        }
    );


    Object.values(
        dongMap
    )
    .forEach(
        item => {

            const p =
                item.property;


            if(!p.address){
                return;
            }


            geocoder.addressSearch(
                p.address,
                function(
                    result,
                    status
                ){

                    if(
                        status !==
                        kakao.maps.services.Status.OK
                    ){
                        return;
                    }


                    const position =
                        new kakao.maps.LatLng(
                            result[0].y,
                            result[0].x
                        );


                    const dong =
                        getDong(
                            p.address
                        );


                    const content = `

                        <div class="dongCount">

                            <strong>
                                ${item.count}
                            </strong>

                            ${escapeHtml(
                                dong
                            )}

                        </div>

                    `;


                    const overlay =
                        new kakao.maps.CustomOverlay({

                            position:
                                position,

                            content:
                                content,

                            yAnchor:
                                1.8

                        });


                    overlay.setMap(
                        map
                    );


                    overlays.push(
                        overlay
                    );

                }
            );

        }
    );

}

async function removePropertyFromDetail(
    id
){

    if(
        !currentUser ||
        currentUser.email !==
        ADMIN_EMAIL
    ){

        alert(
            "관리자만 삭제할 수 있습니다."
        );

        return;

    }


    const property =
        properties.find(
            p =>
            p.id === id
        );


    if(!property){

        alert(
            "매물을 찾을 수 없습니다."
        );

        return;

    }


    const ok =
        confirm(
            "정말 이 매물을 삭제하시겠습니까?\n\n"
            +
            (
                property.title ||
                property.address ||
                "해당 매물"
            )
        );


    if(!ok){
        return;
    }


    try{

        await deleteDoc(
            doc(
                db,
                "properties",
                id
            )
        );


        properties =
            properties.filter(
                p =>
                p.id !== id
            );


        closeModal(
            "detailModal"
        );


        applyFilter();


        alert(
            "매물이 삭제되었습니다."
        );

    }
    catch(error){

        console.error(error);

        alert(
            "삭제 중 오류가 발생했습니다.\n\n"
            +
            error.message
        );

    }

}


function compressImage(
    file
){

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const reader =
                new FileReader();


            reader.onload =
            function(){

                const img =
                    new Image();


                img.onload =
                function(){

                    const maxWidth =
                        1200;


                    let width =
                        img.width;


                    let height =
                        img.height;


                    if(
                        width >
                        maxWidth
                    ){

                        height =
                            Math.round(
                                height *
                                maxWidth /
                                width
                            );

                        width =
                            maxWidth;

                    }


                    const canvas =
                        document.createElement(
                            "canvas"
                        );


                    canvas.width =
                        width;

                    canvas.height =
                        height;


                    const ctx =
                        canvas.getContext(
                            "2d"
                        );


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );


                    resolve(
                        canvas.toDataURL(
                            "image/jpeg",
                            0.72
                        )
                    );

                };


                img.onerror =
                    reject;


                img.src =
                    reader.result;

            };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );

        }
    );

}


async function previewPhoto(
    input
){

    const file =
        input.files[0];


    if(!file){
        return;
    }


    try{

        const data =
            await compressImage(
                file
            );


        const preview =
            document.getElementById(
                "photoPreview"
            );


        preview.src =
            data;


        preview.style.display =
            "block";


        preview.dataset.value =
            data;

    }
    catch(error){

        alert(
            "사진을 읽을 수 없습니다."
        );

    }

}

async function loadRequests(){

    if(
        !currentUser ||
        currentUser.email !==
        ADMIN_EMAIL
    ){
        return;
    }


    const container =
        document.getElementById(
            "requestList"
        );


    if(!container){
        return;
    }


    container.innerHTML =
        "접수내역을 불러오는 중...";


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "propertyRequests"
                )
            );


        if(snapshot.empty){

            container.innerHTML = `

                <div class="empty">
                    접수된 매물이 없습니다.
                </div>

            `;

            return;

        }


        const requests =
            snapshot.docs
            .map(
                d => ({
                    id:d.id,
                    ...d.data()
                })
            )
            .sort(
                (a,b) =>
                timestampValue(
                    b.createdAt
                )
                -
                timestampValue(
                    a.createdAt
                )
            );


        container.innerHTML =
            requests
            .map(
                r => `

                    <div
                        class="requestItem"
                    >

                        <strong>
                            ${escapeHtml(
                                r.type || ""
                            )}
                        </strong>

                        <div>
                            👤
                            ${escapeHtml(
                                r.name || ""
                            )}
                        </div>

                        <div>
                            ☎
                            ${escapeHtml(
                                r.phone || ""
                            )}
                        </div>

                        <div>
                            📍
                            ${escapeHtml(
                                r.address || ""
                            )}
                        </div>

                        <div
                            style="
                            margin-top:10px;
                            white-space:pre-wrap;
                            "
                        >
                            ${escapeHtml(
                                r.description || ""
                            )}
                        </div>

                    </div>

                `
            )
            .join("");

    }
    catch(error){

        console.error(error);

        container.innerHTML = `

            <div class="empty">
                접수내역을 불러오지 못했습니다.
            </div>

        `;

    }

}


function getValue(id){

    return document
        .getElementById(id)
        .value
        .trim();

}


function setValue(
    id,
    value
){

    document
        .getElementById(id)
        .value =
        value ?? "";

}


function numberValue(id){

    const value =
        document
        .getElementById(id)
        .value;


    return value
        ? Number(value)
        : 0;

}


function money(value){

    return (
        Number(
            value || 0
        )
        .toLocaleString("ko-KR")
        +
        "만원"
    );

}


function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function normalizeUrl(url){

    if(!url){
        return "";
    }


    if(
        /^https?:\/\//i.test(
            url
        )
    ){

        return url;

    }


    return "https://" + url;

}


function timestampValue(
    timestamp
){

    if(
        !timestamp
    ){

        return 0;

    }


    if(
        typeof timestamp.toMillis ===
        "function"
    ){

        return timestamp.toMillis();

    }


    return 0;

}


function closeModal(id){

    const element =
        document.getElementById(id);


    if(element){

        element.classList.remove(
            "show"
        );

    }

}


function backgroundClose(
    event,
    id
){

    if(
        event.target.id === id
    ){

        closeModal(id);

    }

}
