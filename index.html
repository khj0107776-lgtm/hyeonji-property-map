  <style>

<script type="module">

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

let currentUser = null;

let properties = [];

let activeType = "";

let map;

let markers = [];

let dongOverlays = [];


const $ = id => document.getElementById(id);


function esc(v=""){

  return String(v).replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}


function n(v){

  return Number(
    String(v || 0).replace(/,/g,"")
  ) || 0;

}


function money(v){

  return n(v)
    ? n(v).toLocaleString()+"만원"
    : "없음";

}


async function compressImage(file){

  if(!file) return "";

  return new Promise((resolve,reject)=>{

    const reader = new FileReader();

    reader.onload = ()=>{

      const img = new Image();

      img.onload = ()=>{

        const max = 1200;

        const scale =
          Math.min(
            1,
            max / Math.max(
              img.width,
              img.height
            )
          );

        const c =
          document.createElement("canvas");

        c.width =
          Math.round(img.width * scale);

        c.height =
          Math.round(img.height * scale);

        const ctx = c.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          c.width,
          c.height
        );

        let quality = .78;

        let data =
          c.toDataURL(
            "image/jpeg",
            quality
          );

        while(
          data.length > 900000 &&
          quality > .35
        ){

          quality -= .06;

          data =
            c.toDataURL(
              "image/jpeg",
              quality
            );

        }

        resolve(data);

      };

      img.onerror = reject;

      img.src = reader.result;

    };

    reader.onerror = reject;

    reader.readAsDataURL(file);

  });

}


function extractDong(address){

  const m =
    String(address || "").match(
      /([가-힣0-9]+(?:동|읍|면|리))(?=\s|$)/
    );

  return m ? m[1] : "";

}


function formatType(t){

  return t === "원투룸"
    ? "원·투룸"
    : t;

}


async function loadProperties(){

  try{

    const snap =
      await getDocs(
        collection(
          db,
          "properties"
        )
      );

    properties =
      snap.docs.map(
        d => ({
          id:d.id,
          ...d.data()
        })
      );

    render();

  }catch(e){

    console.error(e);

    $("count").textContent =
      "매물 불러오기 오류: " +
      e.message;

  }

}


function filtered(){

  const q =
    $("mapSearch")
      .value
      .trim()
      .toLowerCase();

  return properties.filter(p=>{

    const typeOk =
      !activeType ||
      p.type === activeType;

    const text =
      [
        p.title,
        p.address,
        p.dong,
        p.description
      ]
      .join(" ")
      .toLowerCase();

    return (
      typeOk &&
      (!q || text.includes(q))
    );

  });

}


function render(){

  const arr = filtered();

  $("count").textContent =
    `현재 ${arr.length}개 매물 · 동별 매물 수 표시`;


  $("list").innerHTML =
    arr.length

      ? arr.map(p=>`

        <div
          class="card"
          onclick="showDetail('${p.id}')"
        >

          <img
            class="thumb"
            src="${p.image || ""}"
            onerror="this.style.visibility='hidden'"
          >

          <div style="min-width:0">

            <div class="card-title">
              ${esc(p.title || "매물")}
            </div>

            <div class="muted">
              ${esc(p.address || "")}
            </div>

            <div class="muted">
              ${formatType(p.type || "")}
              ·
              ${esc(p.area || "")}
            </div>

            <div class="price">

              ${
                p.deal === "매매"
                  ? "매매"
                  : "보증금 " +
                    money(p.deposit) +
                    " / 월세 " +
                    money(p.rent)
              }

            </div>

          </div>

        </div>

      `).join("")

      : `
        <div class="empty">
          조건에 맞는 매물이 없습니다.
        </div>
      `;


  drawMap(arr);

  renderAdminList();

}


function drawMap(arr = filtered()){

  if(!map) return;


  markers.forEach(
    m => m.setMap(null)
  );

  markers = [];


  dongOverlays.forEach(
    o => o.setMap(null)
  );

  dongOverlays = [];


  const groups = {};


  arr.forEach(p=>{

    if(!p.lat || !p.lng) return;


    const marker =
      new kakao.maps.Marker({

        position:
          new kakao.maps.LatLng(
            p.lat,
            p.lng
          )

      });


    marker.propertyId = p.id;

    marker.setMap(map);


    kakao.maps.event.addListener(
      marker,
      "click",
      () => window.showDetail(p.id)
    );


    markers.push(marker);


    const dong =
      p.dong ||
      extractDong(p.address) ||
      "기타";


    if(!groups[dong])
      groups[dong] = [];


    groups[dong].push(p);

  });


  Object.entries(groups)
    .forEach(([dong,ps])=>{

      const lat =
        ps.reduce(
          (a,p)=>a+Number(p.lat),
          0
        ) / ps.length;

      const lng =
        ps.reduce(
          (a,p)=>a+Number(p.lng),
          0
        ) / ps.length;


      const div =
        document.createElement("div");

      div.className =
        "dong-bubble";


      div.innerHTML =
        `${ps.length}<span>${esc(dong)}</span>`;


      const overlay =
        new kakao.maps.CustomOverlay({

          position:
            new kakao.maps.LatLng(
              lat,
              lng
            ),

          content:div,

          yAnchor:1.7

        });


      overlay.setMap(map);

      dongOverlays.push(overlay);

    });

}


async function geocode(address){

  return new Promise(
    (resolve,reject)=>{

      geocoder.addressSearch(
        address,
        (result,status)=>{

          if(
            status ===
              kakao.maps.services.Status.OK &&
            result.length
          ){

            resolve({

              lat:Number(result[0].y),

              lng:Number(result[0].x)

            });

          }else{

            reject(
              new Error(
                "주소를 지도에서 찾지 못했습니다."
              )
            );

          }

        }
      );

    }
  );

}


window.searchText = ()=>{

  render();

  const q =
    $("mapSearch")
      .value
      .trim();

  if(!q || !geocoder) return;


  geocoder.addressSearch(
    q,
    (result,status)=>{

      if(
        status ===
          kakao.maps.services.Status.OK &&
        result.length
      ){

        map.setCenter(
          new kakao.maps.LatLng(
            result[0].y,
            result[0].x
          )
        );

        map.setLevel(4);

      }

    }
  );

};


window.showDetail = id =>{

  const p =
    properties.find(
      x => x.id === id
    );

  if(!p) return;


  $("dImage").src =
    p.image || "";


  $("dType").textContent =
    formatType(p.type || "");


  $("dDeal").textContent =
    p.deal || "";


  $("dTitle").textContent =
    p.title || "매물";


  $("dAddress").textContent =
    p.address || "";


  $("dDeposit").textContent =
    money(p.deposit);


  $("dRent").textContent =
    money(p.rent);


  $("dPremium").textContent =
    money(p.premium);


  $("dArea").textContent =
    p.area || "-";


  $("dFloor").textContent =
    p.floor || "-";


  $("dFee").textContent =
    p.fee || "-";


  $("dDesc").textContent =
    p.description || "";


  if(p.url){

    $("dUrl").href =
      p.url;

    $("dUrl").style.display =
      "inline-block";

  }else{

    $("dUrl").style.display =
      "none";

  }


  $("detailModal")
    .classList
    .add("show");

};


window.closeDetail = () =>
  $("detailModal")
    .classList
    .remove("show");


window.toggleAdmin = ()=>{

  if(
    !currentUser ||
    currentUser.email !== ADMIN_EMAIL
  ){

    alert(
      "관리자 계정으로 구글 로그인해 주세요."
    );

    return;

  }

  $("adminPanel")
    .classList
    .toggle("show");

};


async function registerProperty(){

  if(
    !currentUser ||
    currentUser.email !== ADMIN_EMAIL
  ){

    alert(
      "관리자 계정만 등록할 수 있습니다."
    );

    return;

  }


  const title =
    $("fTitle")
      .value
      .trim();

  const address =
    $("fAddress")
      .value
      .trim();


  if(!title || !address){

    alert(
      "매물 제목과 주소를 입력하세요."
    );

    return;

  }


  try{

    const pos =
      await geocode(address);


    const file =
      $("fImage")
        .files[0];


    const image =
      await compressImage(file);


    const dong =
      $("fDong")
        .value
        .trim() ||
      extractDong(address);


    await addDoc(
      collection(
        db,
        "properties"
      ),
      {

        title,
        address,
        dong,

        type:
          $("fType").value,

        deal:
          $("fDeal").value,

        deposit:
          n($("fDeposit").value),

        rent:
          n($("fRent").value),

        premium:
          n($("fPremium").value),

        area:
          $("fArea")
            .value
            .trim(),

        floor:
          $("fFloor")
            .value
            .trim(),

        fee:
          $("fFee")
            .value
            .trim(),

        description:
          $("fDesc")
            .value
            .trim(),

        url:
          $("fUrl")
            .value
            .trim(),

        image,

        lat:pos.lat,
        lng:pos.lng,

        createdBy:
          currentUser.email,

        createdAt:
          serverTimestamp()

      }
    );


    alert(
      "매물이 등록되었습니다."
    );


    [
      "fTitle",
      "fAddress",
      "fDeposit",
      "fRent",
      "fPremium",
      "fArea",
      "fFloor",
      "fDong",
      "fFee",
      "fDesc",
      "fUrl"
    ].forEach(
      id => $(id).value = ""
    );


    $("fImage").value = "";

    $("preview")
      .style
      .display = "none";


    await loadProperties();


  }catch(e){

    console.error(e);

    alert(
      "등록 오류: " +
      e.message
    );

  }

}


window.registerProperty =
  registerProperty;


async function deleteProperty(id){

  if(
    !currentUser ||
    currentUser.email !== ADMIN_EMAIL
  ){

    alert(
      "관리자만 삭제할 수 있습니다."
    );

    return;

  }


  const p =
    properties.find(
      x => x.id === id
    );


  if(
    !confirm(
      `"${p?.title || "이 매물"}"을 삭제할까요?`
    )
  ){

    return;

  }


  try{

    await deleteDoc(
      doc(
        db,
        "properties",
        id
      )
    );


    await loadProperties();


  }catch(e){

    alert(
      "삭제 오류: " +
      e.message
    );

  }

}


window.deleteProperty =
  deleteProperty;


function renderAdminList(){

  if(
    !currentUser ||
    currentUser.email !== ADMIN_EMAIL
  ){

    $("adminList").innerHTML = "";

    return;

  }


  $("adminList").innerHTML =
    properties.length

      ? properties.map(p=>`

        <div class="admin-item">

          <button
            class="delete"
            onclick="deleteProperty('${p.id}')"
          >
            삭제
          </button>

          <b>
            ${esc(p.title || "매물")}
          </b>

          <div class="muted">
            ${esc(p.address || "")}
            ·
            ${formatType(p.type || "")}
          </div>

        </div>

      `).join("")

      : `
        <div
          class="muted"
          style="padding:10px 0"
        >
          등록된 매물이 없습니다.
        </div>
      `;

}


$("fImage")
  .addEventListener(
    "change",
    ()=>{

      const file =
        $("fImage")
          .files[0];


      if(!file){

        $("preview")
          .style
          .display = "none";

        return;

      }


      const r =
        new FileReader();


      r.onload =
        e => {

          $("preview").src =
            e.target.result;

          $("preview")
            .style
            .display = "block";

        };


      r.readAsDataURL(file);

    }
  );


document
  .querySelectorAll(".filter")
  .forEach(btn=>{

    btn.addEventListener(
      "click",
      ()=>{

        document
          .querySelectorAll(".filter")
          .forEach(
            x =>
              x.classList
               .remove("active")
          );


        btn.classList
          .add("active");


        activeType =
          btn.dataset.type;


        render();

      }
    );

  });


$("mapSearch")
  .addEventListener(
    "keydown",
    e => {

      if(e.key === "Enter")
        window.searchText();

    }
  );


$("loginBtn")
  .onclick =
  async ()=>{

    try{

      const provider =
        new GoogleAuthProvider();


      await signInWithPopup(
        auth,
        provider
      );


    }catch(e){

      console.error(e);

      alert(
        "Google 로그인 중 오류가 발생했습니다.\n" +
        e.message
      );

    }

  };


$("logoutBtn")
  .onclick =
  () => signOut(auth);


onAuthStateChanged(
  auth,
  user => {

    currentUser = user;


    if(user){

      $("userMail")
        .textContent =
        user.email || "";


      $("loginBtn")
        .style
        .display = "none";


      $("logoutBtn")
        .style
        .display = "inline-block";


      const admin =
        user.email === ADMIN_EMAIL;


      $("adminOpen")
        .classList
        .toggle(
          "show",
          admin
        );


      $("adminForm")
        .style
        .display =
        admin
          ? "block"
          : "none";


      $("notAdmin")
        .style
        .display =
        admin
          ? "none"
          : "block";


      if(admin){

        $("adminPanel")
          .classList
          .add("show");

      }

    }else{

      $("userMail")
        .textContent = "";


      $("loginBtn")
        .style
        .display =
        "inline-block";


      $("logoutBtn")
        .style
        .display =
        "none";


      $("adminOpen")
        .classList
        .remove("show");


      $("adminPanel")
        .classList
        .remove("show");

    }


    renderAdminList();

  }
);
