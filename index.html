<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>현지공인중개사 매물지도</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
      color: #222;
      background: #f7f8fa;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    /* =========================
       상단
    ========================= */

    header {
      height: 68px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 24px;

      position: relative;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 18px;

      font-size: 22px;
      font-weight: 800;
      white-space: nowrap;
    }

    .phone-box {
      display: flex;
      align-items: center;
      gap: 12px;

      font-size: 15px;
      font-weight: 700;
      color: #333;
    }

    .phone {
      display: inline-flex;
      align-items: center;

      padding: 7px 10px;

      border-radius: 8px;

      background: #f5f7fb;
    }

    .head-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-mail {
      font-size: 13px;
      color: #666;
    }

    .login-btn,
    .logout-btn {
      border: 0;
      border-radius: 10px;

      padding: 10px 15px;

      color: #fff;
      background: #4f6fe8;

      cursor: pointer;
    }

    .logout-btn {
      background: #4f6fe8;
    }


    /* =========================
       전체 화면
    ========================= */

    main {
      height: calc(100vh - 68px);

      display: flex;

      overflow: hidden;
    }


    /* =========================
       지도
    ========================= */

    #map {
      position: relative;

      flex: 1;

      min-width: 0;
      height: 100%;

      background: #eee;
    }


    /* =========================
       지도 검색
    ========================= */

    .map-search {
      position: absolute;

      top: 16px;
      left: 16px;

      z-index: 20;

      display: flex;
      gap: 6px;
    }

    .map-search input {
      width: 290px;

      border: 1px solid #ddd;
      border-radius: 11px;

      padding: 12px 14px;

      background: #fff;

      box-shadow:
        0 3px 12px rgba(0,0,0,.12);

      outline: none;
    }

    .map-search input:focus {
      border-color: #4f6fe8;
    }

    .map-search button {
      border: 0;
      border-radius: 11px;

      padding: 0 17px;

      color: #fff;
      background: #4f6fe8;

      cursor: pointer;

      box-shadow:
        0 3px 12px rgba(0,0,0,.12);
    }


    /* =========================
       관리자 버튼
    ========================= */

    .admin-open {
      display: none;

      position: absolute;

      right: 18px;
      top: 18px;

      z-index: 30;

      border: 0;
      border-radius: 11px;

      padding: 11px 15px;

      background: #fff;

      box-shadow:
        0 3px 12px rgba(0,0,0,.15);

      cursor: pointer;

      font-weight: 700;
    }

    .admin-open.show {
      display: block;
    }


    /* =========================
       오른쪽 매물 목록
    ========================= */

    .side {
      width: 410px;

      background: #fff;

      border-left: 1px solid #e5e7eb;

      display: flex;
      flex-direction: column;

      z-index: 10;
    }


    /* =========================
       필터
    ========================= */

    .filters {
      padding: 14px;

      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      border-bottom: 1px solid #eee;
    }

    .filter {
      border: 1px solid #ddd;

      background: #fff;

      border-radius: 10px;

      padding: 9px 12px;

      cursor: pointer;

      font-weight: 600;
    }

    .filter:hover {
      background: #f5f7ff;
    }

    .filter.active {
      color: #fff;

      background: #4f6fe8;

      border-color: #4f6fe8;
    }


    /* =========================
       매물 개수
    ========================= */

    .count {
      padding: 11px 15px;

      font-size: 13px;

      color: #667085;

      border-bottom: 1px solid #eee;
    }


    /* =========================
       매물 리스트
    ========================= */

    #list {
      flex: 1;

      overflow-y: auto;
    }

    .card {
      display: flex;

      gap: 11px;

      padding: 13px;

      border-bottom: 1px solid #eee;

      cursor: pointer;

      transition: background .15s;
    }

    .card:hover {
      background: #f7f9ff;
    }

    .thumb {
      width: 110px;
      height: 84px;

      flex: none;

      object-fit: cover;

      border-radius: 9px;

      background: #eef1f5;
    }

    .card-info {
      min-width: 0;
    }

    .card-title {
      margin-bottom: 5px;

      font-size: 15px;
      font-weight: 800;

      line-height: 1.4;
    }

    .muted {
      font-size: 12px;

      color: #777;

      line-height: 1.5;
    }

    .price {
      margin-top: 5px;

      font-size: 13px;
      font-weight: 800;
    }

    .premium-small {
      margin-top: 3px;

      color: #e5484d;

      font-size: 12px;
      font-weight: 700;
    }

    .empty {
      padding: 50px 20px;

      text-align: center;

      color: #888;
    }


    /* =========================
       동별 매물 개수
    ========================= */

    .dong-bubble {
      min-width: 65px;

      text-align: center;

      background: #fff;

      border: 2px solid #4f6fe8;

      border-radius: 20px;

      padding: 7px 10px;

      box-shadow:
        0 3px 12px rgba(0,0,0,.18);

      font-weight: 800;

      color: #334155;
    }

    .dong-bubble strong {
      display: block;

      font-size: 16px;
    }

    .dong-bubble span {
      display: block;

      margin-top: 1px;

      font-size: 11px;

      font-weight: 500;

      color: #666;
    }


    /* =========================
       관리자 패널
    ========================= */

    .admin-panel {
      display: none;

      position: absolute;

      left: 18px;
      top: 18px;

      width: 380px;

      max-height: calc(100vh - 105px);

      overflow-y: auto;

      padding: 19px;

      background: #fff;

      border-radius: 17px;

      box-shadow:
        0 15px 40px rgba(0,0,0,.22);

      z-index: 40;
    }

    .admin-panel.show {
      display: block;
    }

    .admin-panel h2 {
      margin: 0 0 15px;

      font-size: 20px;
    }

    .close {
      position: absolute;

      top: 10px;
      right: 13px;

      border: 0;

      background: transparent;

      font-size: 24px;

      cursor: pointer;

      color: #555;
    }

    .field {
      margin-bottom: 10px;
    }

    .field label {
      display: block;

      margin-bottom: 5px;

      font-size: 12px;

      color: #555;

      font-weight: 600;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;

      padding: 10px 11px;

      border: 1px solid #d9dde5;

      border-radius: 9px;

      outline: none;

      background: #fff;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: #4f6fe8;
    }

    .field textarea {
      min-height: 90px;

      resize: vertical;
    }

    .row {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 8px;
    }

    .submit {
      width: 100%;

      border: 0;
      border-radius: 10px;

      padding: 12px;

      color: #fff;

      background: #4f6fe8;

      cursor: pointer;

      font-weight: 800;
    }

    .submit:hover {
      background: #405fd5;
    }

    .preview {
      display: none;

      width: 100%;

      max-height: 190px;

      margin-top: 8px;

      object-fit: cover;

      border-radius: 9px;
    }

    .admin-list {
      margin-top: 20px;

      padding-top: 13px;

      border-top: 1px solid #eee;
    }

    .admin-item {
      padding: 11px 0;

      border-bottom: 1px solid #eee;
    }

    .admin-item b {
      font-size: 13px;
    }

    .delete {
      float: right;

      border: 0;

      border-radius: 7px;

      padding: 5px 9px;

      color: #fff;

      background: #ef4444;

      cursor: pointer;

      font-size: 12px;
    }

    .login-required {
      padding: 15px;

      border-radius: 10px;

      background: #f5f7fa;

      color: #667085;

      font-size: 13px;

      line-height: 1.6;
    }


    /* =========================
       상세정보 모달
    ========================= */

    .modal {
      display: none;

      position: fixed;

      inset: 0;

      z-index: 100;

      align-items: center;
      justify-content: center;

      padding: 18px;

      background: rgba(0,0,0,.55);
    }

    .modal.show {
      display: flex;
    }

    .detail {
      position: relative;

      width: min(680px, 100%);

      max-height: 90vh;

      overflow-y: auto;

      padding: 20px;

      background: #fff;

      border-radius: 18px;

      box-shadow:
        0 20px 60px rgba(0,0,0,.3);
    }

    .detail > img {
      display: block;

      width: 100%;

      max-height: 370px;

      object-fit: cover;

      border-radius: 12px;

      background: #f0f2f5;
    }

    .detail-tags {
      margin-top: 13px;
    }

    .tag {
      display: inline-block;

      padding: 6px 9px;

      margin-right: 5px;

      border-radius: 7px;

      color: #4357b9;

      background: #eef2ff;

      font-size: 12px;

      font-weight: 700;
    }

    .detail h2 {
      margin: 12px 0 6px;

      font-size: 21px;
    }

    .detail-address {
      color: #666;

      font-size: 13px;
    }

    .detail-grid {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 8px;

      margin-top: 15px;
    }

    .info {
      padding: 11px;

      border-radius: 10px;

      background: #f7f8fa;
    }

    .info small {
      display: block;

      margin-bottom: 4px;

      color: #777;

      font-size: 11px;
    }

    .info b {
      font-size: 14px;
    }

    .detail-description {
      margin-top: 17px;

      line-height: 1.7;

      white-space: pre-wrap;

      font-size: 14px;
    }

    .premium-detail {
      color: #e5484d;
    }

    .external {
      display: inline-block;

      margin-top: 12px;

      padding: 10px 14px;

      border-radius: 9px;

      color: #fff;

      background: #111827;

      text-decoration: none;

      font-size: 13px;

      font-weight: 700;
    }


    /* =========================
       모바일
    ========================= */

    @media(max-width: 900px) {

      header {
        padding: 0 14px;
      }

      .brand {
        gap: 8px;

        font-size: 17px;
      }

      .phone-box {
        gap: 5px;

        font-size: 11px;
      }

      .phone {
        padding: 5px 6px;
      }

      .user-mail {
        display: none;
      }

      .side {
        width: 360px;
      }

      .map-search input {
        width: 220px;
      }

    }


    @media(max-width: 650px) {

      header {
        height: 60px;
      }

      main {
        height: calc(100vh - 60px);

        display: block;
      }

      #map {
        height: 55vh;
      }

      .side {
        width: 100%;
        height: 45vh;

        border-left: 0;

        border-top: 1px solid #e5e7eb;
      }

      .brand {
        font-size: 16px;
      }

      .phone-box {
        display: none;
      }

      .map-search {
        top: 10px;
        left: 10px;
      }

      .map-search input {
        width: calc(100vw - 110px);
      }

      .map-search button {
        padding: 0 12px;
      }

      .admin-panel {
        left: 10px;
        top: 10px;

        width: calc(100% - 20px);

        max-height: calc(55vh - 20px);
      }

      .detail-grid {
        grid-template-columns: 1fr 1fr;
      }

    }

  </style>
</head>


<body>

  <!-- =========================
       상단
  ========================= -->

  <header>

    <div class="brand">

      <span>
        📍 현지공인중개사 매물지도
      </span>

      <div class="phone-box">

        <span class="phone">
          ☎ 041-414-1124
        </span>

        <span class="phone">
          📱 010-8279-3919
        </span>

      </div>

    </div>


    <div class="head-right">

      <span
        id="userMail"
        class="user-mail"
      ></span>

      <button
        id="loginBtn"
        class="login-btn"
      >
        구글 로그인
      </button>

      <button
        id="logoutBtn"
        class="logout-btn"
        style="display:none"
      >
        로그아웃
      </button>

    </div>

  </header>


  <!-- =========================
       메인
  ========================= -->

  <main>


    <!-- =========================
         지도
    ========================= -->

    <section id="map">


      <!-- 지도 검색 -->

      <div class="map-search">

        <input
          id="mapSearch"
          type="text"
          placeholder="주소·동·매물명 검색"
        >

        <button
          onclick="searchText()"
        >
          검색
        </button>

      </div>


      <!-- 관리자 버튼 -->

      <button
        id="adminOpen"
        class="admin-open"
        onclick="toggleAdmin()"
      >
        🔐 관리자
      </button>


      <!-- =========================
           관리자 등록 패널
      ========================= -->

      <div
        id="adminPanel"
        class="admin-panel"
      >

        <button
          class="close"
          onclick="toggleAdmin()"
        >
          ×
        </button>


        <h2>
          매물 등록
        </h2>


        <div
          id="notAdmin"
          class="login-required"
          style="display:none"
        >
          관리자 구글 계정으로 로그인하면
          매물을 등록하고 삭제할 수 있습니다.
        </div>


        <div id="adminForm">


          <!-- 제목 -->

          <div class="field">

            <label>
              매물 제목
            </label>

            <input
              id="fTitle"
              type="text"
              placeholder="예: 신부동 1층 상가"
            >

          </div>


          <!-- 주소 -->

          <div class="field">

            <label>
              주소
            </label>

            <input
              id="fAddress"
              type="text"
              placeholder="예: 천안시 동남구 신부동 1761"
            >

          </div>


          <!-- 종류 / 거래 -->

          <div class="row">

            <div class="field">

              <label>
                매물 종류
              </label>

              <select id="fType">

                <option value="상가">
                  상가
                </option>

                <option value="공장">
                  공장
                </option>

                <option value="토지">
                  토지
                </option>

                <option value="원투룸">
                  원·투룸
                </option>

                <option value="주택">
                  주택
                </option>

                <option value="아파트">
                  아파트
                </option>

              </select>

            </div>


            <div class="field">

              <label>
                거래 유형
              </label>

              <select id="fDeal">

                <option value="월세">
                  월세
                </option>

                <option value="전세">
                  전세
                </option>

                <option value="매매">
                  매매
                </option>

              </select>

            </div>

          </div>


          <!-- 보증금 / 월세 -->

          <div class="row">

            <div class="field">

              <label>
                보증금 (만원)
              </label>

              <input
                id="fDeposit"
                type="text"
                inputmode="numeric"
                placeholder="3000"
              >

            </div>


            <div class="field">

              <label>
                월세 (만원)
              </label>

              <input
                id="fRent"
                type="text"
                inputmode="numeric"
                placeholder="250"
              >

            </div>

          </div>


          <!-- 권리금 / 면적 -->

          <div class="row">

            <div class="field">

              <label>
                권리금 (만원)
              </label>

              <input
                id="fPremium"
                type="text"
                inputmode="numeric"
                placeholder="없으면 0"
              >

            </div>


            <div class="field">

              <label>
                면적
              </label>

              <input
                id="fArea"
                type="text"
                placeholder="58.23㎡ / 17.61평"
              >

            </div>

          </div>


          <!-- 층 / 동 -->

          <div class="row">

            <div class="field">

              <label>
                층
              </label>

              <input
                id="fFloor"
                type="text"
                placeholder="1층"
              >

            </div>


            <div class="field">

              <label>
                동
              </label>

              <input
                id="fDong"
                type="text"
                placeholder="신부동"
              >

            </div>

          </div>


          <!-- 관리비 -->

          <div class="field">

            <label>
              관리비
            </label>

            <input
              id="fFee"
              type="text"
              placeholder="20만원 / 없음"
            >

          </div>


          <!-- 설명 -->

          <div class="field">

            <label>
              매물 설명
            </label>

            <textarea
              id="fDesc"
              placeholder="매물의 장점과 시설 등을 입력하세요."
            ></textarea>

          </div>


          <!-- 외부 상세정보 주소 -->

          <div class="field">

            <label>
              상세정보 연결 주소
            </label>

            <input
              id="fUrl"
              type="url"
              placeholder="https://..."
            >

          </div>


          <!-- 대표사진 -->

          <div class="field">

            <label>
              대표사진 1장
            </label>

            <input
              id="fImage"
              type="file"
              accept="image/*"
            >


            <img
              id="preview"
              class="preview"
              alt="대표사진 미리보기"
            >

          </div>


          <!-- 등록 -->

          <button
            class="submit"
            onclick="registerProperty()"
          >
            매물 등록하기
          </button>


          <!-- 관리자 매물 관리 -->

          <div class="admin-list">

            <b>
              등록 매물 관리
            </b>

            <div id="adminList"></div>

          </div>

        </div>

      </div>

    </section>


    <!-- =========================
         오른쪽 매물 목록
    ========================= -->

    <aside class="side">


      <!-- 필터 -->

      <div
        class="filters"
        id="filters"
      >

        <button
          class="filter active"
          data-type=""
        >
          전체
        </button>

        <button
          class="filter"
          data-type="상가"
        >
          상가
        </button>

        <button
          class="filter"
          data-type="공장"
        >
          공장
        </button>

        <button
          class="filter"
          data-type="토지"
        >
          토지
        </button>

        <button
          class="filter"
          data-type="원투룸"
        >
          원·투룸
        </button>

        <button
          class="filter"
          data-type="주택"
        >
          주택
        </button>

        <button
          class="filter"
          data-type="아파트"
        >
          아파트
        </button>

      </div>


      <!-- 개수 -->

      <div
        id="count"
        class="count"
      >
        매물 불러오는 중...
      </div>


      <!-- 목록 -->

      <div id="list"></div>


    </aside>

  </main>


  <!-- =========================
       상세정보 팝업
  ========================= -->

  <div
    id="detailModal"
    class="modal"
    onclick="
      if(event.target === this)
      closeDetail()
    "
  >

    <div class="detail">

      <button
        class="close"
        onclick="closeDetail()"
      >
        ×
      </button>


      <!-- 대표사진 -->

      <img
        id="dImage"
        alt="대표사진"
      >


      <!-- 종류 -->

      <div class="detail-tags">

        <span
          id="dType"
          class="tag"
        ></span>

        <span
          id="dDeal"
          class="tag"
        ></span>

      </div>


      <!-- 제목 -->

      <h2 id="dTitle"></h2>


      <!-- 주소 -->

      <div
        id="dAddress"
        class="detail-address"
      ></div>


      <!-- 정보 -->

      <div class="detail-grid">


        <div class="info">

          <small>
            보증금
          </small>

          <b id="dDeposit">
            -
          </b>

        </div>


        <div class="info">

          <small>
            월세
          </small>

          <b id="dRent">
            -
          </b>

        </div>


        <div class="info">

          <small>
            권리금
          </small>

          <b

    function esc(value = "") {

          function(match) {

            return {

              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;"

            }[match];

        );

    }

          );


      return match
        ? match[1]
        : "";

    }


    /* =========================
       사진 압축
    ========================= */

    async function compressImage(file) {

      if (!file) {

        return "";

      }


      return new Promise(
        (resolve, reject) => {

          const reader =
            new FileReader();


          reader.onload =
            () => {

              const img =
                new Image();


              img.onload =
                () => {

                  const maxSize =
                    1200;


                  const scale =
                    Math.min(
                      1,
                      maxSize /
                      Math.max(
                        img.width,
                        img.height
                      )
                    );


                  const canvas =
                    document.createElement(
                      "canvas"
                    );


                  canvas.width =
                    Math.round(
                      img.width * scale
                    );


                  canvas.height =
                    Math.round(
                      img.height * scale
                    );


                  const ctx =
                    canvas.getContext(
                      "2d"
                    );


                  ctx.drawImage(
                    img,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                  );


                  let quality =
                    0.78;


                  let data =
                    canvas.toDataURL(
                      "image/jpeg",
                      quality
                    );


                  /*
                    Firestore 문서 크기를
                    고려해서 사진을 줄임
                  */

                  while (
                    data.length > 850000 &&
                    quality > 0.35
                  ) {

                    quality -= 0.06;


                    data =
                      canvas.toDataURL(
                        "image/jpeg",
                        quality
                      );

                  }


                  resolve(data);

                };


              img.onerror =
                reject;


              img.src =
                reader.result;

            };


          reader.onerror =
            reject;


          reader.readAsDataURL(file);

        }
      );

    }


    /* =========================
       주소 → 좌표
    ========================= */

    async function geocode(address) {

      return new Promise(
        (resolve, reject) => {

          geocoder.addressSearch(
            address,
            (result, status) => {

              if (
                status ===
                  kakao.maps.services.Status.OK &&
                result.length
              ) {

                resolve({

                  lat:
                    Number(result[0].y),

                  lng:
                    Number(result[0].x)

                });

              }
              else {

                reject(
                  new Error(
                    "주소를 카카오지도에서 찾지 못했습니다."
                  )
                );

              }

            }
          );

        }
      );

    }


    /* =========================
       Firestore 매물 불러오기
    ========================= */

    async function loadProperties() {

      try {

          await getDocs(

              "properties"
            )

        properties =

          error.message

      }

    }


    /* =========================

    ========================= */

    function filteredProperties() {

      const search =

          .trim()

      return properties.filter(

          const typeOK =

          const text =
            [

              property.title,
              property.address,
              property.dong,
              property.description

            ]
            .join(" ")
            .toLowerCase();


          const searchOK =
            !search ||
            text.includes(search);


          return (
            typeOK &&
            searchOK
          );

        }
      );

    }

    /* =========================
       지도에 마커 + 동별 개수
    ========================= */

    function drawMap(list) {

      if (!map) {

        return;

      }


      /*
        기존 마커 제거
      */

      markers.forEach(
        marker =>
          marker.setMap(null)
      );


      markers = [];


      /*
        기존 동별 표시 제거
      */

      dongOverlays.forEach(
        overlay =>
          overlay.setMap(null)
      );


      dongOverlays = [];


      const groups = {};


      list.forEach(
        property => {

          if (
            property.lat === undefined ||
            property.lng === undefined
          ) {

            return;

          }


          const position =
            new kakao.maps.LatLng(
              Number(property.lat),
              Number(property.lng)
            );


          const marker =
            new kakao.maps.Marker({

              position

            });


          marker.setMap(map);


          kakao.maps.event.addListener(
            marker,
            "click",
            () => {

              showDetail(
                property.id
              );

            }
          );


          markers.push(marker);


          /*
            동별 그룹
          */

          const dong =
            property.dong ||
            extractDong(
              property.address
            ) ||
            "기타";


          if (!groups[dong]) {

            groups[dong] = [];

          }


          groups[dong].push(
            property
          );

        }
      );


      /*
        동별 매물 수 표시
      */

      Object.entries(groups)
        .forEach(
          ([dong, list]) => {

            if (!list.length) {

              return;

            }


            const lat =
              list.reduce(
                (sum, property) =>
                  sum +
                  Number(property.lat),
                0
              ) /
              list.length;


            const lng =
              list.reduce(
                (sum, property) =>
                  sum +
                  Number(property.lng),
                0
              ) /
              list.length;


            const element =
              document.createElement(
                "div"
              );


            element.className =
              "dong-bubble";


            element.innerHTML = `

              <strong>
                ${list.length}
              </strong>

              <span>
                ${esc(dong)}
              </span>

            `;


            const overlay =
              new kakao.maps.CustomOverlay({

                position:
                  new kakao.maps.LatLng(
                    lat,
                    lng
                  ),

                content:
                  element,

                yAnchor:
                  1.65

              });


            overlay.setMap(map);


            dongOverlays.push(
              overlay
            );

          }
        );

    }

          "";


        $("preview")
          .style
          .display =
          "none";


        /*

        await loadProperties();

      }
      catch (error) {

        console.error(error);


        alert(
          "매물 등록 중 오류가 발생했습니다.\n\n" +

          catch (error) {

            console.error(error);


            alert(
              "Google 로그인 중 오류가 발생했습니다.\n\n" +
              error.message
            );

          }

        }
      );


    /* =========================
       로그아웃
    ========================= */

    $("logoutBtn")
      .addEventListener(
        "click",
        async function() {

          try {

            await signOut(
              auth
            );

          }
          catch (error) {

            console.error(error);

          }

        }
      );


    /* =========================
       로그인 상태
    ========================= */

    onAuthStateChanged(
      auth,
      function(user) {

        currentUser =
          user;


        if (user) {

          $("userMail")
            .textContent =
            user.email || "";


          $("loginBtn")
            .style
            .display =
            "none";


          $("logoutBtn")
            .style
            .display =
            "inline-block";


          /*
            관리자 이메일과
            로그인 이메일이 같으면
            관리자 기능 활성화
          */

          const isAdmin =
            user.email ===
            ADMIN_EMAIL;


          $("adminOpen")
            .classList
            .toggle(
              "show",
              isAdmin
            );


          $("adminForm")
            .style
            .display =
            isAdmin
              ? "block"
              : "none";


          $("notAdmin")
            .style
            .display =
            isAdmin
              ? "none"
              : "block";


          if (isAdmin) {

            $("adminPanel")
              .classList
              .add("show");

          }

        }
        else {

          $("userMail")
            .textContent =
            "";


          $("loginBtn")
            .style
            .display =
            "inline-block";


          $("logoutBtn")
            .style
            .display =
            "none";


          $("adminOpen")
            .classList
            .remove(
              "show"
            );


          $("adminPanel")
            .classList
            .remove(
              "show"
            );

        }


        renderAdminList();

      }
    );


    /* =========================
       카카오맵 시작
    ========================= */

    kakao.maps.load(
      function() {

        map =
          new kakao.maps.Map(
            $("map"),
            {

              center:
                new kakao.maps.LatLng(
                  36.8151,
                  127.1139
                ),

              level:
                8

            }
          );


        geocoder =
          new kakao.maps.services.Geocoder();


        /*
          Firebase 매물 불러오기
        */

        loadProperties();

      }
    );


  </script>

</body>
