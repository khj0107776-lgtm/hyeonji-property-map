<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>현지공인중개사 매물지도</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=175758acb1d968a612c27e344b435346&libraries=services,clusterer"></script>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Malgun Gothic",sans-serif;
    color:#171923;
    background:#f7f8fb;
}

body{
    overflow:hidden;
}

button,input,textarea,select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.header{
    height:66px;
    background:#fff;
    border-bottom:1px solid #e6e8ef;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    position:relative;
    z-index:100;
}

.logo{
    font-size:25px;
    font-weight:900;
    white-space:nowrap;
}

.logo span{
    margin-right:7px;
}

.contact{
    display:flex;
    align-items:center;
    gap:25px;
    font-size:18px;
    font-weight:800;
}

.contact a{
    color:#30333d;
    text-decoration:none;
}

.header-right{
    display:flex;
    align-items:center;
    gap:12px;
}

.email{
    color:#626875;
    font-size:14px;
}

.login-btn,
.logout-btn{
    border:0;
    background:#5968dd;
    color:#fff;
    border-radius:13px;
    padding:13px 20px;
    font-size:15px;
    font-weight:800;
}

.logout-btn{
    background:#fff;
    color:#30333d;
    border:1px solid #dddfe7;
}

.main{
    width:100%;
    height:calc(100vh - 66px);
    display:flex;
}

.map-area{
    position:relative;
    flex:1;
    min-width:0;
    height:100%;
}

#map{
    width:100%;
    height:100%;
}

.search-box{
    position:absolute;
    top:22px;
    left:20px;
    z-index:20;
    width:570px;
    max-width:calc(100% - 40px);
    display:flex;
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 7px 25px rgba(0,0,0,.14);
}

.search-box input{
    flex:1;
    min-width:0;
    height:64px;
    border:0;
    outline:0;
    padding:0 20px;
    font-size:19px;
}

.search-box button{
    width:95px;
    border:0;
    background:#5968dd;
    color:#fff;
    font-size:17px;
    font-weight:900;
}

.side{
    width:430px;
    background:#fff;
    border-left:1px solid #e2e4ea;
    height:100%;
    overflow-y:auto;
    position:relative;
    z-index:30;
}

.side-inner{
    padding:18px;
}

.categories{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:6px;
    width:100%;
    margin-bottom:12px;
}

.cat{
    width:100%;
    min-width:0;
    padding:11px 2px;
    border:1px solid #dfe2e9;
    background:#fff;
    border-radius:10px;
    font-size:14px;
    font-weight:900;
    white-space:nowrap;
    text-align:center;
    color:#20232d;
}

.cat.active{
    background:#5968dd;
    color:#fff;
    border-color:#5968dd;
}

.reception-btn{
    width:100%;
    height:60px;
    border:0;
    border-radius:13px;
    background:#f0f1ff;
    color:#5968dd;
    font-size:17px;
    font-weight:900;
    margin:5px 0 10px;
}

.admin-btn{
    width:100%;
    height:60px;
    border:0;
    border-radius:13px;
    background:#171925;
    color:#fff;
    font-size:16px;
    font-weight:900;
    margin-bottom:12px;
}

.count-line{
    padding:9px 0 13px;
    color:#737986;
    font-size:15px;
    border-bottom:1px solid #eceef3;
}

.property-list{
    padding:12px 0 30px;
}

.property-card{
    background:#fff;
    border:1px solid #e0e3ea;
    border-radius:15px;
    overflow:hidden;
    margin-bottom:11px;
    cursor:pointer;
    transition:.15s;
}

.property-card:hover{
    box-shadow:0 6px 20px rgba(0,0,0,.08);
}

.card-photo{
    width:100%;
    height:170px;
    background:#f0f1f5;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#a1a5af;
    font-weight:800;
    overflow:hidden;
}

.card-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.card-body{
    padding:13px 15px 15px;
}

.type-badge{
    display:inline-block;
    background:#eef0ff;
    color:#5968dd;
    border-radius:8px;
    padding:5px 9px;
    font-size:12px;
    font-weight:900;
    margin-bottom:7px;
}

.card-title{
    font-size:18px;
    font-weight:900;
    margin-bottom:5px;
}

.card-address{
    color:#6f7480;
    font-size:13px;
    margin-bottom:8px;
}

.card-price{
    font-size:17px;
    font-weight:900;
}

.card-right{
    float:right;
    color:#777c88;
    font-size:12px;
}

.empty{
    text-align:center;
    color:#8a8f9a;
    padding:55px 15px;
}

.count-overlay{
    min-width:75px;
    padding:9px 12px;
    background:#fff;
    border-radius:25px;
    box-shadow:0 5px 17px rgba(0,0,0,.18);
    text-align:center;
    font-size:13px;
    font-weight:900;
    white-space:nowrap;
}

.count-overlay strong{
    display:inline-block;
    background:#5968dd;
    color:#fff;
    border-radius:50%;
    min-width:29px;
    height:29px;
    line-height:29px;
    margin-right:5px;
    font-size:13px;
}

.marker-pin{
    width:38px;
    height:38px;
    background:#5968dd;
    border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    box-shadow:0 3px 8px rgba(0,0,0,.25);
    position:relative;
}

.marker-pin::after{
    content:"";
    position:absolute;
    width:12px;
    height:12px;
    background:#fff;
    border-radius:50%;
    left:13px;
    top:13px;
}

.modal-bg{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.62);
    z-index:9999;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.modal-bg.show{
    display:flex;
}

.modal{
    width:780px;
    max-width:100%;
    max-height:92vh;
    overflow-y:auto;
    background:#fff;
    border-radius:24px;
    position:relative;
}

.modal-x{
    position:absolute;
    right:17px;
    top:15px;
    z-index:5;
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.58);
    color:#fff;
    font-size:25px;
    line-height:42px;
}

.modal-photo{
    width:100%;
    height:390px;
    background:#f0f1f5;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#a3a7b0;
    font-weight:900;
    overflow:hidden;
}

.modal-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.detail{
    padding:27px;
}

.detail-badge{
    display:inline-block;
    padding:7px 11px;
    background:#eef0ff;
    color:#5968dd;
    border-radius:9px;
    font-size:13px;
    font-weight:900;
}

.detail h2{
    margin:10px 0 18px;
    font-size:27px;
}

.detail-row{
    display:flex;
    border-top:1px solid #eceef2;
    padding:15px 0;
    font-size:15px;
}

.detail-label{
    width:100px;
    color:#777c87;
    font-weight:700;
}

.detail-value{
    flex:1;
    font-weight:800;
    word-break:break-all;
}

.detail-description{
    white-space:pre-wrap;
    line-height:1.7;
    font-weight:500;
}

.phone-btn{
    width:100%;
    height:60px;
    background:#171925;
    color:#fff;
    border:0;
    border-radius:13px;
    font-size:19px;
    font-weight:900;
    margin-top:15px;
}

.close-btn{
    width:100%;
    height:56px;
    background:#fff;
    border:1px solid #dddfe5;
    border-radius:13px;
    font-size:16px;
    font-weight:900;
    margin-top:10px;
}

.admin-actions{
    display:none;
    gap:8px;
    margin-top:12px;
}

.admin-actions.show{
    display:flex;
}

.edit-btn,
.delete-btn{
    flex:1;
    height:52px;
    border:0;
    border-radius:12px;
    font-size:15px;
    font-weight:900;
}

.edit-btn{
    background:#5968dd;
    color:#fff;
}

.delete-btn{
    background:#fff0f0;
    color:#d33d3d;
}

.form{
    padding:27px;
}

.form h2{
    margin:0 0 18px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.form-group{
    margin-bottom:12px;
}

.form-group.full{
    grid-column:1 / -1;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-size:13px;
    font-weight:900;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    border:1px solid #dfe2e8;
    border-radius:10px;
    padding:12px;
    outline:0;
    font-size:14px;
    background:#fff;
}

.form-group textarea{
    min-height:120px;
    resize:vertical;
}

.file-box{
    border:1px dashed #cdd1db;
    border-radius:12px;
    padding:15px;
    background:#fafbfc;
}

.preview{
    display:none;
    margin-top:10px;
    width:100%;
    max-height:260px;
    object-fit:cover;
    border-radius:10px;
}

.submit-btn{
    width:100%;
    height:58px;
    background:#5968dd;
    color:#fff;
    border:0;
    border-radius:12px;
    font-size:17px;
    font-weight:900;
}

.cancel-form{
    width:100%;
    height:52px;
    background:#fff;
    border:1px solid #dddfe5;
    border-radius:12px;
    font-size:15px;
    font-weight:900;
    margin-top:8px;
}

.admin-panel{
    display:none;
    padding:18px;
}

.admin-panel.show{
    display:block;
}

.admin-panel-title{
    font-size:20px;
    font-weight:900;
    margin-bottom:14px;
}

.request-card{
    border:1px solid #e0e3e9;
    border-radius:13px;
    padding:14px;
    margin-bottom:9px;
    background:#fff;
}

.request-card b{
    display:block;
    margin-bottom:5px;
}

.request-card small{
    color:#777;
}

.hidden{
    display:none !important;
}

.toast{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    background:#171925;
    color:#fff;
    padding:13px 18px;
    border-radius:12px;
    z-index:10000;
    display:none;
    font-size:14px;
    font-weight:800;
}

.toast.show{
    display:block;
}

@media(max-width:900px){

    body{
        overflow:auto;
    }

    .header{
        height:auto;
        min-height:64px;
        padding:10px 13px;
        gap:10px;
    }

    .logo{
        font-size:18px;
    }

    .contact{
        display:none;
    }

    .email{
        display:none;
    }

    .login-btn,
    .logout-btn{
        padding:10px 13px;
        font-size:13px;
    }

    .main{
        height:auto;
        min-height:calc(100vh - 64px);
        display:block;
    }

    .map-area{
        width:100%;
        height:390px;
    }

    #map{
        height:390px;
    }

    .search-box{
        top:14px;
        left:14px;
        width:calc(100% - 28px);
    }

    .search-box input{
        height:56px;
        font-size:16px;
    }

    .search-box button{
        width:78px;
    }

    .side{
        width:100%;
        height:auto;
        overflow:visible;
        border-left:0;
    }

    .side-inner{
        padding:12px;
    }

    .categories{
        grid-template-columns:repeat(6,1fr);
        gap:4px;
    }

    .cat{
        padding:9px 1px;
        font-size:12px;
        border-radius:8px;
        letter-spacing:-1px;
    }

    .reception-btn,
    .admin-btn{
        height:52px;
    }

    .property-card{
        margin-bottom:9px;
    }

    .card-photo{
        height:145px;
    }

    .modal-bg{
        padding:0;
        align-items:flex-end;
    }

    .modal{
        width:100%;
        max-height:94vh;
        border-radius:20px 20px 0 0;
    }

    .modal-photo{
        height:245px;
    }

    .detail{
        padding:20px;
    }

    .detail h2{
        font-size:22px;
    }

    .form{
        padding:20px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">
        <span>📍</span>현지공인중개사 매물지도
    </div>

    <div class="contact">
        <a href="tel:0414141124">041-414-1124</a>
        <a href="tel:01082793919">010-8279-3919</a>
    </div>

    <div class="header-right">
        <span class="email" id="userEmail"></span>
        <button class="login-btn" id="loginBtn" onclick="googleLogin()">Google 로그인</button>
        <button class="logout-btn hidden" id="logoutBtn" onclick="logout()">로그아웃</button>
    </div>
</header>

<main class="main">

    <section class="map-area">
        <div id="map"></div>

        <div class="search-box">
            <input
                id="searchInput"
                type="text"
                placeholder="주소·동·매물명 검색"
                onkeydown="if(event.key==='Enter') searchProperties()"
            >
            <button onclick="searchProperties()">검색</button>
        </div>
    </section>

    <aside class="side">

        <div class="side-inner" id="normalPanel">

            <div class="categories">

                <button class="cat active" onclick="selectCategory('상가',this)">
                    상가
                </button>

                <button class="cat" onclick="selectCategory('공장',this)">
                    공장
                </button>

                <button class="cat" onclick="selectCategory('토지',this)">
                    토지
                </button>

                <button class="cat" onclick="selectCategory('원·투룸',this)">
                    원·투룸
                </button>

                <button class="cat" onclick="selectCategory('주택',this)">
                    주택
                </button>

                <button class="cat" onclick="selectCategory('아파트',this)">
                    아파트
                </button>

            </div>

            <button class="reception-btn" onclick="openReception()">
                📝 매물접수
            </button>

            <button class="admin-btn hidden" id="adminManageBtn" onclick="openAdminPanel()">
                🔐 관리자 매물관리
            </button>

            <div class="count-line" id="countLine">
                현재 0개 매물
            </div>

            <div class="property-list" id="propertyList">
                <div class="empty">등록된 매물이 없습니다.</div>
            </div>

        </div>

        <div class="admin-panel" id="adminPanel">

            <div class="admin-panel-title">
                🔐 관리자 매물관리
            </div>

            <button class="submit-btn" onclick="openPropertyForm()">
                + 매물 등록
            </button>

            <div style="height:10px"></div>

            <div id="adminPropertyList"></div>

            <div style="height:18px"></div>

            <div class="admin-panel-title">
                📋 매물접수 확인
            </div>

            <div id="requestList">
                <div class="empty">접수된 내용이 없습니다.</div>
            </div>

            <button class="cancel-form" onclick="closeAdminPanel()">
                일반 화면으로
            </button>

        </div>

    </aside>

</main>


<!-- 매물 상세 -->
<div class="modal-bg" id="detailModal">
    <div class="modal">

        <button class="modal-x" onclick="closeDetail()">×</button>

        <div class="modal-photo" id="detailPhoto">
            대표사진 없음
        </div>

        <div class="detail">

            <span class="detail-badge" id="detailType">상가</span>

            <h2 id="detailTitle">매물</h2>

            <div class="detail-row">
                <div class="detail-label">주소</div>
                <div class="detail-value" id="detailAddress"></div>
            </div>

            <div class="detail-row">
                <div class="detail-label">거래조건</div>
                <div class="detail-value" id="detailPrice"></div>
            </div>

            <div class="detail-row">
                <div class="detail-label">권리금</div>
                <div class="detail-value" id="detailPremium"></div>
            </div>

            <div class="detail-row">
                <div class="detail-label">면적</div>
                <div class="detail-value" id="detailArea"></div>
            </div>

            <div class="detail-row">
                <div class="detail-label">층수</div>
                <div class="detail-value" id="detailFloor"></div>
            </div>

            <div class="detail-row">
                <div class="detail-label">설명</div>
                <div class="detail-value detail-description" id="detailDescription"></div>
            </div>

            <a href="tel:0414141124" style="text-decoration:none">
                <button class="phone-btn">
                    ☎ 041-414-1124
                </button>
            </a>

            <div class="admin-actions" id="detailAdminActions">
                <button class="edit-btn" onclick="editCurrentProperty()">
                    ✏️ 수정
                </button>
                <button class="delete-btn" onclick="deleteCurrentProperty()">
                    🗑 삭제
                </button>
            </div>

            <button class="close-btn" onclick="closeDetail()">
                닫기
            </button>

        </div>
    </div>
</div>


<!-- 매물 등록/수정 -->
<div class="modal-bg" id="propertyFormModal">
    <div class="modal">

        <button class="modal-x" onclick="closePropertyForm()">×</button>

        <div class="form">

            <h2 id="formTitle">매물 등록</h2>

            <div class="form-grid">

                <div class="form-group full">
                    <label>매물 제목</label>
                    <input id="fTitle" placeholder="예: 두정동 대로변 1층 상가">
                </div>

                <div class="form-group">
                    <label>주소</label>
                    <input id="fAddress" placeholder="예: 천안시 서북구 두정동 123">
                </div>

                <div class="form-group">
                    <label>매물 종류</label>
                    <select id="fType">
                        <option value="상가">상가</option>
                        <option value="공장">공장</option>
                        <option value="토지">토지</option>
                        <option value="원·투룸">원·투룸</option>
                        <option value="주택">주택</option>
                        <option value="아파트">아파트</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>보증금 (만원)</label>
                    <input id="fDeposit" type="number" placeholder="5000">
                </div>

                <div class="form-group">
                    <label>월세 (만원)</label>
                    <input id="fRent" type="number" placeholder="250">
                </div>

                <div class="form-group">
                    <label>권리금 (만원)</label>
                    <input id="fPremium" placeholder="없음 / 3000">
                </div>

                <div class="form-group">
                    <label>면적</label>
                    <input id="fArea" placeholder="58.23㎡">
                </div>

                <div class="form-group">
                    <label>층</label>
                    <input id="fFloor" placeholder="1층">
                </div>

                <div class="form-group full">
                    <label>매물 설명</label>
                    <textarea id="fDescription" placeholder="매물 특징과 시설 등을 입력하세요."></textarea>
                </div>

                <div class="form-group full">
                    <label>대표사진 1장</label>

                    <div class="file-box">
                        <input
                            type="file"
                            id="fImage"
                            accept="image/*"
                            onchange="previewImage(this)"
                        >

                        <img id="imagePreview" class="preview">
                    </div>
                </div>

            </div>

            <button class="submit-btn" onclick="saveProperty()">
                매물 저장
            </button>

            <button class="cancel-form" onclick="closePropertyForm()">
                취소
            </button>

        </div>
    </div>
</div>


<!-- 매물 접수 -->
<div class="modal-bg" id="receptionModal">
    <div class="modal">

/* =========================================================
   카카오 지도
========================================================= */

function initMap(){

    const options = {

/* =========================================================
   Firestore 매물 불러오기
========================================================= */

async function loadProperties(){

    try{

        const snap = await db
            .collection("properties")
            .orderBy("createdAt","desc")
            .get();

        properties = [];

        snap.forEach(doc=>{

            properties.push({
                id:doc.id,
                ...doc.data()
            });

        });

        renderProperties();

    }catch(error){

        console.error(error);

        /*
         orderBy 색인 문제 등이 발생해도
         매물은 불러올 수 있도록 재시도
        */

        try{

            const snap = await db
                .collection("properties")
                .get();

            properties = [];

            snap.forEach(doc=>{

                properties.push({
                    id:doc.id,
                    ...doc.data()
                });

            });

            properties.sort(function(a,b){

                const aa = a.createdAt?.seconds || 0;
                const bb = b.createdAt?.seconds || 0;

                return bb-aa;

            });

            renderProperties();

        }catch(error2){

            console.error(error2);

            showToast("매물을 불러오지 못했습니다.");

        }

    }

}


/* =========================================================
   카테고리
========================================================= */

function selectCategory(category,button){

    currentCategory = category;

    document.querySelectorAll(".cat").forEach(function(btn){
        btn.classList.remove("active");
    });

    if(button){
        button.classList.add("active");
    }

    renderProperties();
}


/* =========================================================
   검색
========================================================= */

function searchProperties(){

    renderProperties();

    const keyword =
        document.getElementById("searchInput").value
        .trim()
        .toLowerCase();

    if(!keyword){

        return;
    }

    const found =
        properties.find(function(p){

            return (
                String(p.address || "").toLowerCase().includes(keyword) ||
                String(p.title || "").toLowerCase().includes(keyword) ||
                String(p.dong || "").toLowerCase().includes(keyword)
            );

        });

    if(found && found.lat && found.lng){

        map.setLevel(5);

        map.panTo(
            new kakao.maps.LatLng(
                Number(found.lat),
                Number(found.lng)
            )
        );

    }else{

        /*
          기존 데이터에 좌표가 없는 경우 주소 검색
        */

        geocoder.addressSearch(keyword,function(result,status){

            if(status === kakao.maps.services.Status.OK){

                const lat = Number(result[0].y);
                const lng = Number(result[0].x);

                map.setLevel(5);

                map.panTo(
                    new kakao.maps.LatLng(lat,lng)
                );

            }

        });

    }

}


/* =========================================================
   필터링
========================================================= */

function getFilteredProperties(){

    const keyword =
        document.getElementById("searchInput").value
        .trim()
        .toLowerCase();

    return properties.filter(function(p){

        const typeOK =
            !currentCategory ||
            p.type === currentCategory;

        const searchOK =
            !keyword ||
            String(p.address || "").toLowerCase().includes(keyword) ||
            String(p.title || "").toLowerCase().includes(keyword) ||
            String(p.dong || "").toLowerCase().includes(keyword);

        return typeOK && searchOK;

    });

}


/* =========================================================
   목록 표시
========================================================= */

function renderProperties(){

    const list =
        document.getElementById("propertyList");

    const filtered =
        getFilteredProperties();

    document.getElementById("countLine").textContent =
        "현재 " + filtered.length + "개 매물";

    list.innerHTML = "";

    if(filtered.length === 0){

        list.innerHTML =
            '<div class="empty">조건에 맞는 매물이 없습니다.</div>';

        drawMarkers([]);

        return;
    }

    filtered.forEach(function(property){

            document.createElement("div");

        card.className = "property-card";

        const photo =
            property.image
                ? '<img src="'+escapeAttr(property.image)+'">'
                : '대표사진 없음';

        card.innerHTML = `

            <div class="card-photo">
                ${photo}
            </div>

                    ${escapeHtml(property.type || "")}
                </span>

                <div class="card-title">
                    ${escapeHtml(property.title || "매물")}
                </div>

                <div class="card-address">
                    ${escapeHtml(property.address || "")}
                </div>

                <div class="card-price">
                    ${formatPrice(property)}
                    <span class="card-right">
                        ${escapeHtml(property.area || "")}
                    </span>
                </div>

            </div>
        `;

        card.onclick = function(){
            openDetail(property.id);
        };

        list.appendChild(card);

    });

    drawMarkers(filtered);

}


/* =========================================================
   가격
========================================================= */

function formatPrice(p){

    let result = "";

    if(p.deposit !== undefined && p.deposit !== ""){
        result += "보증금 " + numberFormat(p.deposit) + "만원";
    }

    if(p.rent !== undefined && p.rent !== ""){
        if(result) result += " / ";
        result += "월세 " + numberFormat(p.rent) + "만원";
    }

    if(!result){

        if(p.salePrice){
            result = "매매 " + numberFormat(p.salePrice) + "만원";
        }else{
            result = "가격 문의";
        }

    }

    return result;
}


function numberFormat(value){

    const n =
        String(value || "")
            .replace(/,/g,"");

    if(n === "") return "";

    if(!isNaN(n)){
        return Number(n).toLocaleString("ko-KR");
    }

    return value;
}


/* =========================================================
   지도 마커
========================================================= */

function clearMarkers(){

    markers.forEach(function(marker){
        marker.setMap(null);
    });

    markers = [];

}


function drawMarkers(list){

    clearMarkers();

    list.forEach(function(property){

        if(property.lat && property.lng){

            createMarker(property);

        }else if(property.address){

            geocodeProperty(property);

        }

    });

    setTimeout(refreshCountOverlays,500);

}


function geocodeProperty(property){

    geocoder.addressSearch(
        property.address,
        async function(result,status){

            if(status !== kakao.maps.services.Status.OK){
                return;
            }

            const lat = Number(result[0].y);
            const lng = Number(result[0].x);

            property.lat = lat;
            property.lng = lng;

            property.dong =
                extractDong(property.address);

            createMarker(property);

            /*
              좌표가 없는 기존 매물은 관리자만
              Firestore에 좌표를 저장
            */

            if(isAdmin){

                try{

                    await db
                        .collection("properties")
                        .doc(property.id)
                        .update({
                            lat:lat,
                            lng:lng,
                            dong:property.dong
                        });

                }catch(e){

                    console.log("좌표 저장 생략",e);

                }

            }

            refreshCountOverlays();

        }
    );

}


function createMarker(property){

    if(!property.lat || !property.lng){
        return;
    }

    const position =
        new kakao.maps.LatLng(
            Number(property.lat),
            Number(property.lng)
        );

    const marker =
        new kakao.maps.Marker({
            map:map,
            position:position
        });

    kakao.maps.event.addListener(
        marker,
        "click",
        function(){

            openDetail(property.id);

        }
    );

    markers.push(marker);

}


/* =========================================================
   동별 매물 수
========================================================= */

function extractDong(address){

    if(!address){
        return "기타";
    }

    const match =
        String(address).match(
            /([가-힣0-9]+동)(?:\s|$|\d)/
        );

    if(match){
        return match[1];
    }

    return "기타";
}


function clearCountOverlays(){

    countOverlays.forEach(function(overlay){

        overlay.setMap(null);

    });

    countOverlays = [];

}


function refreshCountOverlays(){

    if(!map) return;

    clearCountOverlays();

    const filtered =
        getFilteredProperties();

    const groups = {};

    filtered.forEach(function(property){

        if(!property.lat || !property.lng){
            return;
        }

        const dong =
            property.dong ||
            extractDong(property.address);

        if(!groups[dong]){

            groups[dong] = {
                count:0,
                lat:0,
                lng:0
            };

        }

        groups[dong].count++;
        groups[dong].lat += Number(property.lat);
        groups[dong].lng += Number(property.lng);

    });

    Object.keys(groups).forEach(function(dong){

        const group = groups[dong];

        if(!group.count){
            return;
        }

        const position =
            new kakao.maps.LatLng(
                group.lat/group.count,
                group.lng/group.count
            );

        const content =
            '<div class="count-overlay">' +
            '<strong>'+group.count+'</strong>' +
            escapeHtml(dong) +
            '</div>';

        const overlay =
            new kakao.maps.CustomOverlay({
                position:position,
                content:content,
                yAnchor:1.7,
                zIndex:10
            });

        overlay.setMap(map);

        countOverlays.push(overlay);

    });

}

/* =========================================================
   이미지
   Firebase Storage 없이 Firestore에 압축 저장
========================================================= */

function previewImage(input){

    if(!input.files || !input.files[0]){
        return;
    }

    const file =
        input.files[0];

    const reader =
        new FileReader();

    reader.onload = function(e){

        compressImage(
            e.target.result,
            function(result){

                currentImageData = result;

                const preview =
                    document.getElementById("imagePreview");

                preview.src = result;
                preview.style.display = "block";

            }
        );

    };

    reader.readAsDataURL(file);

}


function compressImage(src,callback){

    const img =
        new Image();

    img.onload = function(){

        const maxWidth = 1200;
        const maxHeight = 900;

        let width = img.width;
        let height = img.height;

        if(width > maxWidth){

            height =
                height * maxWidth / width;

            width = maxWidth;

        }

        if(height > maxHeight){

            width =
                width * maxHeight / height;

            height = maxHeight;

        }

        const canvas =
            document.createElement("canvas");

        canvas.width = Math.round(width);
        canvas.height = Math.round(height);

        const ctx =
            canvas.getContext("2d");

        ctx.drawImage(
            img,
            0,
            0,
            canvas.width,
            canvas.height
        );

        let quality = .78;

        let result =
            canvas.toDataURL(
                "image/jpeg",
                quality
            );

        /*
          Firestore 문서 크기 문제를 줄이기 위해
          사진은 약 600~700KB 이하를 목표로 반복 압축
        */

        while(
            result.length > 700000 &&
            quality > .35
        ){

            quality -= .07;

            result =
                canvas.toDataURL(
                    "image/jpeg",
                    quality
                );

        }

        callback(result);

    };

    img.src = src;

}


/* =========================================================
   매물 저장
========================================================= */

async function saveProperty(){

    if(!isAdmin){

        alert("관리자만 매물을 등록할 수 있습니다.");
        return;

    }

    const title =
        document.getElementById("fTitle").value.trim();

    const address =
        document.getElementById("fAddress").value.trim();

    const type =
        document.getElementById("fType").value;

    if(!title){

        alert("매물 제목을 입력해주세요.");
        return;

    }

    if(!address){

        alert("주소를 입력해주세요.");
        return;

    }

    const data = {

        title:title,
        address:address,
        type:type,

        deposit:
            document.getElementById("fDeposit").value.trim(),

        rent:
            document.getElementById("fRent").value.trim(),

        premium:
            document.getElementById("fPremium").value.trim() || "없음",

        area:
            document.getElementById("fArea").value.trim(),

        floor:
            document.getElementById("fFloor").value.trim(),

        description:
            document.getElementById("fDescription").value.trim(),

        image:currentImageData || "",

        updatedAt:
            firebase.firestore.FieldValue.serverTimestamp(),

        updatedBy:
            auth.currentUser.email

    };

    try{

        if(editingId){

            await db
                .collection("properties")
                .doc(editingId)
                .update(data);

            showToast("매물이 수정되었습니다.");

        }else{

            data.createdAt =
                firebase.firestore.FieldValue.serverTimestamp();

            data.createdBy =
                auth.currentUser.email;

            /*
              주소에서 동을 우선 저장
            */

            data.dong =
                extractDong(address);

            await db
                .collection("properties")
                .add(data);

            showToast("매물이 등록되었습니다.");

        }

        closePropertyForm();

        await loadProperties();

        if(document
            .getElementById("adminPanel")
            .classList.contains("show")){

            loadAdminPanel();

        }

    }catch(error){

        console.error(error);

        alert(
            "저장 중 오류가 발생했습니다.\n\n" +
            error.message
        );

    }

}


/* =========================================================
   매물 삭제
========================================================= */

async function deleteProperty(id){

    if(!isAdmin){

        alert("관리자만 삭제할 수 있습니다.");
        return;

    }

    const property =
        properties.find(p=>p.id === id);

    if(!property){
        return;
    }

    const ok =
        confirm(
            "정말 이 매물을 삭제하시겠습니까?\n\n" +
            (property.title || "매물")
        );

    if(!ok){
        return;
    }

    try{

        await db
            .collection("properties")
            .doc(id)
            .delete();

        showToast("매물이 삭제되었습니다.");

        closeDetail();

        await loadProperties();

        loadAdminPanel();

    }catch(error){

        console.error(error);

        alert(
            "삭제 중 오류가 발생했습니다.\n\n" +
            error.message
        );

    }

}


async function deleteCurrentProperty(){

    if(!currentProperty){
        return;
    }

    await deleteProperty(
        currentProperty.id
    );

}


/* =========================================================
   관리자 매물 접수
========================================================= */

function openReception(){

    document
        .getElementById("receptionModal")
        .classList.add("show");

}


function closeReception(){

    document
        .getElementById("receptionModal")
        .classList.remove("show");

}


async function submitReception(){

    const name =
        document.getElementById("rName").value.trim();

    const phone =
        document.getElementById("rPhone").value.trim();

    const type =
        document.getElementById("rType").value;

    const address =
        document.getElementById("rAddress").value.trim();

    const description =
        document.getElementById("rDescription").value.trim();

    if(!name){

        alert("성함을 입력해주세요.");
        return;

    }

    if(!phone){

        alert("연락처를 입력해주세요.");
        return;

    }

    if(!description){

        alert("매물 내용을 입력해주세요.");
        return;

    }

    try{

        await db
            .collection("propertyRequests")
            .add({

                name:name,
                phone:phone,
                type:type,
                address:address,
                description:description,

                createdAt:
                    firebase.firestore.FieldValue.serverTimestamp()

            });

        document.getElementById("rName").value = "";
        document.getElementById("rPhone").value = "";
        document.getElementById("rAddress").value = "";
        document.getElementById("rDescription").value = "";

        closeReception();

        showToast(
            "매물 접수가 완료되었습니다."
        );

    }catch(error){

        console.error(error);

        alert(
            "매물 접수 중 오류가 발생했습니다.\n\n" +
            error.message
        );

    }

}


/* =========================================================
   접수 내용 관리자만 확인
========================================================= */

async function loadRequests(){

    if(!isAdmin){
        return;
    }

    const box =
        document.getElementById("requestList");

    box.innerHTML = "";

    try{

        const snap =
            await db
                .collection("propertyRequests")
                .get();

        const requests = [];

        snap.forEach(function(doc){

            requests.push({
                id:doc.id,
                ...doc.data()
            });

        });

        requests.sort(function(a,b){

            const aa =
                a.createdAt?.seconds || 0;

            const bb =
                b.createdAt?.seconds || 0;

            return bb-aa;

        });

        if(requests.length === 0){

            box.innerHTML =
                '<div class="empty">접수된 내용이 없습니다.</div>';

            return;

        }

        requests.forEach(function(r){

            const div =
                document.createElement("div");

            div.className =
                "request-card";

            div.innerHTML = `

                <b>${escapeHtml(r.name || "")}</b>

                <div>
                    ${escapeHtml(r.phone || "")}
                </div>

                <div>
                    ${escapeHtml(r.type || "")}
                    ·
                    ${escapeHtml(r.address || "")}
                </div>

                <p style="white-space:pre-wrap;line-height:1.5">
                    ${escapeHtml(r.description || "")}
                </p>

                <button
                    class="delete-btn"
                    style="width:100%;height:42px"
                    onclick="deleteRequest('${r.id}')">
                    접수 삭제
                </button>

            `;

            box.appendChild(div);

        });

    }catch(error){

        console.error(error);

        box.innerHTML =
            '<div class="empty">접수 내용을 불러올 수 없습니다.</div>';

    }

}


async function deleteRequest(id){

    if(!isAdmin){
        return;
    }

    if(!confirm("이 접수 내용을 삭제하시겠습니까?")){
        return;
    }

    try{

        await db
            .collection("propertyRequests")
            .doc(id)
            .delete();

        loadRequests();

        showToast("접수 내용이 삭제되었습니다.");

    }catch(error){

        alert(error.message);

    }

}


/* =========================================================
   보안용 출력 처리
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttr(value){

    return String(value ?? "")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   알림
========================================================= */

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    setTimeout(function(){

        toast.classList.remove("show");

    },2200);

}


/* =========================================================
   바깥쪽 클릭으로 모달 닫기
========================================================= */

document.querySelectorAll(".modal-bg")
.forEach(function(bg){

    bg.addEventListener("click",function(e){

        if(e.target === bg){

            bg.classList.remove("show");

        }

    });

});


/* =========================================================
   화면 크기 변경
========================================================= */

window.addEventListener("resize",function(){

    if(map){

        map.relayout();

    }

    setTimeout(function(){

        refreshCountOverlays();

    },300);

});


/* =========================================================
   ESC 닫기
========================================================= */

document.addEventListener("keydown",function(e){

    if(e.key === "Escape"){

        document
            .querySelectorAll(".modal-bg.show")
            .forEach(function(modal){

                modal.classList.remove("show");

            });

    }

});


/* =========================================================
   주기적으로 동별 숫자 갱신
========================================================= */

setInterval(function(){

    if(map){

        refreshCountOverlays();

    }

},5000);
