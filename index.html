  isAdmin=!!v;
  document.body.classList.toggle("admin-mode",isAdmin);
  const b=document.querySelector("#adminBtn");
  b.textContent=isAdmin?"🔓 관리자 로그아웃":"🔐 관리자 로그인";

let advanced={minArea:"",maxArea:"",maxDeposit:"",maxRent:"",parking:false};
const $=s=>document.querySelector(s), money=n=>Number(n||0).toLocaleString("ko-KR");
const py=m=>(Number(m||0)/3.305785).toFixed(1);

function amount(x){return x.sale||x.deposit||0}
function match(x){
 const q=$("#search").value.trim().toLowerCase(),tr=$("#trade").value,ar=$("#area").value,pr=$("#price").value,tp=$("#type").value,th=$("#theme").value;
 const text=(x.id+" "+x.title+" "+x.address).toLowerCase();
 if(q&&!text.includes(q))return false;if(tr&&x.trade!==tr)return false;if(tp&&x.category!==tp)return false;if(th&&!(x.theme||[]).includes(th))return false;
 if(ar==="30"&&x.area>30)return false;if(ar==="100"&&(x.area<30||x.area>100))return false;if(ar==="101"&&x.area<=100)return false;
 if(pr==="1000"&&amount(x)>1000)return false;if(pr==="5000"&&amount(x)>5000)return false;if(pr==="10000"&&amount(x)>10000)return false;if(pr==="10001"&&amount(x)<=10000)return false;
 if(advanced.minArea&&x.area<+advanced.minArea)return false;if(advanced.maxArea&&x.area>+advanced.maxArea)return false;
 if(advanced.maxDeposit&&x.deposit>+advanced.maxDeposit)return false;if(advanced.maxRent&&x.rent>+advanced.maxRent)return false;if(advanced.parking&&!x.parking)return false;
 return true;
}
function sorted(){
 let a=LISTINGS.filter(match),s=$("#sort").value;
 return a.sort((x,y)=>s==="low"?amount(x)-amount(y):s==="high"?amount(y)-amount(x):s==="area"?y.area-x.area:+y.id-+x.id)
}
function price(x){
 if(x.trade==="매매")return `<div class="pill sale"><b>매매</b>${money(x.sale)}만</div>`;
 let z=`<div class="pill dep"><b>보증금</b>${money(x.deposit)}만</div>`;
 if(x.rent)z+=`<div class="pill rent"><b>월세</b>${money(x.rent)}만</div>`;
 if(x.fee)z+=`<span class="fee">관리비 ${money(x.fee)}원</span>`;
 return z
}
function card(x){
 const img=x.image?`<img src="${esc(x.image)}" alt="">`:"";
 return `<article class="card" data-id="${esc(x.id)}"><div class="photo">${img}<span class="tag">${x.trade==="매매"?"매매":"추천"}</span>${x.theme?.includes("추천")?'<span class="ribbon">추천매물</span>':""}${isAdmin?`<button class="delete-btn" data-delete="${esc(x.id)}">삭제</button>`:""}</div><div class="content"><div class="no">${esc(x.id)}</div><div class="addr">${esc(x.address)}</div><div class="title">○ ${esc(x.title)}</div><div class="meta">전용 ${x.area||0}㎡ (${py(x.area)}평) · ${esc(x.category||"")} · ${esc(x.floor||"")}</div><div class="prices">${price(x)}</div></div></article>`
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
 let a=sorted();$("#count").textContent=a.length;$("#cards").innerHTML=a.length?a.map(card).join(""):`<div class="empty">조건에 맞는 매물이 없습니다.</div>`;
 document.querySelectorAll(".card").forEach(c=>c.onclick=(e)=>{if(e.target.closest(".delete-btn"))return;focus(c.dataset.id)});
 document.querySelectorAll(".delete-btn").forEach(b=>b.onclick=(e)=>{
   e.stopPropagation();
   if(!isAdmin)return;
   const id=b.dataset.delete;
   const item=LISTINGS.find(v=>String(v.id)===String(id));
   if(item && confirm(`매물 ${id}번을 삭제하시겠습니까?`)){
     LISTINGS=LISTINGS.filter(v=>String(v.id)!==String(id));
     saveListings(); render();
   }
 });
 drawMarkers()
}
function drawMarkers(){
 if(!map||!window.kakao)return;overlays.forEach(o=>o.setMap(null));overlays=[];
 sorted().forEach(x=>{if(!x.lat||!x.lng)return;let el=document.createElement("div");el.className="custom-marker"+(x.trade==="매매"?" sale":"");el.textContent=x.id;let o=new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(x.lat,x.lng),content:el,yAnchor:1.2,clickable:true});o.setMap(map);el.onclick=()=>focus(x.id);overlays.push(o)})
}
function focus(id){
 let x=LISTINGS.find(v=>v.id==id);if(!x)return;
 document.querySelectorAll(".card").forEach(c=>c.style.outline="");let c=document.querySelector(`.card[data-id="${CSS.escape(String(id))}"]`);if(c){c.style.outline="2px solid #4f956e";c.scrollIntoView({behavior:"smooth",block:"nearest"})}
 if(map&&x.lat&&x.lng){map.setCenter(new kakao.maps.LatLng(x.lat,x.lng));map.setLevel(4)}
}
window.initListingMap=function(){
 const box=$("#map");map=new kakao.maps.Map(box,{center:new kakao.maps.LatLng(36.815,127.14),level:8});geocoder=new kakao.maps.services.Geocoder();$("#apiNotice").style.display="none";
 $("#plus").onclick=()=>map.setLevel(map.getLevel()-1);$("#minus").onclick=()=>map.setLevel(map.getLevel()+1);
 $("#mapType").onclick=()=>map.setMapTypeId(map.getMapTypeId()===kakao.maps.MapTypeId.ROADMAP?kakao.maps.MapTypeId.HYBRID:kakao.maps.MapTypeId.ROADMAP);
 $("#myLocation").onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{map.setCenter(new kakao.maps.LatLng(p.coords.latitude,p.coords.longitude));map.setLevel(4)},()=>alert("현재 위치를 확인할 수 없습니다."));
 $("#copyLoc").onclick=()=>navigator.clipboard?.writeText(`${map.getCenter().getLat()}, ${map.getCenter().getLng()}`).then(()=>alert("현재 지도 위치 좌표를 복사했습니다."));
 $("#around").onclick=()=>map.setLevel(Math.min(13,map.getLevel()+2));drawMarkers()
}
window.mapLoadFailed=function(){$("#apiNotice").innerHTML="<b>카카오맵을 불러오지 못했습니다.</b><span>카카오 개발자 콘솔에 GitHub Pages 도메인을 Web 플랫폼으로 등록하세요.</span>";render()}
function addressToCoord(address,cb){if(!geocoder||!address)return cb();geocoder.addressSearch(address,(r,s)=>s===kakao.maps.services.Status.OK?cb(+r[0].y,+r[0].x):cb())}
function normalize(row,i){
 let keys=Object.keys(row),get=(...names)=>{let k=keys.find(k=>names.some(n=>String(k).replace(/\s/g,"").toLowerCase()===n.replace(/\s/g,"").toLowerCase()));return k!==undefined?row[k]:""};
 let address=get("주소","소재지","주소지","도로명주소"),title=get("제목","매물제목","물건명")||`현지 매물 ${i+1}`,type=get("종류","매물종류","중개대상물종류")||"상가·사무실";
 let area=Number(String(get("면적","전용면적","전용면적㎡")).replace(/[^0-9.]/g,""))||0;
 let dep=Number(String(get("보증금","보증금만원")).replace(/[^0-9.]/g,""))||0,rent=Number(String(get("월세","월세만원")).replace(/[^0-9.]/g,""))||0,fee=Number(String(get("관리비","관리비원")).replace(/[^0-9.]/g,""))||0;
 let sale=Number(String(get("매매가","매매금액","매매")).replace(/[^0-9.]/g,""))||0,trade=get("거래유형","거래형태")||(sale?"매매":rent?"월세":"");
 return {id:String(get("매물번호","번호","id")||10000+i+1),category:type,trade,address,title,area,floor:get("층","층수")||"",deposit:dep,rent,fee,sale,theme:String(get("테마","테마종류")||"").split(/[,/ ]+/).filter(Boolean),parking:String(get("주차","주차대수")||"").trim()!=="",image:get("사진URL","사진url","사진","이미지")||"",lat:Number(get("위도","lat"))||0,lng:Number(get("경도","lng"))||0}
}
async function importExcel(file){
 if(!isAdmin){alert("관리자 로그인 후 매물을 등록할 수 있습니다.");return}
 const data=await file.arrayBuffer(),wb=XLSX.read(data,{type:"array"}),sheet=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(sheet,{defval:""});
 if(!rows.length){alert("엑셀에서 데이터를 찾지 못했습니다.");return}
 LISTINGS=rows.map(normalize);
 $("#fileStatus").textContent=`${file.name} · ${LISTINGS.length}개`;
 if(geocoder){let pending=LISTINGS.filter(x=>x.address&&!x.lat&&!x.lng);for(let i=0;i<pending.length;i++)await new Promise(r=>addressToCoord(pending[i].address,(lat,lng)=>{pending[i].lat=lat||0;pending[i].lng=lng||0;r()}))}
 saveListings();render();alert(`${LISTINGS.length}개 매물을 등록했습니다.`)
}
document.addEventListener("DOMContentLoaded",()=>{
 ["search","trade","area","price","type","theme","sort"].forEach(id=>$("#"+id).addEventListener("input",render));
 document.querySelectorAll(".topnav [data-cat]").forEach(b=>b.onclick=()=>{$("#type").value=b.dataset.cat==="원룸·투룸·쓰리룸"?"원룸·투룸·쓰리룸":b.dataset.cat;render()});
 $("#reset").onclick=()=>{["search","trade","area","price","type","theme"].forEach(id=>$("#"+id).value="");advanced={minArea:"",maxArea:"",maxDeposit:"",maxRent:"",parking:false};render()};
 $("#allFilter").onclick=()=>$("#advanced").showModal();
 $("#apply").onclick=()=>{advanced={minArea:$("#minArea").value,maxArea:$("#maxArea").value,maxDeposit:$("#maxDeposit").value,maxRent:$("#maxRent").value,parking:$("#parking").checked};setTimeout(render,0)};
 $("#uploadBtn").onclick=()=>{if(!isAdmin){$("#loginDialog").showModal();return}$("#excelFile").click()};
 $("#excelFile").onchange=e=>e.target.files[0]&&importExcel(e.target.files[0]);
 $("#adminBtn").onclick=()=>{
   if(isAdmin){setAdminMode(false);return}
   $("#adminPassword").value="";
   $("#loginDialog").showModal();
 };
 $("#loginSubmit").onclick=(e)=>{
   const password=$("#adminPassword").value;
   if(password!==window.ADMIN_PASSWORD){
     e.preventDefault();
     alert("관리자 비밀번호가 올바르지 않습니다.");
     return;
   }
   setAdminMode(true);
 };
 $("#mapBtn").onclick=()=>{$(".main").classList.remove("list-mode");$("#mapBtn").classList.add("on");$("#listBtn").classList.remove("on")};
 $("#listBtn").onclick=()=>{$(".main").classList.add("list-mode");$("#listBtn").classList.add("on");$("#mapBtn").classList.remove("on")};
 render()
});
</script>
<script>
(function(){
  const s=document.createElement('script');
  s.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+encodeURIComponent(window.KAKAO_APP_KEY)+'&libraries=services&autoload=false';
  s.onload=()=>window.kakao.maps.load(()=>window.initListingMap());
  s.onerror=()=>window.mapLoadFailed();
  document.head.appendChild(s);
})();
</script>
</body>
</html>
