<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>현지공인중개사 매물지도</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Malgun Gothic","Noto Sans KR",sans-serif;
  background:#f4f6f8;
  color:#222;
}

header{
  height:64px;
  background:#fff;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  position:relative;
  z-index:1000;
}

.logo{
  font-size:21px;
  font-weight:700;
}

.header-right{
  display:flex;
  align-items:center;
  gap:10px;
}

button{
  border:0;
  border-radius:9px;
  padding:10px 15px;
  cursor:pointer;
  font-size:14px;
}

.login-btn{
  background:#4285f4;
  color:white;
}

.logout-btn{
  background:#eee;
}

.admin-badge{
  display:none;
  background:#e8f0fe;
  color:#1967d2;
  padding:8px 12px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
}

.layout{
  height:calc(100vh - 64px);
  display:flex;
}

.sidebar{
  width:390px;
  background:#fff;
  border-right:1px solid #ddd;
  overflow-y:auto;
  padding:18px;
}

.map-wrap{
  flex:1;
  position:relative;
}

#map{
  width:100%;
  height:100%;
}

.search{
  width:100%;
  height:43px;
  border:1px solid #ddd;
  border-radius:9px;
  padding:0 13px;
  margin-bottom:10px;
  font-size:14px;
}

.filters{
  display:flex;
  gap:7px;
  margin-bottom:15px;
}

.filters select{
  flex:1;
  height:40px;
  border:1px solid #ddd;
  border-radius:8px;
  background:white;
}

.property{
  border:1px solid #e2e5e8;
  border-radius:12px;
  padding:15px;
  margin-bottom:10px;
  background:#fff;
  cursor:pointer;
  transition:.15s;
}

.property:hover{
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.property-title{
  font-weight:bold;
  font-size:16px;
  margin-bottom:8px;
}

.property-price{
  color:#d93025;
  font-weight:bold;
  margin-bottom:7px;
}

.property-address{
  color:#555;
  font-size:13px;
  line-height:1.5;
}

.property-info{
  color:#777;
  font-size:12px;
  margin-top:7px;
}

.admin-panel{
  display:none;
  margin-bottom:18px;
  padding:16px;
  border-radius:12px;
  background:#f8faff;
  border:1px solid #d8e5ff;
}

.admin-panel h3{
  margin:0 0 12px;
  font-size:16px;
}

.input{
  width:100%;
  height:40px;
  border:1px solid #d8dce0;
  border-radius:8px;
  padding:0 10px;
  margin-bottom:8px;
  background:white;
}

textarea.input{
  height:70px;
  padding:10px;
  resize:vertical;
}

.add-btn{
  width:100%;
  background:#1a73e8;
  color:#fff;
  font-weight:bold;
}

.edit-btn{
  background:#f1f3f4;
  margin-top:8px;
  margin-right:5px;
}

.delete-btn{
  background:#fce8e6;
  color:#c5221f;
  margin-top:8px;
}

.empty{
  text-align:center;
  color:#888;
  padding:40px 10px;
}

.status{
  font-size:12px;
  color:#777;
  margin:8px 0 12px;
}

@media(max-width:800px){

  header{
    height:58px;
    padding:0 12px;
  }

  .logo{
    font-size:16px;
  }

  .layout{
    height:calc(100vh - 58px);
    flex-direction:column;
  }

  .sidebar{
    width:100%;
    height:48%;
    border-right:0;
    border-bottom:1px solid #ddd;
  }

  .map-wrap{
    height:52%;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    📍 현지공인중개사 매물지도
  </div>

  <div class="header-right">

    <span id="adminBadge" class="admin-badge">
      관리자
    </span>

    <span id="userEmail"
          style="font-size:12px;color:#777;"></span>

    <button id="loginBtn"
            class="login-btn">
      🔐 Google 로그인
    </button>

    <button id="logoutBtn"
            class="logout-btn"
            style="display:none;">
      로그아웃
    </button>

  </div>

</header>


<div class="layout">

  <aside class="sidebar">

    <!-- 관리자 등록 -->
    <div id="adminPanel"
         class="admin-panel">

      <h3>➕ 매물 등록</h3>

      <input
        id="title"
        class="input"
        placeholder="매물 제목">

      <input
        id="address"
        class="input"
        placeholder="주소">

      <select
        id="type"
        class="input">

        <option value="상가">상가</option>
        <option value="공장">공장</option>
        <option value="사무실">사무실</option>
        <option value="원룸">원룸</option>
        <option value="아파트">아파트</option>
        <option value="기타">기타</option>

      </select>

      <input
        id="deposit"
        class="input"
        placeholder="보증금 (만원)">

      <input
        id="rent"
        class="input"
        placeholder="월세 (만원)">

      <input
        id="area"
        class="input"
        placeholder="면적">

      <input
        id="floor"
        class="input"
        placeholder="층">

      <textarea
        id="description"
        class="input"
        placeholder="매물 설명"></textarea>

      <button
        id="addBtn"
        class="add-btn">
        매물 등록하기
      </button>

      <div id="adminStatus"
           class="status"></div>

    </div>


    <input
      id="search"
      class="search"
      placeholder="🔎 주소·매물명 검색">


    <div class="filters">

      <select id="typeFilter">
        <option value="">전체</option>
        <option value="상가">상가</option>
        <option value="공장">공장</option>
        <option value="사무실">사무실</option>
        <option value="원룸">원룸</option>
        <option value="아파트">아파트</option>
        <option value="기타">기타</option>
      </select>

    </div>


    <div id="propertyList">
      <div class="empty">
        매물을 불러오는 중입니다.
      </div>
    </div>

  </aside>


  <main class="map-wrap">
    <div id="map"></div>
  </main>

</div>


<script type="module">

/* =====================================================
   🔥 FIREBASE 설정
===================================================== */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  updateDoc,
  deleteDoc,
  doc,
  serverTimestamp,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
  "AIzaSyAC9YI78OLAKD4KJNJZTT6KRrhevG5GpVM",

  authDomain:
  "hyunji-8fc9c.firebaseapp.com",

  projectId:
  "hyunji-8fc9c",

  storageBucket:
  "hyunji-8fc9c.firebasestorage.app",

  messagingSenderId:
  "659657503337",

  appId:
  "1:659657503337:web:aa2e24ae4d37ed29d6a8f8",

  measurementId:
  "G-1LPMGC6317"
};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);

const provider =
  new GoogleAuthProvider();


/* =====================================================
   관리자 이메일
===================================================== */

const ADMIN_EMAIL =
  "khj0107776@gmail.com";


/* =====================================================
   지도
===================================================== */

const map =
  L.map("map").setView(
    [36.8151,127.1139],
    13
  );

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution:
      '&copy; OpenStreetMap contributors'
  }
).addTo(map);


let markers = {};

let properties = [];


/* =====================================================
   DOM
===================================================== */

const loginBtn =
  document.getElementById("loginBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const userEmail =
  document.getElementById("userEmail");

const adminBadge =
  document.getElementById("adminBadge");

const adminPanel =
  document.getElementById("adminPanel");

const propertyList =
  document.getElementById("propertyList");

const search =
  document.getElementById("search");

const typeFilter =
  document.getElementById("typeFilter");


/* =====================================================
   Google 로그인
===================================================== */

loginBtn.addEventListener(
  "click",
  async () => {

    try {

      await signInWithPopup(
        auth,
        provider
      );

    } catch(error) {

      console.error(error);

      alert(
        "Google 로그인 중 오류가 발생했습니다.\n\n"
        + error.message
      );
    }

  }
);


/* =====================================================
   로그아웃
===================================================== */

logoutBtn.addEventListener(
  "click",
  async () => {

    await signOut(auth);

  }
);


/* =====================================================
   로그인 상태 확인
===================================================== */

onAuthStateChanged(
  auth,
  user => {

    if(user){

      userEmail.textContent =
        user.email;

      loginBtn.style.display =
        "none";

      logoutBtn.style.display =
        "block";

      if(
        user.email.toLowerCase()
        === ADMIN_EMAIL.toLowerCase()
      ){

        adminBadge.style.display =
          "inline-block";

        adminPanel.style.display =
          "block";

      }else{

        adminBadge.style.display =
          "none";

        adminPanel.style.display =
          "none";

      }

    }else{

      userEmail.textContent =
        "";

      loginBtn.style.display =
        "block";

      logoutBtn.style.display =
        "none";

      adminBadge.style.display =
        "none";

      adminPanel.style.display =
        "none";

    }

    renderList();

  }
);


/* =====================================================
   주소 → 좌표
   OpenStreetMap Nominatim
===================================================== */

async function geocodeAddress(address){

  const url =
    "https://nominatim.openstreetmap.org/search?"
    + new URLSearchParams({

      q: address + ", 대한민국",

      format:"json",

      limit:"1"

    });

  const response =
    await fetch(url);

  const data =
    await response.json();

  if(!data.length){

    throw new Error(
      "주소의 위치를 찾지 못했습니다."
    );

  }

  return {

    lat:
      Number(data[0].lat),

    lng:
      Number(data[0].lon)

  };

}


/* =====================================================
   매물 등록
===================================================== */

document
.getElementById("addBtn")
.addEventListener(
  "click",
  async () => {

    const user =
      auth.currentUser;

    if(!user){

      alert(
        "먼저 관리자 Google 로그인을 해주세요."
      );

      return;

    }


    if(
      user.email.toLowerCase()
      !== ADMIN_EMAIL.toLowerCase()
    ){

      alert(
        "관리자 계정만 매물을 등록할 수 있습니다."
      );

      return;

    }


    const title =
      document.getElementById("title").value.trim();

    const address =
      document.getElementById("address").value.trim();

    const type =
      document.getElementById("type").value;

    const deposit =
      document.getElementById("deposit").value.trim();

    const rent =
      document.getElementById("rent").value.trim();

    const area =
      document.getElementById("area").value.trim();

    const floor =
      document.getElementById("floor").value.trim();

    const description =
      document
      .getElementById("description")
      .value.trim();


    if(!title || !address){

      alert(
        "매물명과 주소를 입력해주세요."
      );

      return;

    }


    const status =
      document.getElementById("adminStatus");

    status.textContent =
      "📍 주소 위치를 찾는 중입니다...";


    try{

      const position =
        await geocodeAddress(address);


      await addDoc(
        collection(db,"properties"),
        {

          title,

          address,

          type,

          deposit,

          rent,

          area,

          floor,

          description,

          lat:
            position.lat,

          lng:
            position.lng,

          createdAt:
            serverTimestamp(),

          createdBy:
            user.email

        }
      );


      status.textContent =
        "✅ 매물이 등록되었습니다.";


      document
      .getElementById("title")
      .value = "";

      document
      .getElementById("address")
      .value = "";

      document
      .getElementById("deposit")
      .value = "";

      document
      .getElementById("rent")
      .value = "";

      document
      .getElementById("area")
      .value = "";

      document
      .getElementById("floor")
      .value = "";

      document
      .getElementById("description")
      .value = "";


      await loadProperties();


    }catch(error){

      console.error(error);

      status.textContent =
        "❌ 등록 오류";

      alert(
        "매물 등록 중 오류가 발생했습니다.\n\n"
        + error.message
      );

    }

  }
);


/* =====================================================
   Firestore 매물 불러오기
===================================================== */

async function loadProperties(){

  try{

    const q =
      query(
        collection(db,"properties"),
        orderBy("createdAt","desc")
      );

    const snapshot =
      await getDocs(q);

    properties =
      snapshot.docs.map(
        item => ({

          id:
            item.id,

          ...item.data()

        })
      );


    renderList();

  }catch(error){

    console.error(error);

    propertyList.innerHTML =
      `
      <div class="empty">
        매물을 불러오지 못했습니다.<br>
        Firestore 보안 규칙을 확인해주세요.
      </div>
      `;

  }

}


/* =====================================================
   목록 표시
===================================================== */

function renderList(){

  const keyword =
    search.value
    .trim()
    .toLowerCase();

  const type =
    typeFilter.value;


  const filtered =
    properties.filter(
      item => {

        const matchKeyword =
          !keyword
          ||
          String(item.title || "")
          .toLowerCase()
          .includes(keyword)
          ||
          String(item.address || "")
          .toLowerCase()
          .includes(keyword);

        const matchType =
          !type
          ||
          item.type === type;

        return (
          matchKeyword
          &&
          matchType
        );

      }
    );


  if(!filtered.length){

    propertyList.innerHTML =
      `
      <div class="empty">
        등록된 매물이 없습니다.
      </div>
      `;

    return;

  }


  propertyList.innerHTML =
    filtered.map(
      item => {

        const price =
          item.deposit || item.rent
          ?
          `${item.deposit || 0} / ${item.rent || 0}만원`
          :
          "가격 문의";


        return `

        <div
          class="property"
          data-id="${item.id}">

          <div class="property-title">
            ${escapeHtml(item.title || "")}
          </div>

          <div class="property-price">
            ${price}
          </div>

          <div class="property-address">
            📍 ${escapeHtml(item.address || "")}
          </div>

          <div class="property-info">

            ${escapeHtml(item.type || "")}

            ${item.area
              ? " · " + escapeHtml(item.area)
              : ""}

            ${item.floor
              ? " · " + escapeHtml(item.floor)
              : ""}

          </div>

          ${
            isAdmin()
            ?
            `
            <button
              class="edit-btn"
              data-edit="${item.id}">
              ✏️ 수정
            </button>

            <button
              class="delete-btn"
              data-delete="${item.id}">
              🗑️ 삭제
            </button>
            `
            :
            ""
          }

        </div>

        `;

      }
    ).join("");


  document
  .querySelectorAll(".property")
  .forEach(
    element => {

      element.addEventListener(
        "click",
        event => {

          if(
            event.target.dataset.edit
            ||
            event.target.dataset.delete
          ){
            return;
          }

          const id =
            element.dataset.id;

          const item =
            properties.find(
              x => x.id === id
            );

          if(!item) return;


          if(
            item.lat
            &&
            item.lng
          ){

            map.setView(
              [
                item.lat,
                item.lng
              ],
              17
            );

            if(
              markers[id]
            ){

              markers[id].openPopup();

            }

          }

        }
      );

    }
  );


  document
  .querySelectorAll("[data-delete]")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          deleteProperty(
            button.dataset.delete
          );

        }
      );

    }
  );


  document
  .querySelectorAll("[data-edit]")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          editProperty(
            button.dataset.edit
          );

        }
      );

    }
  );


  drawMarkers(filtered);

}


/* =====================================================
   지도 마커
===================================================== */

function drawMarkers(list){

  Object.values(markers)
  .forEach(
    marker => {

      map.removeLayer(marker);

    }
  );

  markers = {};


  list.forEach(
    item => {

      if(
        item.lat == null
        ||
        item.lng == null
      ){
        return;
      }


      const marker =
        L.marker([
          item.lat,
          item.lng
        ]).addTo(map);


      marker.bindPopup(`

        <strong>
          ${escapeHtml(item.title || "")}
        </strong>

        <br>

        ${escapeHtml(item.address || "")}

        <br><br>

        ${
          item.deposit || item.rent
          ?
          `💰 ${item.deposit || 0} / ${item.rent || 0}만원`
          :
          ""
        }

      `);


      markers[item.id] =
        marker;

    }
  );

}


/* =====================================================
   관리자 확인
===================================================== */

function isAdmin(){

  const user =
    auth.currentUser;

  return !!(
    user
    &&
    user.email
    &&
    user.email.toLowerCase()
    === ADMIN_EMAIL.toLowerCase()
  );

}


/* =====================================================
   매물 삭제
===================================================== */

async function deleteProperty(id){

  if(!isAdmin()){

    alert(
      "관리자만 삭제할 수 있습니다."
    );

    return;

  }


  if(
    !confirm(
      "이 매물을 삭제하시겠습니까?"
    )
  ){
    return;
  }


  try{

    await deleteDoc(
      doc(
        db,
        "properties",
        id
      )
    );

    await loadProperties();

  }catch(error){

    console.error(error);

    alert(
      "삭제 중 오류가 발생했습니다.\n"
      + error.message
    );

  }

}


/* =====================================================
   매물 수정
===================================================== */

async function editProperty(id){

  if(!isAdmin()){

    alert(
      "관리자만 수정할 수 있습니다."
    );

    return;

  }


  const item =
    properties.find(
      x => x.id === id
    );

  if(!item) return;


  const title =
    prompt(
      "매물명",
      item.title || ""
    );

  if(title === null) return;


  const address =
    prompt(
      "주소",
      item.address || ""
    );

  if(address === null) return;


  const deposit =
    prompt(
      "보증금(만원)",
      item.deposit || ""
    );

  if(deposit === null) return;


  const rent =
    prompt(
      "월세(만원)",
      item.rent || ""
    );

  if(rent === null) return;


  try{

    let lat =
      item.lat;

    let lng =
      item.lng;


    if(address !== item.address){

      const position =
        await geocodeAddress(address);

      lat =
        position.lat;

      lng =
        position.lng;

    }


    await updateDoc(
      doc(
        db,
        "properties",
        id
      ),
      {

        title,

        address,

        deposit,

        rent,

        lat,

        lng,

        updatedAt:
          serverTimestamp(),

        updatedBy:
          auth.currentUser.email

      }
    );


    await loadProperties();


  }catch(error){

    console.error(error);

    alert(
      "수정 중 오류가 발생했습니다.\n"
      + error.message
    );

  }

}


/* =====================================================
   검색
===================================================== */

search.addEventListener(
  "input",
  renderList
);

typeFilter.addEventListener(
  "change",
  renderList
);


/* =====================================================
   HTML 문자 처리
===================================================== */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================================
   시작
===================================================== */

loadProperties();

</script>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

</body>
</html>
