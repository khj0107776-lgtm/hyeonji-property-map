/* =========================

========================= */

let currentUser = null;

let properties = [];

let selectedType = "전체";

let searchText = "";

let map;

let markers = [];

/* =========================

========================= */

window.closeModal = function(id){

    document
    .getElementById(id)
    .classList
    .remove("show");

};



function money(value){

    if(
        value === undefined ||
        value === null ||
        value === ""
    ){
        return "-";
    }

    return Number(value)
    .toLocaleString("ko-KR")
    + "만원";
}



function escapeHtml(value = ""){

    return String(value)
    .replace(
        /[&<>"']/g,
        function(m){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[m];

        }
    );

}



function normalizeUrl(url){

    if(!url){
        return "";
    }

    if(
        /^https?:\/\//i.test(url)
    ){
        return url;
    }

    return "https://" + url;

}



/* =========================
   지도
========================= */

function initMap(){

    map =
    new kakao.maps.Map(
        document.getElementById("map"),
        {
            center:
            new kakao.maps.LatLng(
                36.8151,
                127.1139
            ),

            level:7
        }
    );


    geocoder =
    new kakao.maps.services.Geocoder();

}



function clearMarkers(){

    markers.forEach(
        marker =>
        marker.setMap(null)
    );

    markers = [];

}



function drawMap(){

    clearMarkers();

    const filtered =
    getFiltered();


    filtered.forEach(
        property => {

            if(
                !property.lat ||
                !property.lng
            ){
                return;
            }


            const marker =
            new kakao.maps.Marker({

                map:map,

                position:
                new kakao.maps.LatLng(
                    property.lat,
                    property.lng
                )

            });


            kakao.maps.event.addListener(
                marker,
                "click",
                function(){

                    openDetail(property);

                }
            );


            markers.push(marker);

        }
    );

}



function geocodeAddress(
    address,
    callback
){

    if(
        !geocoder ||
        !address
    ){
        callback(null);
        return;
    }


    geocoder.addressSearch(
        address,
        function(result,status){

            if(
                status ===
                kakao.maps.services.Status.OK
                &&
                result[0]
            ){

                const r =
                result[0];


                callback({

                    lat:Number(r.y),

                    lng:Number(r.x),

                    dong:
                    r.address?.region_3depth_name
                    ||
                    r.road_address?.region_3depth_name
                    ||
                    ""

                });

            }
            else{

                callback(null);

            }

        }
    );

}



/* =========================
   검색 / 필터
========================= */

function getFiltered(){

    return properties.filter(

        property => {

            const typeOK =
            selectedType === "전체"
            ||
            property.type === selectedType;


            const q =
            searchText
            .trim()
            .toLowerCase();


            const text =
            [
                property.title,
                property.address,
                property.dong,
                property.description
            ]
            .join(" ")
            .toLowerCase();


            return (
                typeOK &&
                (
                    !q ||
                    text.includes(q)
                )
            );

        }

    );

}



/* =========================
   화면 표시
========================= */

function render(){

    const filtered =
    getFiltered();


    document
    .getElementById("countLine")
    .textContent =
    `현재 ${filtered.length}개 매물 · 동별 매물 수 표시`;


    const list =
    document.getElementById("list");


    if(!filtered.length){

        list.innerHTML =
        `
        <div class="empty">
            등록된 매물이 없습니다.
        </div>
        `;

    }
    else{

        list.innerHTML =
        filtered.map(

            property => `

            <div
                class="card"
                onclick="openDetailById('${property.id}')"
            >

                ${
                    property.imageData

                    ?

                    `
                    <img
                        class="thumb"
                        src="${property.imageData}"
                    >
                    `

                    :

                    `

/* =========================
   동별 개수
========================= */

function renderDongCounts(
    filtered
){

    const counts = {};


    filtered.forEach(
        property => {

            const dong =
            property.dong
            ||
            "기타";


            counts[dong] =
            (counts[dong] || 0)
            + 1;

        }
    );


    const sorted =
    Object.entries(counts)
    .sort(
        (a,b) =>
        b[1]-a[1]
    )
    .slice(0,12);


    document
    .getElementById("dongCounts")
    .innerHTML =

    sorted.map(

        ([dong,count]) => `

        <div class="dongCount">

            <b>${count}</b>

            ${escapeHtml(dong)}

        </div>

        `

    ).join("");

}

/* =========================

   Storage 없이 Firestore 저장
========================= */

document
.getElementById("pPhoto")
.addEventListener(
    "change",
    function(event){

        const file =
        event.target.files[0];


        if(!file)return;


        const reader =
        new FileReader();


        reader.onload =
        function(){

            compressImage(
                reader.result
            )
            .then(
                function(data){

                    imageDataForForm =
                    data;


                    const preview =
                    document
                    .getElementById(
                        "photoPreview"
                    );


                    preview.src =
                    data;


                    preview.style.display =
                    "block";

                }
            );

        };


        reader.readAsDataURL(file);

    }
);



function compressImage(
    source
){

    return new Promise(
        function(resolve){

            const img =
            new Image();


            img.onload =
            function(){

                const max =
                1000;


                const scale =
                Math.min(
                    1,
                    max /
                    Math.max(
                        img.width,
                        img.height
                    )
                );


                const canvas =
                document.createElement(
                    "canvas"
                );


                canvas.width =
                Math.round(
                    img.width * scale
                );


                canvas.height =
                Math.round(
                    img.height * scale
                );


                const ctx =
                canvas.getContext(
                    "2d"
                );


                ctx.drawImage(
                    img,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                let quality =
                0.72;


                let data =
                canvas.toDataURL(
                    "image/jpeg",
                    quality
                );


                while(
                    data.length > 900000
                    &&
                    quality > 0.35
                ){

                    quality -= 0.06;


                    data =
                    canvas.toDataURL(
                        "image/jpeg",
                        quality
                    );

                }


                resolve(data);

            };


            img.src =
            source;

        }
    );

}

        .getElementById("pTitle")
        .value
        .trim(),


        address:address,


        type:
        document
        .getElementById("pType")
        .value,


        deposit:
        Number(
            document
            .getElementById("pDeposit")
            .value || 0
        ),


        rent:
        Number(
            document
            .getElementById("pRent")
            .value || 0
        ),


        sale:
        Number(
            document
            .getElementById("pSale")
            .value || 0
        ),


        premium:
        Number(
            document
            .getElementById("pPremium")
            .value || 0
        ),


        area:
        document
        .getElementById("pArea")
        .value
        .trim(),


        floor:
        document
        .getElementById("pFloor")
        .value
        .trim(),


        description:
        document
        .getElementById("pDescription")
        .value
        .trim(),


        detailUrl:
        document
        .getElementById("pUrl")
        .value
        .trim(),


        imageData:
        imageDataForForm,


        createdBy:
        currentUser.email

    };


    geocodeAddress(
        address,
        async function(geo){

            if(!geo){

                alert(
                    "주소를 찾지 못했습니다.\n\n"
                    +
                    "정확한 도로명주소 또는 지번주소를 입력해주세요."
                );

                return;

            }


            const data = {

                ...baseData,

                lat:geo.lat,

                lng:geo.lng,

                dong:geo.dong

            };


            try{

                if(editId){

                    data.updatedAt =
                    serverTimestamp();


                    await updateDoc(
                        doc(
                            db,
                            "properties",
                            editId
                        ),
                        data
                    );

                }
                else{

                    data.createdAt =
                    serverTimestamp();


                    await addDoc(
                        collection(
                            db,
                            "properties"
                        ),
                        data
                    );

                closeModal(
                    "adminModal"

                    editId
                    ?
                    "매물이 수정되었습니다."

                    "매물이 등록되었습니다."
                );

            }
            catch(error){

                alert(
                    "매물 저장 오류:\n"
                    +
                    error.message
                );

            }

        }
    );

};
