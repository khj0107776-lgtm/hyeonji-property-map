<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>현지공인중개사 매물지도</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:Arial,"Malgun Gothic","Noto Sans KR",sans-serif;
    background:#f4f6f8;
    color:#222;
}

button,input,select,textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.header{
    height:64px;
    background:#fff;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    position:relative;
    z-index:1000;
}

.logo{
    font-size:20px;
    font-weight:800;
    color:#222;
}

.logo span{
    color:#4d73ff;
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.login-user{
    font-size:13px;
    color:#555;
}

.btn{
    border:0;
    border-radius:8px;
    padding:10px 15px;
    font-size:14px;
    font-weight:700;
}

.btn-google{
    background:#fff;
    border:1px solid #ddd;
    color:#333;
}

.btn-primary{
    background:#4d73ff;
    color:#fff;
}

.btn-danger{
    background:#e74c3c;
    color:#fff;
}

.btn-gray{
    background:#eee;
    color:#333;
}

.layout{
    display:flex;
    width:100%;
    height:calc(100vh - 64px);
}

.sidebar{
    width:390px;
    min-width:390px;
    background:#fff;
    border-right:1px solid #ddd;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.sidebar-top{
    padding:15px;
    border-bottom:1px solid #eee;
}

.search{
    width:100%;
    padding:12px 13px;
    border:1px solid #ddd;
    border-radius:9px;
    outline:none;
    font-size:14px;
}

.filter-row{
    display:flex;
    gap:7px;
    margin-top:9px;
}

.filter-row select{
    flex:1;
    padding:9px;
    border:1px solid #ddd;
    border-radius:8px;
    background:#fff;
}

.admin-panel{
    margin-top:12px;
    padding:12px;
    background:#f5f7ff;
    border:1px solid #dce3ff;
    border-radius:10px;
}

.admin-title{
    font-weight:800;
    font-size:14px;
    margin-bottom:9px;
}

.property-list{
    flex:1;
    overflow-y:auto;
    padding:10px;
}

.property-card{
    border:1px solid #e1e1e1;
    border-radius:11px;
    padding:13px;
    margin-bottom:9px;
    background:#fff;
    transition:.15s;
}

.property-card:hover{
    border-color:#8ca3ff;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.property-type{
    display:inline-block;
    background:#edf1ff;
    color:#4264d8;
    border-radius:5px;
    padding:4px 7px;
    font-size:11px;
    font-weight:800;
}

.property-title{
    font-size:16px;
    font-weight:800;
    margin:8px 0 5px;
}

.property-address{
    color:#666;
    font-size:13px;
    line-height:1.5;
}

.property-price{
    font-size:15px;
    font-weight:800;
    margin-top:9px;
}

.property-info{
    margin-top:7px;
    color:#777;
    font-size:12px;
}

.card-buttons{
    display:flex;
    gap:6px;
    margin-top:10px;
}

.card-buttons button{
    flex:1;
    padding:7px;
    border:0;
    border-radius:7px;
    font-size:12px;
    font-weight:700;
}

.edit-btn{
    background:#edf1ff;
    color:#4264d8;
}

.delete-btn{
    background:#fff0ee;
    color:#d63d2e;
}

.map-area{
    flex:1;
    position:relative;
    background:#e9edf2;
    overflow:hidden;
}

.map-placeholder{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#777;
    background:
        linear-gradient(90deg,rgba(255,255,255,.55) 1px,transparent 1px),
        linear-gradient(rgba(255,255,255,.55) 1px,transparent 1px);
    background-size:40px 40px;
}

.map-message{
    background:#fff;
    padding:25px 30px;
    border-radius:15px;
    box-shadow:0 4px 20px rgba(0,0,0,.12);
}

.map-message h2{
    margin:0 0 10px;
}

.status{
    position:absolute;
    bottom:15px;
    left:15px;
    background:#fff;
    padding:9px 13px;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.12);
    font-size:12px;
    z-index:20;
}

.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:3000;
    padding:20px;
}

.modal-bg.show{
    display:flex;
}

.modal{
    width:600px;
    max-width:100%;
    max-height:90vh;
    overflow-y:auto;
    background:#fff;
    border-radius:15px;
    padding:22px;
    box-shadow:0 15px 50px rgba(0,0,0,.3);
}

.modal h2{
    margin:0 0 18px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.form-group.full{
    grid-column:1 / -1;
}

.form-group label{
    font-size:12px;
    font-weight:800;
    color:#555;
}

.form-group input,
.form-group select,
.form-group textarea{
    border:1px solid #ddd;
    border-radius:8px;
    padding:10px;
    outline:none;
    font-size:14px;
}

.form-group textarea{
    min-height:90px;
    resize:vertical;
}

.modal-buttons{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:18px;
}

.empty{
    padding:40px 15px;
    text-align:center;
    color:#999;
    font-size:14px;
}

.admin-only{
    display:none;
}

.admin-mode .admin-only{
    display:block;
}

@media(max-width:800px){

    .header{
        height:58px;
        padding:0 12px;
    }

    .logo{
        font-size:16px;
    }

    .login-user{
        display:none;
    }

    .layout{
        height:calc(100vh - 58px);
    }

    .sidebar{
        width:100%;
        min-width:0;
    }

    .map-area{
        display:none;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        현지<span>공인중개사</span> 매물지도
    </div>

    <div class="header-right">

        <div id="loginUser" class="login-user"></div>

        <button id="loginBtn"
                class="btn btn-google"
                onclick="googleLogin()">
            🔐 관리자 Google 로그인
        </button>

        <button id="logoutBtn"
                class="btn btn-gray"
                style="display:none"
                onclick="logout()">
            로그아웃
        </button>

    </div>

</header>


<div class="layout">

    <aside class="sidebar">

        <div class="sidebar-top">

            <input
                id="searchInput"
                class="search"
                placeholder="주소, 매물명, 종류 검색"
                oninput="renderList()"
            >

            <div class="filter-row">

                <select id="typeFilter" onchange="renderList()">
                    <option value="">전체</option>
                    <option value="상가">상가</option>
                    <option value="공장">공장</option>
                    <option value="창고">창고</option>
                    <option value="사무실">사무실</option>
                    <option value="원룸">원룸</option>
                    <option value="투룸">투룸</option>
                    <option value="아파트">아파트</option>
                    <option value="기타">기타</option>
                </select>

                <button
                    id="addBtn"
                    class="btn btn-primary admin-only"
                    onclick="openAddModal()">
                    + 매물등록
                </button>

            </div>

            <div id="adminPanel"
                 class="admin-panel admin-only">

                <div class="admin-title">
                    🔐 관리자 모드
                </div>

                <div id="adminEmail"
                     style="font-size:12px;color:#555;">
                </div>

            </div>

        </div>

        <div id="propertyList"
             class="property-list">
        </div>

    </aside>


    <main class="map-area">

        <div class="map-placeholder">

            <div class="map-message">

                <h2>📍 현지공인중개사 매물지도</h2>

                <div>
                    등록된 매물을 확인할 수 있습니다.
                </div>

                <div style="margin-top:8px;color:#999;font-size:13px;">
                    Firebase Firestore 연동 완료
                </div>

            </div>

        </div>

        <div id="status"
             class="status">
            Firebase 연결 중...
        </div>

    </main>

</div>


<!-- 매물 등록 / 수정 모달 -->

<div id="modalBg"
     class="modal-bg">

    <div class="modal">

        <h2 id="modalTitle">
            매물 등록
        </h2>

        <div class="form-grid">

            <div class="form-group">
                <label>매물 종류</label>

                <select id="pType">
                    <option value="상가">상가</option>
                    <option value="공장">공장</option>
                    <option value="창고">창고</option>
                    <option value="사무실">사무실</option>
                    <option value="원룸">원룸</option>
                    <option value="투룸">투룸</option>
                    <option value="아파트">아파트</option>
                    <option value="기타">기타</option>
                </select>
            </div>


            <div class="form-group">
                <label>매물명</label>

                <input
                    id="pTitle"
                    placeholder="예: 신부동 1층 상가"
                >
            </div>


            <div class="form-group full">

                <label>주소</label>

                <input
                    id="pAddress"
                    placeholder="예: 천안시 동남구 신부동 123-4"
                >

            </div>


            <div class="form-group">

                <label>보증금</label>

                <input
                    id="pDeposit"
                    type="number"
                    placeholder="만원"
                >

            </div>


            <div class="form-group">

                <label>월세</label>

                <input
                    id="pRent"
                    type="number"
                    placeholder="만원"
                >

            </div>


            <div class="form-group">

                <label>관리비</label>

                <input
                    id="pManagement"
                    placeholder="예: 10만원 / 없음"
                >

            </div>


            <div class="form-group">

                <label>면적</label>

                <input
                    id="pArea"
                    placeholder="예: 89.9㎡ (27.1평)"
                >

            </div>


            <div class="form-group">

                <label>층수</label>

                <input
                    id="pFloor"
                    placeholder="예: 1층"
                >

            </div>


            <div class="form-group">

                <label>방 / 화장실</label>

                <input
                    id="pRooms"
                    placeholder="예: 방 2개 / 화장실 1개"
                >

            </div>


            <div class="form-group">

                <label>주차</label>

                <input
                    id="pParking"
                    placeholder="예: 5대"
                >

            </div>


            <div class="form-group">

                <label>입주 가능일</label>

                <input
                    id="pMove"
                    placeholder="예: 즉시입주"
                >

            </div>


            <div class="form-group">

                <label>권리금</label>

                <input
                    id="pPremium"
                    placeholder="예: 1,500만원 / 없음"
                >

            </div>


            <div class="form-group full">

                <label>상세 설명</label>

                <textarea
                    id="pDescription"
                    placeholder="매물 특징 및 상세 설명을 입력하세요."
                ></textarea>

            </div>

        </div>


        <div class="modal-buttons">

            <button
                class="btn btn-gray"
                onclick="closeModal()">
                취소
            </button>

            <button
                class="btn btn-primary"
                onclick="saveProperty()">
                저장
            </button>

        </div>

    </div>

</div>


<script type="module">

/* =========================================================
   Firebase
========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    doc,
    updateDoc,
    deleteDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================================
   Firebase 설정
========================================================= */

const firebaseConfig = {

    apiKey: "AIzaSyAC9YI780LAKD4KJNJZTT6KRrheVG5GpVM",

    authDomain: "hyunji-8fc9c.firebaseapp.com",

    projectId: "hyunji-8fc9c",

    storageBucket: "hyunji-8fc9c.firebasestorage.app",

    messagingSenderId: "659657503337",

    appId: "1:659657503337:web:aa2e24ae4d37ed29d6a8f8",

    measurementId: "G-1LPMGC6317"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const provider = new GoogleAuthProvider();


/* =========================================================
   관리자 이메일
========================================================= */

/*
   중요:
   여기에 Google 로그인에 사용할 관리자 계정 이메일을 넣어주세요.

   현재 Firebase Authentication에 등록되어 있는
   계정을 우선 사용하도록 설정했습니다.
*/

const ADMIN_EMAILS = [
    "khj0108279@gmail.com"
];


/* =========================================================
   전역 변수
========================================================= */

let currentUser = null;

let properties = [];

let editingId = null;


/* =========================================================
   Google 로그인
========================================================= */

window.googleLogin = async function(){

    try{

        const result =
            await signInWithPopup(auth, provider);

        const user = result.user;

        if(!isAdmin(user)){

            alert(
                "관리자 계정이 아닙니다.\n\n" +
                "관리자로 등록된 Google 계정으로 로그인해주세요."
            );

            await signOut(auth);

            return;
        }

        alert("관리자 로그인 성공!");

    }catch(error){

        console.error(error);

        alert(
            "Google 로그인 중 오류가 발생했습니다.\n\n" +
            error.message
        );

    }

};


/* =========================================================
   로그아웃
========================================================= */

window.logout = async function(){

    try{

        await signOut(auth);

    }catch(error){

        console.error(error);

    }

};


/* =========================================================
   관리자 확인
========================================================= */

function isAdmin(user){

    if(!user){
        return false;
    }

    return ADMIN_EMAILS
        .map(email => email.toLowerCase())
        .includes(
            (user.email || "").toLowerCase()
        );

}


/* =========================================================
   로그인 상태 감시
========================================================= */

onAuthStateChanged(auth, async(user) => {

    currentUser = user;

    const loginBtn =
        document.getElementById("loginBtn");

    const logoutBtn =
        document.getElementById("logoutBtn");

    const loginUser =
        document.getElementById("loginUser");

    const adminEmail =
        document.getElementById("adminEmail");

    document.body.classList.remove("admin-mode");


    if(user && isAdmin(user)){

        document.body.classList.add("admin-mode");

        loginBtn.style.display = "none";

        logoutBtn.style.display = "block";

        loginUser.textContent =
            "관리자 · " + user.email;

        adminEmail.textContent =
            user.email;

    }else{

        loginBtn.style.display = "block";

        logoutBtn.style.display = "none";

        loginUser.textContent = "";

    }


    await loadProperties();

});


/* =========================================================
   Firestore 매물 불러오기
========================================================= */

async function loadProperties(){

    setStatus("매물 불러오는 중...");

    try{

        const snapshot =
            await getDocs(
                collection(db,"properties")
            );

        properties = [];

        snapshot.forEach(item => {

            properties.push({
                id:item.id,
                ...item.data()
            });

        });

        renderList();

        setStatus(
            "매물 " + properties.length + "개"
        );

    }catch(error){

        console.error(error);

        setStatus("Firestore 연결 오류");

        alert(
            "매물을 불러오지 못했습니다.\n\n" +
            "Firestore 규칙을 확인해주세요."
        );

    }

}


/* =========================================================
   매물 목록 표시
========================================================= */

window.renderList = function(){

    const list =
        document.getElementById("propertyList");

    const search =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    const type =
        document
        .getElementById("typeFilter")
        .value;


    let filtered =
        properties.filter(property => {

            const text = (

                (property.title || "") +
                " " +
                (property.address || "") +
                " " +
                (property.type || "") +
                " " +
                (property.description || "")

            ).toLowerCase();


            const matchSearch =
                !search || text.includes(search);

            const matchType =
                !type || property.type === type;


            return matchSearch && matchType;

        });


    if(filtered.length === 0){

        list.innerHTML =
            `<div class="empty">
                등록된 매물이 없습니다.
            </div>`;

        return;

    }


    list.innerHTML =
        filtered.map(property => {

            const deposit =
                property.deposit ?
                Number(property.deposit).toLocaleString() :
                "0";

            const rent =
                property.rent ?
                Number(property.rent).toLocaleString() :
                "0";


            return `

                <div class="property-card">

                    <div class="property-type">
                        ${escapeHtml(property.type || "기타")}
                    </div>

                    <div class="property-title">
                        ${escapeHtml(property.title || "매물")}
                    </div>

                    <div class="property-address">
                        📍 ${escapeHtml(property.address || "")}
                    </div>

                    <div class="property-price">
                        💰 ${deposit} / ${rent}
                    </div>

                    <div class="property-info">

                        ${escapeHtml(property.area || "")}

                        ${property.floor
                            ? " · " + escapeHtml(property.floor)
                            : ""}

                        ${property.parking
                            ? " · 주차 " + escapeHtml(property.parking)
                            : ""}

                    </div>


                    ${
                        isAdmin(currentUser)
                        ?

                        `<div class="card-buttons">

                            <button
                                class="edit-btn"
                                onclick="editProperty('${property.id}')">
                                ✏️ 수정
                            </button>

                            <button
                                class="delete-btn"
                                onclick="deleteProperty('${property.id}')">
                                🗑️ 삭제
                            </button>

                        </div>`

                        : ""

                    }

                </div>

            `;

        }).join("");

};


/* =========================================================
   매물 등록창
========================================================= */

window.openAddModal = function(){

    if(!isAdmin(currentUser)){

        alert("관리자만 매물을 등록할 수 있습니다.");

        return;

    }


    editingId = null;

    document.getElementById("modalTitle")
        .textContent = "매물 등록";


    clearForm();

    document
        .getElementById("modalBg")
        .classList.add("show");

};


/* =========================================================
   수정
========================================================= */

window.editProperty = function(id){

    if(!isAdmin(currentUser)){

        alert("관리자만 수정할 수 있습니다.");

        return;

    }


    const property =
        properties.find(item => item.id === id);


    if(!property){
        return;
    }


    editingId = id;


    document.getElementById("modalTitle")
        .textContent = "매물 수정";


    document.getElementById("pType")
        .value = property.type || "상가";

    document.getElementById("pTitle")
        .value = property.title || "";

    document.getElementById("pAddress")
        .value = property.address || "";

    document.getElementById("pDeposit")
        .value = property.deposit || "";

    document.getElementById("pRent")
        .value = property.rent || "";

    document.getElementById("pManagement")
        .value = property.management || "";

    document.getElementById("pArea")
        .value = property.area || "";

    document.getElementById("pFloor")
        .value = property.floor || "";

    document.getElementById("pRooms")
        .value = property.rooms || "";

    document.getElementById("pParking")
        .value = property.parking || "";

    document.getElementById("pMove")
        .value = property.move || "";

    document.getElementById("pPremium")
        .value = property.premium || "";

    document.getElementById("pDescription")
        .value = property.description || "";


    document
        .getElementById("modalBg")
        .classList.add("show");

};


/* =========================================================
   저장
========================================================= */

window.saveProperty = async function(){

    if(!isAdmin(currentUser)){

        alert("관리자만 저장할 수 있습니다.");

        return;

    }


    const data = {

        type:
            document.getElementById("pType").value,

        title:
            document.getElementById("pTitle").value.trim(),

        address:
            document.getElementById("pAddress").value.trim(),

        deposit:
            Number(
                document.getElementById("pDeposit").value || 0
            ),

        rent:
            Number(
                document.getElementById("pRent").value || 0
            ),

        management:
            document.getElementById("pManagement").value.trim(),

        area:
            document.getElementById("pArea").value.trim(),

        floor:
            document.getElementById("pFloor").value.trim(),

        rooms:
            document.getElementById("pRooms").value.trim(),

        parking:
            document.getElementById("pParking").value.trim(),

        move:
            document.getElementById("pMove").value.trim(),

        premium:
            document.getElementById("pPremium").value.trim(),

        description:
            document.getElementById("pDescription").value.trim(),

        updatedBy:
            currentUser.email,

        updatedAt:
            serverTimestamp()

    };


    if(!data.title){

        alert("매물명을 입력해주세요.");

        return;

    }


    if(!data.address){

        alert("주소를 입력해주세요.");

        return;

    }


    try{

        if(editingId){

            await updateDoc(
                doc(db,"properties",editingId),
                data
            );

            alert("매물이 수정되었습니다.");

        }else{

            data.createdBy =
                currentUser.email;

            data.createdAt =
                serverTimestamp();


            await addDoc(
                collection(db,"properties"),
                data
            );

            alert("매물이 등록되었습니다.");

        }


        closeModal();

        await loadProperties();


    }catch(error){

        console.error(error);

        alert(
            "저장에 실패했습니다.\n\n" +
            "Firestore 규칙에서 현재 관리자 이메일을 허용했는지 확인해주세요.\n\n" +
            error.message
        );

    }

};


/* =========================================================
   삭제
========================================================= */

window.deleteProperty = async function(id){

    if(!isAdmin(currentUser)){

        alert("관리자만 삭제할 수 있습니다.");

        return;

    }


    const property =
        properties.find(item => item.id === id);


    if(!property){
        return;
    }


    const ok =
        confirm(
            `"${property.title || "이 매물"}"을 삭제할까요?`
        );


    if(!ok){
        return;
    }


    try{

        await deleteDoc(
            doc(db,"properties",id)
        );

        alert("삭제되었습니다.");

        await loadProperties();

    }catch(error){

        console.error(error);

        alert(
            "삭제에 실패했습니다.\n\n" +
            error.message
        );

    }

};


/* =========================================================
   모달 닫기
========================================================= */

window.closeModal = function(){

    document
        .getElementById("modalBg")
        .classList.remove("show");

};

========================================================= */

    document.getElementById("pDeposit").value = "";

    document.getElementById("pRent").value = "";

    document.getElementById("pManagement").value = "";

    document.getElementById("pArea").value = "";

    document.getElementById("pFloor").value = "";

    document.getElementById("pRooms").value = "";

    document.getElementById("pParking").value = "";

    document.getElementById("pMove").value = "";

    document.getElementById("pPremium").value = "";

    document.getElementById("pDescription").value = "";

}


/* =========================================================
   상태 표시
========================================================= */

function setStatus(text){

    document.getElementById("status")
        .textContent = text;

}


/* =========================================================
   HTML 보안 처리
========================================================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   모달 바깥 클릭
========================================================= */

document
    .getElementById("modalBg")
    .addEventListener("click", function(event){

        if(event.target === this){

            closeModal();

        }

    });


</script>
