<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>현지공인중개사 매물지도</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        "Noto Sans KR",
        "Malgun Gothic",
        Arial,
        sans-serif;
    color: #202124;
    background: #f5f7fb;
}

button,
input,
select,
textarea {
    font-family: inherit;
}

button {
    cursor: pointer;
}

header {
    height: 72px;
    background: white;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    position: relative;
    z-index: 1000;
}

.logo {
    font-size: 24px;
    font-weight: 900;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
}

.logo span {
    color: #e51c23;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #555;
    font-size: 14px;
}

.phone {
    font-weight: 700;
    color: #333;
}

.login-btn,
.logout-btn {
    border: 0;
    border-radius: 10px;
    padding: 11px 16px;
    font-weight: 700;
}

.login-btn {
    background: #536dfe;
    color: white;
}

.logout-btn {
    background: #eef0f5;
    color: #333;
}

.main {
    display: flex;
    height: calc(100vh - 72px);
}

.map-area {
    flex: 1;
    position: relative;
    min-width: 0;
}

#map {
    width: 100%;
    height: 100%;
}

.top-search {
    position: absolute;
    top: 18px;
    left: 18px;
    z-index: 500;
    display: flex;
    gap: 8px;
}

.top-search input {
    width: 310px;
    height: 48px;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 0 16px;
    background: white;
    box-shadow: 0 4px 15px rgba(0,0,0,.12);
    font-size: 15px;
}

.search-btn {
    height: 48px;
    border: 0;
    background: #536dfe;
    color: white;
    border-radius: 12px;
    padding: 0 20px;
    font-weight: 800;
}

.side {
    width: 390px;
    background: white;
    border-left: 1px solid #ddd;
    overflow-y: auto;
    position: relative;
    z-index: 600;
}

.category {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 18px;
    border-bottom: 1px solid #eee;
}

.category button {
    background: white;
    border: 1px solid #d8dbe2;
    border-radius: 10px;
    padding: 10px 14px;
    font-weight: 700;
    font-size: 14px;
}

.category button.active {
    background: #536dfe;
    border-color: #536dfe;
    color: white;
}

.request-menu {
    margin: 14px 18px;
    width: calc(100% - 36px);
    border: 0;
    border-radius: 12px;
    padding: 14px;
    background: #fff3e0;
    color: #e65100;
    font-weight: 900;
    font-size: 15px;
}

.count-info {
    padding: 0 18px 15px;
    color: #666;
    font-size: 13px;
}

.property-list {
    padding: 0 14px 30px;
}

.property-card {
    border: 1px solid #e3e5ea;
    border-radius: 14px;
    margin-bottom: 12px;
    overflow: hidden;
    background: white;
    transition: .15s;
}

.property-card:hover {
    box-shadow: 0 4px 18px rgba(0,0,0,.10);
    transform: translateY(-1px);
}

.property-photo {
    width: 100%;
    height: 175px;
    object-fit: cover;
    background: #eee;
}

.no-photo {
    height: 175px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f0f1f5;
    color: #999;
    font-weight: 700;
}

.property-content {
    padding: 14px;
}

.badge {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 6px;
    background: #edf0ff;
    color: #4659d8;
    font-size: 12px;
    font-weight: 800;
}

.property-title {
    margin-top: 8px;
    font-size: 17px;
    font-weight: 900;
}

.property-address {
    margin-top: 6px;
    color: #666;
    font-size: 13px;
}

.price {
    margin-top: 10px;
    font-size: 15px;
    font-weight: 900;
}

.rights {
    color: #d84315;
    margin-left: 8px;
}

.detail-link {
    margin-top: 10px;
    display: inline-block;
    color: #536dfe;
    font-weight: 800;
    font-size: 13px;
}

.dong-label {
    background: white;
    border: 2px solid #536dfe;
    border-radius: 18px;
    padding: 8px 13px;
    box-shadow: 0 3px 12px rgba(0,0,0,.18);
    white-space: nowrap;
    font-weight: 900;
}

.dong-label strong {
    color: #536dfe;
    font-size: 17px;
    margin-right: 5px;
}

.modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 3000;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-bg.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 650px;
    max-height: 92vh;
    overflow-y: auto;
    background: white;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 15px 50px rgba(0,0,0,.3);
}

.modal h2 {
    margin-top: 0;
}

.close {
    float: right;
    border: 0;
    background: #eee;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 20px;
}

.form-group {
    margin-bottom: 13px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: 800;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    border: 1px solid #d7dbe3;
    border-radius: 9px;
    padding: 11px;
    font-size: 14px;
    outline: none;
}

.form-group textarea {
    min-height: 110px;
    resize: vertical;
}

.form-submit {
    width: 100%;
    border: 0;
    border-radius: 10px;
    padding: 14px;
    background: #536dfe;
    color: white;
    font-weight: 900;
    font-size: 15px;
}

.admin-panel {
    display: none;
    margin: 15px 18px;
    padding: 15px;
    background: #f5f6ff;
    border: 1px solid #dce1ff;
    border-radius: 13px;
}

.admin-panel.show {
    display: block;
}

.admin-title {
    font-weight: 900;
    margin-bottom: 10px;
}

.admin-btn {
    width: 100%;
    border: 0;
    border-radius: 9px;
    padding: 11px;
    margin-bottom: 8px;
    background: #536dfe;
    color: white;
    font-weight: 800;
}

.admin-btn.orange {
    background: #ff8a00;
}

.request-item {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    background: #fff;
}

.request-item img {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 8px;
    margin-top: 8px;
}

.delete-btn {
    border: 0;
    background: #ef5350;
    color: white;
    padding: 8px 11px;
    border-radius: 7px;
    font-weight: 800;
    margin-top: 8px;
}

.detail-photo {
    width: 100%;
    max-height: 350px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 15px;
}

.detail-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
}

.detail-table th,
.detail-table td {
    border-bottom: 1px solid #eee;
    padding: 10px 5px;
    text-align: left;
    font-size: 14px;
}

.detail-table th {
    width: 90px;
    color: #777;
}

.empty {
    text-align: center;
    padding: 50px 10px;
    color: #999;
}

@media(max-width: 900px) {

    header {
        padding: 0 12px;
    }

    .logo {
        font-size: 18px;
    }

    .phone {
        display: none;
    }

    .main {
        display: block;
        height: calc(100vh - 62px);
    }

    header {
        height: 62px;
    }

    .map-area {
        height: 55vh;
    }

    .side {
        width: 100%;
        height: 45vh;
        border-left: 0;
        border-top: 1px solid #ddd;
    }

    .top-search {
        left: 10px;
        right: 10px;
    }

    .top-search input {
        flex: 1;
        width: auto;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">
        <span>📍</span>
        현지공인중개사 매물지도
    </div>

    <div class="header-right">

        <div class="phone">
            041-414-1124&nbsp;&nbsp; | &nbsp;&nbsp;010-8279-3919
        </div>

        <div id="loginEmail"></div>

        <button class="login-btn" id="loginBtn">
            관리자 로그인
        </button>

        <button class="logout-btn" id="logoutBtn" style="display:none;">
            로그아웃
        </button>

    </div>
</header>


<div class="main">

    <div class="map-area">

        <div class="top-search">
            <input
                id="searchInput"
                type="text"
                placeholder="주소·동·매물명 검색"
            >
            <button class="search-btn" onclick="searchProperties()">
                검색
            </button>
        </div>

        <div id="map"></div>

    </div>


    <aside class="side">

        <div class="category">

            <button
                class="active"
                data-category="전체"
                onclick="changeCategory('전체', this)">
                전체
            </button>

            <button
                data-category="상가"
                onclick="changeCategory('상가', this)">
                상가
            </button>

            <button
                data-category="공장"
                onclick="changeCategory('공장', this)">
                공장
            </button>

            <button
                data-category="토지"
                onclick="changeCategory('토지', this)">
                토지
            </button>

            <button
                data-category="원·투룸"
                onclick="changeCategory('원·투룸', this)">
                원·투룸
            </button>

            <button
                data-category="주택"
                onclick="changeCategory('주택', this)">
                주택
            </button>

            <button
                data-category="아파트"
                onclick="changeCategory('아파트', this)">
                아파트
            </button>

        </div>


        <button
            class="request-menu"
            onclick="openRequestModal()">
            📩 내 매물 접수하기
        </button>


        <div
            class="admin-panel"
            id="adminPanel">

            <div class="admin-title">
                🔐 관리자 메뉴
            </div>

            <button
                class="admin-btn"
                onclick="openPropertyModal()">
                + 매물 등록
            </button>

            <button
                class="admin-btn orange"
                onclick="openRequestsModal()">
                📥 고객 매물접수 확인
            </button>

        </div>


        <div class="count-info" id="countInfo">
            매물 0개 · 동별 매물 수 표시
        </div>


        <div
            class="property-list"
            id="propertyList">
        </div>

    </aside>

</div>



<!-- 고객 매물 접수 -->

<div
    class="modal-bg"
    id="requestModal">

    <div class="modal">

        <button
            class="close"
            onclick="closeModal('requestModal')">
            ×
        </button>

        <h2>📩 내 매물 접수</h2>

        <p style="color:#777;font-size:13px;">
            아래 내용을 작성해 주시면 확인 후 연락드리겠습니다.
        </p>


        <div class="form-group">
            <label>이름 *</label>
            <input id="reqName" placeholder="성함">
        </div>


        <div class="form-group">
            <label>연락처 *</label>
            <input id="reqPhone" placeholder="010-0000-0000">
        </div>


        <div class="form-group">
            <label>매물 종류 *</label>

            <select id="reqCategory">

                <option value="상가">상가</option>
                <option value="공장">공장</option>
                <option value="토지">토지</option>
                <option value="원·투룸">원·투룸</option>
                <option value="주택">주택</option>
                <option value="아파트">아파트</option>

            </select>

        </div>


        <div class="form-group">
            <label>주소 *</label>
            <input
                id="reqAddress"
                placeholder="매물 주소">
        </div>


        <div class="form-group">
            <label>매물 제목</label>
            <input
                id="reqTitle"
                placeholder="예: 신부동 1층 코너 상가">
        </div>


        <div class="form-group">
            <label>보증금</label>
            <input
                id="reqDeposit"
                placeholder="만원">
        </div>


        <div class="form-group">
            <label>월세</label>
            <input
                id="reqRent"
                placeholder="만원">
        </div>


        <div class="form-group">
            <label>매매가</label>
            <input
                id="reqSale"
                placeholder="만원">
        </div>


        <div class="form-group">
            <label>권리금</label>
            <input
                id="reqRights"
                placeholder="만원">
        </div>


        <div class="form-group">
            <label>면적</label>
            <input
                id="reqArea"
                placeholder="㎡ 또는 평">
        </div>


        <div class="form-group">
            <label>층수</label>
            <input
                id="reqFloor"
                placeholder="예: 1층">
        </div>


        <div class="form-group">
            <label>매물 설명</label>

            <textarea
                id="reqDescription"
                placeholder="매물에 대한 내용을 적어주세요.">
            </textarea>

        </div>


        <div class="form-group">
            <label>사진 1장</label>

            <input
                id="reqPhoto"
                type="file"
                accept="image/*">

        </div>


        <button
            class="form-submit"
            onclick="submitRequest()">
            매물 접수하기
        </button>

    </div>

</div>



<!-- 관리자 매물 등록 -->

<div
    class="modal-bg"
    id="propertyModal">

    <div class="modal">

        <button
            class="close"
            onclick="closeModal('propertyModal')">
            ×
        </button>

        <h2>🏢 매물 등록</h2>


        <div class="form-group">
            <label>매물 제목 *</label>
            <input
                id="pTitle"
                placeholder="매물 제목">
        </div>


        <div class="form-group">
            <label>주소 *</label>
            <input
                id="pAddress"
                placeholder="예: 천안시 서북구 성정동 666-5">
        </div>


        <div class="form-group">
            <label>매물 종류 *</label>

            <select id="pCategory">

                <option value="상가">상가</option>
                <option value="공장">공장</option>
                <option value="토지">토지</option>
                <option value="원·투룸">원·투룸</option>
                <option value="주택">주택</option>
                <option value="아파트">아파트</option>

            </select>

        </div>


        <div class="form-group">
            <label>보증금 (만원)</label>
            <input id="pDeposit">
        </div>


        <div class="form-group">
            <label>월세 (만원)</label>
            <input id="pRent">
        </div>


        <div class="form-group">
            <label>매매가 (만원)</label>
            <input id="pSale">
        </div>


        <div class="form-group">
            <label>권리금 (만원)</label>
            <input id="pRights">
        </div>


        <div class="form-group">
            <label>면적</label>
            <input
                id="pArea"
                placeholder="예: 89.9㎡ / 27.2평">
        </div>


        <div class="form-group">
            <label>층</label>
            <input
                id="pFloor"
                placeholder="예: 1층">
        </div>


        <div class="form-group">
            <label>매물 설명</label>

            <textarea
                id="pDescription">
            </textarea>

        </div>


        <div class="form-group">
            <label>상세정보 연결 주소</label>

            <input
                id="pExternalUrl"
                placeholder="https://...">

            <small style="color:#888;">
                매물 클릭 후 상세정보를 볼 사이트 주소
            </small>

        </div>


        <div class="form-group">
            <label>대표사진 1장</label>

            <input
                id="pPhoto"
                type="file"
                accept="image/*">

        </div>


        <button
            class="form-submit"
            onclick="saveProperty()">
            매물 등록
        </button>

    </div>

</div>



<!-- 매물 상세 -->

<div
    class="modal-bg"
    id="detailModal">

    <div class="modal">

        <button
            class="close"
            onclick="closeModal('detailModal')">
            ×
        </button>

        <div id="detailContent"></div>

    </div>

</div>



<!-- 관리자 접수목록 -->

<div
    class="modal-bg"
    id="requestsModal">

        <button

        </button>

        <h2>📥 고객 매물접수</h2>

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,

} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    serverTimestamp,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey: "AIzaSyAC9YI78OLAKD4KJNJZTT6KRrhevG5GpVM",

    authDomain:
        "hyunji-8fc9c.firebaseapp.com",

    projectId:
        "hyunji-8fc9c",

    storageBucket:
        "hyunji-8fc9c.firebasestorage.app",

    messagingSenderId:
        "659657503337",

    appId:
        "1:659657503337:web:aa2e24ae4d37ed29d6a8f8",

    measurementId:
        "G-1LPMGC6317"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const provider = new GoogleAuthProvider();


const ADMIN_EMAIL =
    "khj0107776@gmail.com";


let currentUser = null;

let allProperties = [];

let currentCategory = "전체";

let markers = [];

let dongOverlays = [];

let map;


window.firebaseAuth = auth;



/* -------------------------------
   카카오 지도
-------------------------------- */

window.kakaoMapReady = function() {

    const container =
        document.getElementById("map");

    const options = {

        center:
            new kakao.maps.LatLng(
                36.8151,
                127.1139
            ),

        level: 8
    };

    map =
        new kakao.maps.Map(
            container,
            options
        );

    loadProperties();

};



/* -------------------------------
   로그인
-------------------------------- */

document
    .getElementById("loginBtn")
    .addEventListener("click", async () => {

        try {

            await signInWithPopup(
                auth,
                provider
            );

        } catch(error) {

            console.error(error);

            alert(
                "Google 로그인 중 오류가 발생했습니다.\n\n"
                + error.message
            );
        }

    });



document
    .getElementById("logoutBtn")
    .addEventListener("click", async () => {

        await signOut(auth);

    });



onAuthStateChanged(
    auth,
    user => {

        currentUser = user;

        const email =
            document.getElementById(
                "loginEmail"
            );

        const loginBtn =
            document.getElementById(
                "loginBtn"
            );

        const logoutBtn =
            document.getElementById(
                "logoutBtn"
            );

        const adminPanel =
            document.getElementById(
                "adminPanel"
            );


        if(user) {

            email.textContent =
                user.email || "";

            loginBtn.style.display =
                "none";

            logoutBtn.style.display =
                "block";


            if(
                user.email
                    .toLowerCase()
                ===
                ADMIN_EMAIL
                    .toLowerCase()
            ) {

                adminPanel.classList.add(
                    "show"
                );

            } else {

                adminPanel.classList.remove(
                    "show"
                );

            }

        } else {

            email.textContent = "";

            loginBtn.style.display =
                "block";

            logoutBtn.style.display =
                "none";

            adminPanel.classList.remove(
                "show"
            );

        }

    }
);



/* -------------------------------
   관리자 확인
-------------------------------- */

function checkAdmin() {

    if(!currentUser) {

        alert(

/* -------------------------------
   이미지 압축
-------------------------------- */

function compressImage(
    file
) {

    return new Promise(
        (resolve, reject) => {

            if(!file) {

                resolve("");

                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                event => {

                    const img =
                        new Image();


                    img.onload =
                        () => {

                            const maxSize =
                                1200;

                            let width =
                                img.width;

                            let height =
                                img.height;


                            if(
                                width >
                                    maxSize
                                ||
                                height >
                                    maxSize
                            ) {

                                if(
                                    width >
                                    height
                                ) {

                                    height =
                                        height
                                        *
                                        maxSize
                                        /
                                        width;

                                    width =
                                        maxSize;

                                } else {

                                    width =
                                        width
                                        *
                                        maxSize
                                        /
                                        height;

                                    height =
                                        maxSize;

                                }

                            }


                            const canvas =
                                document
                                .createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            let quality =
                                0.75;

                            let result =
                                canvas.toDataURL(
                                    "image/jpeg",
                                    quality
                                );


                            /*
                             Firestore 문서가 너무 커지지 않도록
                             최대한 압축
                            */

                            while(
                                result.length >
                                    700000
                                &&
                                quality >
                                    0.35
                            ) {

                                quality -=
                                    0.1;

                                result =
                                    canvas.toDataURL(
                                        "image/jpeg",
                                        quality
                                    );

                            }


                            if(
                                result.length >
                                    900000
                            ) {

                                reject(
                                    new Error(
                                        "사진 용량이 너무 큽니다."
                                    )
                                );

                                return;
                            }


                            resolve(result);

                        };


                    img.onerror =
                        reject;

                    img.src =
                        event.target.result;

                };


            reader.onerror =
                reject;

            reader.readAsDataURL(file);

        }
    );

}

function renderProperties() {

    let list =
        allProperties;


    if(
        currentCategory !==
        "전체"
    ) {

        list =
            list.filter(
                item =>
                    item.category
                    ===
                    currentCategory
            );

    }


    const keyword =
        document
        .getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    if(keyword) {

        list =
            list.filter(
                item => {

                    const text =
                        (
                            item.title
                            + " "
                            + item.address
                            + " "
                            + item.description
                        )
                        .toLowerCase();

                    return text.includes(
                        keyword
                    );

                }
            );

    }


    const listEl =
        document.getElementById(
            "propertyList"
        );


    listEl.innerHTML = "";


    if(list.length === 0) {

        listEl.innerHTML =
            `
            <div class="empty">

            </div>
            `;

    }


    list.forEach(
        property => {

            const card =
                document
                .createElement(
                    "div"
                );


            card.className =
                "property-card";


            card.onclick =
                () =>
                    showPropertyDetail(
                        property
                    );


            let photo =
                property.photo;


            const photoHtml =
                photo
                ?
                `
                <img
                    class="property-photo"
                    src="${photo}">
                `
                :
                `
                <div class="no-photo">
                    대표사진 없음
                </div>
                `;


            let price = "";


            if(
                property.deposit
                ||
                property.rent
            ) {

                price +=
                    `보증금 ${
                        property.deposit
                        || "-"
                    }만원`;

                price +=
                    ` / 월세 ${
                        property.rent
                        || "-"
                    }만원`;

            }


            if(property.sale) {

                price =
                    `매매 ${

            }


            const rights =
                property.rights
                ?
                `

            card.innerHTML =

                    <div class="property-title">

                    <div class="property-address">
                        ${escapeHtml(
                            property.address || ""
                        )}

                    <div class="price">
                        ${price}

                        <div class="detail-link">

            listEl.appendChild(

            );

    document
        .getElementById(
            "countInfo"

        `현재 ${list.length}개 매물 · 동별 매물 수 표시`;


    drawMap(list);

}



/* -------------------------------
   지도 표시
-------------------------------- */

async function drawMap(
    properties
) {

    if(!map) return;


    markers.forEach(
        marker =>
            marker.setMap(null)
    );


    dongOverlays.forEach(
        overlay =>
            overlay.setMap(null)
    );


    markers = [];

    dongOverlays = [];


    const geocoder =
        new kakao.maps.services.Geocoder();


    const dongGroups = {};


    for(
        const property of properties
    ) {

        if(!property.address)
            continue;


        await new Promise(
            resolve => {

                geocoder.addressSearch(
                    property.address,
                    (
                        result,
                        status
                    ) => {

                        if(
                            status
                            ===
                            kakao.maps.services.Status.OK
                        ) {

                            const lat =
                                parseFloat(
                                    result[0].y
                                );

                            const lng =
                                parseFloat(
                                    result[0].x
                                );


                            const position =
                                new kakao.maps.LatLng(
                                    lat,
                                    lng
                                );


                            const marker =
                                new kakao.maps.Marker({

                                    map: map,

                                    position:
                                        position

                                });


                            marker.setZIndex(
                                10
                            );


                            kakao.maps.event.addListener(
                                marker,
                                "click",
                                () => {

                                    showPropertyDetail(
                                        property
                                    );

                                }
                            );


                            markers.push(
                                marker
                            );


                            /*
                             행정동 이름
                            */

                            const callback =
                                (
                                    regionResult,
                                    regionStatus
                                ) => {

                                    if(
                                        regionStatus
                                        ===
                                        kakao.maps.services.Status.OK
                                    ) {

                                        let dong =
                                            "기타";


                                        for(
                                            const region
                                            of regionResult
                                        ) {

                                            if(
                                                region.region_type
                                                ===
                                                "H"
                                            ) {

                                                dong =
                                                    region.region_3depth_name;

                                                break;

                                            }

                                        }


                                        if(
                                            !dongGroups[dong]
                                        ) {

                                            dongGroups[dong] =
                                                {
                                                    count: 0,
                                                    lat: 0,
                                                    lng: 0
                                                };

                                        }


                                        dongGroups[dong].count++;

                                        dongGroups[dong].lat +=
                                            lat;

                                        dongGroups[dong].lng +=
                                            lng;

                                    }

                                };


                            geocoder.coord2RegionCode(
                                lng,
                                lat,
                                callback
                            );

                        }


                        resolve();

                    }
                );

            }
        );

    }


    /*
     동별 숫자 표시
    */

    Object
        .entries(
            dongGroups
        )
        .forEach(
            ([
                dong,
                info
            ]) => {

                const avgLat =
                    info.lat
                    /
                    info.count;

                const avgLng =
                    info.lng
                    /
                    info.count;


                const position =
                    new kakao.maps.LatLng(
                        avgLat,
                        avgLng
                    );


                const content =
                    `
                    <div class="dong-label">
                        <strong>
                            ${info.count}
                        </strong>
                        ${dong}
                    </div>
                    `;


                const overlay =
                    new kakao.maps.CustomOverlay({

                        map: map,

                        position:
                            position,

                        content:
                            content,

                        yAnchor:
                            1.4

                    });


                dongOverlays.push(
                    overlay
                );

            }
        );

}

/* -------------------------------
   보안용 문자열 처리
-------------------------------- */

function escapeHtml(
    value
) {

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}



function safeUrl(
    url
) {

    try {

        const parsed =
            new URL(
                url
            );


        if(
            parsed.protocol
            ===
            "https:"
            ||
            parsed.protocol
            ===
            "http:"
        ) {

            return parsed.href;

        }

    } catch(e) {}


    return "#";

}
