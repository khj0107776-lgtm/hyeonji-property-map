<style>
:root{
  --green:#168a55;
  --green2:#eaf7f0;

  --muted:#78827c;
  --line:#e6ebe8;
  --bg:#f6f8f7;

*{box-sizing:border-box}
html,body{
  margin:0;
  height:100%;
  font-family:Arial,"Noto Sans KR","Malgun Gothic",sans-serif;

button,input,select,textarea{font:inherit}

.top{
  height:68px;

  align-items:center;
  gap:22px;
  padding:0 20px;
  position:relative;
  z-index:20
}

.brand{

  font-weight:900;
  white-space:nowrap
}

.brand b{color:var(--green)}

.nav{
  display:flex;
  gap:7px;
  align-items:center
}

.nav button{
  border:0;
  background:transparent;
  padding:9px 12px;
  color:#4e5953;
  border-radius:9px
}

.nav button:hover{
  background:var(--green2);
  color:var(--green)
}

.top-right{
  margin-left:auto;
  display:flex;
  gap:8px;
  align-items:center
}

.pill{
  border:1px solid var(--line);
  background:#fff;
  border-radius:999px;
  padding:8px 12px;
  color:#66716b;
  font-size:13px
}

.btn{
  border:1px solid #d9e0dc;
  background:#fff;
  border-radius:9px;
  padding:9px 13px
}

.btn.green{
  background:var(--green);
  border-color:var(--green);
  color:#fff
}

.btn.red{
  color:var(--red);
  border-color:#f0b7b3
}

.filters{
  height:62px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  gap:8px;
  align-items:center;
  padding:8px 14px;
  position:relative;
  z-index:15
}

.search{
  height:43px;
  width:310px;
  border:1px solid #dce2df;
  border-radius:10px;
  padding:0 13px;
  outline:0
}

.search:focus{

.sel{

.workspace{

}

.map{

.map-tip{

.map-tools{

function money(value){

  if(
    value === undefined ||
    value === null ||
    value === ""
  ){
    return "-";
  }

  return Number(value)
    .toLocaleString()
    + "만";
}


function toast(message){

  $("toast").textContent =
    message;

  $("toast").style.display =
    "block";

  setTimeout(
    () =>
      $("toast").style.display =
        "none",
    2500
  );

}


window.closeModal =
function(id){

  $(id)
    .classList
    .remove("show");

};


function initMap(){

  kakao.maps.load(
    () => {

      map =
        new kakao.maps.Map(
          $("map"),
          {

            center:
              new kakao.maps.LatLng(
                36.8151,
                127.1139
              ),

            level:8

          }
        );


      geocoder =
        new kakao.maps.services.Geocoder();


      loadProperties();

    }
  );

}


async function loadProperties(){

  try{

    const snapshot =
      await getDocs(
        collection(
          db,
          "properties"
        )
      );


    all =
      snapshot.docs.map(
        item => ({

          id:
            item.id,

          ...item.data()

        })
      );


    shown =
      [...all];


    renderList();

    drawDongCounts();


  }catch(error){

    console.error(error);

    toast(
      "매물을 불러오지 못했습니다."
    );

  }

}


function getDong(property){

  if(property.dong)
    return property.dong;


  const match =
    (property.address || "")
    .match(
      /([가-힣]+동|[가-힣]+읍|[가-힣]+면)/
    );


  return match
    ? match[1]
    : "기타";

}


function applyFilters(){

  const keyword =
    $("search")
    .value
    .trim()
    .toLowerCase();


  const deal =
    $("dealFilter")
    .value;


  const category =
    $("categoryFilter")
    .value;


  const premium =
    $("premiumFilter")
    .value;


  shown =
    all.filter(
      property => {

        const text =
          [

            property.title,
            property.address,
            getDong(property),
            property.category

          ]
          .join(" ")
          .toLowerCase();


        if(
          keyword &&
          !text.includes(keyword)
        )
          return false;


        if(
          deal &&
          property.dealType !== deal
        )
          return false;


        if(
          category &&
          property.category !== category
        )
          return false;


        const hasPremium =
          Number(
            property.premium || 0
          ) > 0;


        if(
          premium === "yes" &&
          !hasPremium
        )
          return false;


        if(
          premium === "no" &&
          hasPremium
        )
          return false;


        return true;

      }
    );


  renderList();

  drawDongCounts();

}

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /[&<>"']/g,
    char =>
      ({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      })[char]
  );

}


window.openUrl =
function(encoded){

  let url =
    decodeURIComponent(
      encoded
    );


  if(
    !/^https?:\/\//i.test(
      url
    )
  ){

    url =
      "https://" +
      url;

  }


  window.open(
    url,
    "_blank",
    "noopener"
  );

};

function clearOverlays(){

  overlays.forEach(
    overlay =>
      overlay.setMap(null)
  );

  overlays=[];

}


function drawDongCounts(){

  if(!map)
    return;


  clearOverlays();


  const groups={};


  shown.forEach(
    property => {

      if(
        !Number.isFinite(
          Number(property.lat)
        )
        ||
        !Number.isFinite(
          Number(property.lng)
        )
      )
        return;


      const dong =
        getDong(property);


      if(!groups[dong])
        groups[dong]=[];


      groups[dong]
        .push(property);

    }
  );


  Object.entries(
    groups
  )
  .forEach(
    ([dong,items]) => {

      const lat =
        items.reduce(
          (sum,item) =>
            sum +
            Number(item.lat),
          0
        )
        /
        items.length;


      const lng =
        items.reduce(
          (sum,item) =>
            sum +
            Number(item.lng),
          0
        )
        /
        items.length;


      const element =
        document.createElement(
          "div"
        );


      element.className =
        "dong-badge";


      element.innerHTML = `

        <div>

          <div class="n">
            ${items.length}
          </div>

          <div class="t">
            ${escapeHtml(dong)}
          </div>

        </div>

      `;


      element.onclick =
        () => {

          shown =
            all.filter(
              property =>
                getDong(property)
                ===
                dong
            );


          $("listTitle")
            .textContent =
              dong +
              " 매물";


          renderList();


          map.setCenter(
            new kakao.maps.LatLng(
              lat,
              lng
            )
          );


          map.setLevel(6);

        };


      const overlay =
        new kakao.maps.CustomOverlay({

          position:
            new kakao.maps.LatLng(
              lat,
              lng
            ),

          content:
            element,

          xAnchor:.5,

          yAnchor:.5,

          zIndex:10

        });


      overlay.setMap(
        map
      );


      overlays.push(
        overlay
      );

    }
  );

}


function addressSearch(address){

  return new Promise(
    (resolve,reject) => {

      geocoder.addressSearch(
        address,
        (result,status) => {

          if(
            status ===
            kakao.maps.services.Status.OK
          ){

            const r =
              result[0];


            resolve({

              lat:
                Number(r.y),

              lng:
                Number(r.x),

              dong:
                r.address
                ?.region_3depth_name
                ||
                ""

            });

          }else{

            reject(
              new Error(
                "주소를 찾지 못했습니다."
              )
            );

          }

        }
      );

    }
  );

}


function compressImage(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload =
        event => {

          const img =
            new Image();


          img.onload =
            () => {

              const max =
                900;


              let width =
                img.width;

              let height =
                img.height;


              if(width > max){

                height =
                  height *
                  max /
                  width;

                width =
                  max;

              }


              if(height > max){

                width =
                  width *
                  max /
                  height;

                height =
                  max;

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                Math.round(width);

              canvas.height =
                Math.round(height);


              const context =
                canvas.getContext(
                  "2d"
                );


              context.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  .62
                )
              );

            };


          img.onerror =
            reject;


          img.src =
            event.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}

$("saveBtn")
.onclick =
  async () => {

    const user =
      auth.currentUser;


    if(
      !user ||
      user.email !==
      ADMIN_EMAIL
    ){

      toast(
        "관리자만 등록할 수 있습니다."
      );

      return;

    }


    const title =
      $("fTitle")
      .value
      .trim();


    const address =
      $("fAddress")
      .value
      .trim();


    if(!title || !address){

      toast(
        "제목과 주소는 필수입니다."
      );

      return;

    }


    $("saveBtn").disabled =
      true;


    try{

      const location =
        await addressSearch(
          address
        );


      await addDoc(
        collection(
          db,
          "properties"
        ),
        {

          title,

          address,

          dong:
            location.dong,

          lat:
            location.lat,

          lng:
            location.lng,

          dealType:
            $("fDeal").value,

          category:
            $("fCategory").value,

          deposit:
            $("fDeposit").value,

          rent:
            $("fRent").value,

          management:
            $("fManagement").value,

          premium:
            $("fPremium").value,

          area:
            $("fArea").value,

          floor:
            $("fFloor").value,

          externalUrl:
            $("fUrl").value.trim(),

          description:
            $("fDesc").value,

          photo:
            photoData || "",

          createdBy:
            user.email,

          createdAt:
            serverTimestamp()

        }
      );


      [
        "fTitle",
        "fAddress",
        "fDeposit",
        "fRent",
        "fManagement",
        "fPremium",
        "fArea",
        "fFloor",
        "fUrl",
        "fDesc"
      ]
      .forEach(
        id =>
          $(id).value=""
      );


      closeModal(
        "addModal"
      );


      toast(
        "매물이 등록되었습니다."
      );


      await loadProperties();


    }catch(error){

      console.error(error);

      toast(
        "등록 오류: " +
        error.message
      );

    }finally{

      $("saveBtn")
        .disabled =
        false;

    }

  };
