<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>현지공인중개사 매물지도</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:
        "Noto Sans KR",
        Arial,
        sans-serif;
    color:#202124;
    background:#f7f8fa;
}

button,
input,
select,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.header{
    height:78px;
    background:#fff;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    position:relative;
    z-index:1000;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo-pin{
    font-size:27px;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:-1.5px;
}

.contact{
    display:flex;
    align-items:center;
    gap:18px;
    font-weight:700;
    color:#555;
}

.contact span{
    white-space:nowrap;
}

.login-btn{
    border:0;
    background:#4f63dc;
    color:#fff;
    padding:13px 19px;
    border-radius:12px;
    font-size:15px;
    font-weight:800;
}

.logout-btn{
    border:0;
    background:#ef4444;
    color:#fff;
    padding:11px 16px;
    border-radius:10px;
    font-weight:700;
}

.app{
    height:calc(100vh - 78px);
    display:flex;
    position:relative;
    overflow:hidden;
}

.map-area{
    flex:1;
    position:relative;
    min-width:0;
}

#map{
    width:100%;
    height:100%;
}

.search-box{
    position:absolute;
    top:18px;
    left:18px;
    z-index:10;
    display:flex;
    width:min(520px,calc(100% - 36px));
    box-shadow:0 5px 18px rgba(0,0,0,.14);
}

.search-box input{
    flex:1;
    height:54px;
    border:0;
    outline:0;
    padding:0 18px;
    font-size:16px;
    background:#fff;
    border-radius:13px 0 0 13px;
}

.search-box button{
    width:78px;
    border:0;
    background:#5369df;
    color:#fff;
    font-size:16px;
    font-weight:800;
    border-radius:0 13px 13px 0;
}

.map-count{
    position:absolute;
    top:85px;
    left:18px;
    z-index:10;
    background:#fff;
    border-radius:11px;
    padding:10px 14px;
    font-size:13px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
    color:#555;
}

.side{
    width:390px;
    height:100%;
    background:#fff;
    border-left:1px solid #e1e4e8;
    overflow-y:auto;
    position:relative;
    z-index:20;
}

.category{
    padding:16px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    border-bottom:1px solid #eee;
    background:#fff;
}

.category button{
    border:1px solid #dfe2e6;
    background:#fff;
    border-radius:10px;
    padding:10px 14px;
    font-size:14px;
    font-weight:700;
    color:#333;
}

.category button.active{
    background:#5369df;
    color:#fff;
    border-color:#5369df;
}

.admin-entry{
    margin:12px 16px;
    width:calc(100% - 32px);
    border:0;
    background:#111827;
    color:#fff;
    padding:13px;
    border-radius:11px;
    font-weight:800;
    font-size:14px;
}

.request-entry{
    margin:0 16px 12px;
    width:calc(100% - 32px);
    border:0;
    background:#fff3df;
    color:#a45b00;
    padding:13px;
    border-radius:11px;
    font-weight:800;
    font-size:14px;
}

.list-header{
    padding:15px 16px;
    color:#687080;
    font-size:13px;
    border-bottom:1px solid #eee;
}

.property-list{
    padding:12px;
}

.property-card{
    border:1px solid #e4e6eb;
    border-radius:15px;
    overflow:hidden;
    background:#fff;
    margin-bottom:12px;
    cursor:pointer;
    transition:.15s;
}

.property-card:hover{
    transform:translateY(-1px);
    box-shadow:0 5px 18px rgba(0,0,0,.09);
}

.property-photo{
    width:100%;
    height:180px;
    display:block;
    object-fit:cover;
    background:#f0f1f3;
}

.no-photo{
    height:180px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f0f1f3;
    color:#9ca3af;
    font-size:14px;
}

.property-body{
    padding:15px;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:7px;
    background:#eef1ff;
    color:#5369df;
    font-size:12px;
    font-weight:800;
}

.property-title{
    margin-top:8px;
    font-size:17px;
    font-weight:900;
    line-height:1.4;
}

.property-address{
    margin-top:6px;
    color:#737985;
    font-size:13px;
}

.property-dong{
    margin-top:6px;
    color:#5369df;
    font-weight:800;
    font-size:12px;
}

.price{
    margin-top:12px;
    font-size:16px;
    font-weight:900;
}

.rights{
    color:#d4512d;
    margin-left:10px;
}

.detail-link{
    margin-top:10px;
    color:#5369df;
    font-weight:800;
    font-size:13px;
}

.admin-panel{
    display:none;
    position:fixed;
    z-index:5000;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.55);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.admin-panel.show{
    display:flex;
}

.admin-box{
    width:min(700px,100%);
    max-height:92vh;
    overflow-y:auto;
    background:#fff;
    border-radius:20px;
    padding:25px;
}

.panel-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.panel-head h2{
    margin:0;
    font-size:22px;
}

.close{
    border:0;
    background:#f0f1f3;
    width:38px;
    height:38px;
    border-radius:50%;
    font-size:20px;
}

.form-group{
    margin-bottom:13px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-size:13px;
    font-weight:800;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    border:1px solid #d9dce2;
    border-radius:10px;
    padding:12px;
    font-size:14px;
    outline:0;
}

.form-group textarea{
    min-height:110px;
    resize:vertical;
}

.two{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.photo-preview{
    width:100%;
    max-height:280px;
    object-fit:cover;
    border-radius:12px;
    display:none;
    margin-top:10px;
}

.primary{
    width:100%;
    border:0;
    background:#5369df;
    color:#fff;
    padding:14px;
    border-radius:11px;
    font-size:15px;
    font-weight:900;
    margin-top:5px;
}

.secondary{
    width:100%;
    border:1px solid #ddd;
    background:#fff;
    color:#333;
    padding:13px;
    border-radius:11px;
    font-weight:800;
    margin-top:8px;
}

.admin-status{
    background:#f4f6ff;
    border-radius:11px;
    padding:12px;
    margin-bottom:16px;
    font-size:13px;
}

.admin-list{
    margin-top:25px;
}

.admin-property{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid #eee;
}

.admin-property-info{
    min-width:0;
}

.admin-property-title{
    font-weight:800;
}

.admin-property-address{
    color:#777;
    font-size:12px;
    margin-top:3px;
}

.delete-btn{
    flex-shrink:0;
    border:0;
    background:#ef4444;
    color:#fff;
    padding:8px 11px;
    border-radius:8px;
    font-weight:800;
}

.request-list{
    margin-top:20px;
}

.request-card{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:14px;
    margin-bottom:10px;
}

.request-card strong{
    display:block;
    margin-bottom:6px;
}

.request-card div{
    font-size:13px;
    margin-top:4px;
    color:#555;
}

.dong-label{
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px 12px;
    border-radius:22px;
    background:#fff;
    border:1px solid #dfe3e8;
    box-shadow:0 3px 10px rgba(0,0,0,.18);
    font-size:13px;
    font-weight:800;
    white-space:nowrap;
}

.dong-label strong{
    min-width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#4e9966;
    color:#fff;
    font-size:13px;
}

.detail-modal{
    display:none;
    position:fixed;
    z-index:6000;
    inset:0;
    background:rgba(0,0,0,.6);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.detail-modal.show{
    display:flex;
}

.detail-box{
    width:min(600px,100%);
    max-height:90vh;
    overflow-y:auto;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
}

.detail-image{
    width:100%;
    max-height:360px;
    object-fit:cover;
    display:block;
}

.detail-content{
    padding:22px;
}

.detail-content h2{
    margin:9px 0;
}

.detail-row{
    display:flex;
    padding:9px 0;
    border-bottom:1px solid #eee;
}

.detail-row span:first-child{
    width:90px;
    color:#777;
    font-size:13px;
}

.detail-description{
    white-space:pre-wrap;
    line-height:1.7;
    margin-top:15px;
    color:#444;
}

.external-btn{
    display:block;
    width:100%;
    margin-top:16px;
    padding:14px;
    text-align:center;
    background:#5369df;
    color:#fff;
    text-decoration:none;
    border-radius:10px;
    font-weight:900;
}

.phone-btn{
    display:block;
    width:100%;
    margin-top:9px;
    padding:13px;
    text-align:center;
    background:#111827;
    color:#fff;
    text-decoration:none;
    border-radius:10px;
    font-weight:900;
}

.empty{
    text-align:center;
    padding:60px 20px;
    color:#8a919d;
}

.loading{
    position:fixed;
    z-index:10000;
    inset:0;
    background:rgba(255,255,255,.85);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
}

.hidden{
    display:none !important;
}

@media(max-width:850px){

    .header{
        height:65px;
        padding:0 13px;
    }

    .logo{
        font-size:18px;
    }

    .logo-pin{
        font-size:20px;
    }

    .contact{
        gap:7px;
        font-size:11px;
    }

    .contact span:nth-child(1){
        display:none;
    }

    .login-btn{
        padding:9px 10px;
        font-size:12px;
    }

    .app{
        height:calc(100vh - 65px);
        flex-direction:column;
    }

    .map-area{
        height:55%;
        flex:none;
    }

    .side{
        width:100%;
        height:45%;
        border-left:0;
        border-top:1px solid #ddd;
    }

    .search-box{
        top:10px;
        left:10px;
        width:calc(100% - 20px);
    }

    .map-count{
        top:72px;
        left:10px;
    }

    .two{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div id="loading" class="loading">
    매물지도를 불러오는 중입니다...
</div>

<header class="header">

    <div class="logo-area">
        <div class="logo-pin">📍</div>
        <div class="logo">현지공인중개사 매물지도</div>
    </div>

    <div class="contact">

        <span>041-414-1124</span>
        <span>010-8279-3919</span>

        <span id="loginUser"></span>

        <button
            id="loginBtn"
            class="login-btn"
        >
            Google 로그인
        </button>

        <button
            id="logoutBtn"
            class="logout-btn hidden"
        >
            로그아웃
        </button>

    </div>

</header>


<div class="app">

    <main class="map-area">

        <div class="search-box">

            <input
                id="searchInput"
                type="text"
                placeholder="주소·동·매물명 검색"
            >

            <button id="searchBtn">
                검색
            </button>

        </div>

        <div
            id="mapCount"
            class="map-count"
        >
            매물을 불러오는 중...
        </div>

        <div id="map"></div>

    </main>


    <aside class="side">

        <div class="category">

            <button
                class="active"
                data-category="전체"
            >
                전체
            </button>

            <button data-category="상가">
                상가
            </button>

            <button data-category="공장">
                공장
            </button>

            <button data-category="토지">
                토지
            </button>

            <button data-category="원·투룸">
                원·투룸
            </button>

            <button data-category="주택">
                주택
            </button>

            <button data-category="아파트">
                아파트
            </button>

        </div>


        <button
            id="requestBtn"
            class="request-entry"
        >
            📝 매물접수
        </button>


        <button
            id="adminBtn"
            class="admin-entry hidden"
        >
            🔐 관리자 매물관리
        </button>


        <div
            id="listHeader"
            class="list-header"
        >
            현재 매물을 불러오는 중입니다.
        </div>


        <div
            id="propertyList"
            class="property-list"
        ></div>

    </aside>

</div>



<!-- =========================
     관리자 패널
========================= -->

<div
    id="adminPanel"
    class="admin-panel"
>

    <div class="admin-box">

        <div class="panel-head">

            <h2>🔐 관리자 매물관리</h2>

            <button
                class="close"
                onclick="closeAdminPanel()"
            >
                ×
            </button>

        </div>


        <div
            id="adminStatus"
            class="admin-status"
        ></div>


        <h3>매물 등록</h3>


        <div class="form-group">

            <label>매물 제목</label>

            <input
                id="pTitle"
                placeholder="예: 두정동 메인도로 1층 상가"
            >

        </div>


        <div class="form-group">

            <label>주소</label>

            <input
                id="pAddress"
                placeholder="예: 충남 천안시 서북구 두정동 999-7"
            >

        </div>


        <div class="form-group">

            <label>매물 종류</label>

            <select id="pCategory">

                <option value="상가">
                    상가
                </option>

                <option value="공장">
                    공장
                </option>

                <option value="토지">
                    토지
                </option>

                <option value="원·투룸">
                    원·투룸
                </option>

                <option value="주택">
                    주택
                </option>

                <option value="아파트">
                    아파트
                </option>

            </select>

        </div>


        <div class="two">

            <div class="form-group">

                <label>보증금 (만원)</label>

                <input
                    id="pDeposit"
                    type="number"
                    placeholder="3000"
                >

            </div>


            <div class="form-group">

                <label>월세 (만원)</label>

                <input
                    id="pRent"
                    type="number"
                    placeholder="250"
                >

            </div>

        </div>


        <div class="two">

            <div class="form-group">

                <label>매매가 (만원)</label>

                <input
                    id="pSale"
                    type="number"
                    placeholder="매매일 경우 입력"
                >

            </div>


            <div class="form-group">

                <label>권리금 (만원)</label>

                <input
                    id="pRights"
                    type="number"
                    placeholder="없으면 비워두기"
                >

            </div>

        </div>


        <div class="two">

            <div class="form-group">

                <label>면적</label>

                <input
                    id="pArea"
                    placeholder="58.23㎡ / 17.6평"
                >

            </div>


            <div class="form-group">

                <label>층</label>

                <input
                    id="pFloor"
                    placeholder="1층"
                >

            </div>

        </div>


        <div class="form-group">

            <label>
                상세정보 연결 주소
            </label>

            <input
                id="pExternalUrl"
                type="url"
                placeholder="https://..."
            >

        </div>


        <div class="form-group">

            <label>
                매물 설명
            </label>

            <textarea
                id="pDescription"
                placeholder="매물 특징과 상세 내용을 입력하세요."
            ></textarea>

        </div>


        <div class="form-group">

            <label>
                대표사진 1장
            </label>

            <input
                id="pPhoto"
                type="file"
                accept="image/*"
            >

            <img
                id="photoPreview"
                class="photo-preview"
            >

        </div>


        <button
            id="savePropertyBtn"
            class="primary"
        >
            매물 등록하기
        </button>


        <div class="admin-list">

            <h3>
                등록 매물 관리
            </h3>

            <div id="adminPropertyList"></div>

        </div>


        <div class="request-list">

            <h3>
                고객 매물접수
            </h3>

            <div id="requestList"></div>

        </div>

    </div>

</div>



<!-- =========================
     고객 매물접수
========================= -->

<div
    id="requestPanel"
    class="admin-panel"
>

    <div class="admin-box">

        <div class="panel-head">

            <h2>📝 매물 접수</h2>

            <button
                class="close"
                onclick="closeRequestPanel()"
            >
                ×
            </button>

        </div>


        <div class="admin-status">

            매물 등록을 원하시면 아래 내용을
            작성해 주세요.<br>
            접수된 내용은 관리자만 확인합니다.

        </div>


        <div class="form-group">

            <label>성함</label>

            <input
                id="rName"
                placeholder="성함을 입력하세요"
            >

        </div>


        <div class="form-group">

            <label>연락처</label>

            <input
                id="rPhone"
                placeholder="010-0000-0000"
            >

        </div>


        <div class="form-group">

            <label>매물 종류</label>

            <select id="rCategory">

                <option value="상가">
                    상가
                </option>

                <option value="공장">
                    공장
                </option>

                <option value="토지">
                    토지
                </option>

                <option value="원·투룸">
                    원·투룸
                </option>

                <option value="주택">
                    주택
                </option>

                <option value="아파트">
                    아파트
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>주소</label>

            <input
                id="rAddress"
                placeholder="매물 주소"
            >

        </div>


        <div class="form-group">

            <label>
                매물에 대해 알려주세요
            </label>

            <textarea
                id="rDescription"
                placeholder="희망 가격, 면적, 층수, 특징 등을 자유롭게 작성해주세요."
            ></textarea>

        </div>


        <button
            id="submitRequestBtn"
            class="primary"
        >
            매물 접수하기
        </button>

    </div>

</div>



<!-- =========================
     상세정보
========================= -->

<div
    id="detailModal"
    class="detail-modal"
>

    <div class="detail-box">

        <img
            id="detailImage"
            class="detail-image"
        >

        <div
            id="detailNoImage"
            class="no-photo"
        >
            대표사진 없음
        </div>

        <div class="detail-content">

            <span
                id="detailCategory"
                class="badge"
            ></span>

            <h2 id="detailTitle"></h2>

            <div
                id="detailRows"

/* =====================================================
   주소 → 좌표 → 동
===================================================== */

async function resolvePropertyLocations(){

    if(
        !geocoder
    ){

        return;

    }


    await Promise.all(

        allProperties.map(
            async property => {

                if(
                    !property.address
                ){

                    return;

                }


                const text =
                    String(
                        property.address
                    );


                /*
                 이미 동 이름이 주소에 있으면
                 API 호출을 줄임
                */

                const dongMatch =
                    text.match(
                        /([가-힣0-9]+동)/
                    );


                if(
                    dongMatch
                ){

                    property._dong =
                        dongMatch[1];

                }


                return new Promise(
                    resolve => {

                        geocoder.addressSearch(
                            text,
                            (result,status) => {

                                if(
                                    status ===
                                    kakao.maps.services.Status.OK
                                ){

                                    property._lat =
                                        parseFloat(
                                            result[0].y
                                        );

                                    property._lng =
                                        parseFloat(
                                            result[0].x
                                        );


                                    /*
                                     주소 검색 결과에서
                                     동 이름 확인
                                    */

                                    const foundDong =
                                        result[0]
                                        .address
                                        ?.region_3depth_name;


                                    if(
                                        foundDong
                                    ){

                                        property._dong =
                                            foundDong;

                                    }


                                }


                                resolve();

                            }
                        );

                    }
                );

            }
        )

    );

}


/* =====================================================

===================================================== */

function normalize(text){

    return String(
        text || ""
    )
    .toLowerCase()
    .replace(
        /\s+/g,
        ""
    )
    .trim();

}


/* =====================================================
   매물 필터
===================================================== */

function getFilteredProperties(){

    let list =
        [...allProperties];


    if(
        currentCategory !==
        "전체"
    ){

        list =
            list.filter(
                property =>
                    property.category
                    ===
                    currentCategory
            );

    }


    const keyword =
        normalize(
            document
            .getElementById(
                "searchInput"
            )
            .value
        );


    if(keyword){

        list =
            list.filter(
                property => {

                    const text = [

                        property.title,

                        property.address,

                        property.category,

                        property.description,

                        property._dong,

                        property.area,

                        property.floor

                    ]
                    .filter(Boolean)
                    .join(" ");


                    return normalize(
                        text
                    ).includes(
                        keyword
                    );

                }
            );

    }


    return list;

}


/* =====================================================

===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

/* =====================================================
   지도 표시
===================================================== */

function drawMap(
    properties
){

    if(
        !map
    ){

        return;

    }


    markers.forEach(
        marker => {

            marker.setMap(
                null
            );

        }
    );


    dongOverlays.forEach(
        overlay => {

            overlay.setMap(
                null
            );

        }
    );


    markers = [];

    dongOverlays = [];


    const dongGroups = {};


    properties.forEach(
        property => {

            if(
                typeof property._lat
                !==
                "number"
                ||
                typeof property._lng
                !==
                "number"
            ){

                return;

            }


            const position =
                new kakao.maps.LatLng(
                    property._lat,
                    property._lng
                );


            const marker =
                new kakao.maps.Marker({

                    map:
                        map,

                    position:
                        position

                });


            kakao.maps.event.addListener(
                marker,
                "click",
                () => {

                    showPropertyDetail(
                        property
                    );

                }
            );


            markers.push(
                marker
            );


            const dong =
                property._dong
                ||
                "기타";


            if(
                !dongGroups[dong]
            ){

                dongGroups[dong] = {

                    count:0,

                    lat:0,

                    lng:0

                };

            }


            dongGroups[dong].count++;

            dongGroups[dong].lat +=
                property._lat;

            dongGroups[dong].lng +=
                property._lng;

        }
    );


    /*
     동별 숫자
    */

    Object.entries(
        dongGroups
    ).forEach(
        ([dong,info]) => {

            const lat =
                info.lat /
                info.count;

            const lng =
                info.lng /
                info.count;


            const position =
                new kakao.maps.LatLng(
                    lat,
                    lng
                );


            const content = `

                <div
                    class="dong-label"
                    title="${escapeHtml(
                        dong
                    )} 매물 ${info.count}개"
                >

                    <strong>
                        ${info.count}
                    </strong>

                    ${escapeHtml(
                        dong
                    )}

                </div>

            `;


            const overlay =
                new kakao.maps.CustomOverlay({

                    map:
                        map,

                    position:
                        position,

                    content:
                        content,

                    yAnchor:
                        1.4

                });


            dongOverlays.push(
                overlay
            );

        }
    );

}

/* =====================================================
   대표사진 압축
===================================================== */

function compressImage(
    file
){

    return new Promise(
        (resolve,reject) => {

            const reader =
                new FileReader();


            reader.onload =
                event => {

                    const img =
                        new Image();


                    img.onload =
                        () => {

                            const maxWidth =
                                1000;


                            let width =
                                img.width;

                            let height =
                                img.height;


                            if(
                                width >
                                maxWidth
                            ){

                                height =
                                    height *
                                    maxWidth /
                                    width;

                                width =
                                    maxWidth;

                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            const result =
                                canvas.toDataURL(
                                    "image/jpeg",
                                    .72
                                );


                            resolve(
                                result
                            );

                        };


                    img.onerror =
                        reject;


                    img.src =
                        event.target.result;

                };


            reader.onerror =
                reject;


            reader.readAsDataURL(
                file
            );

        }
    );

}

        id => {

            document
            .getElementById(
                id
            )
            .value =
                "";

        }
    );


    document
    .getElementById(
        "pPhoto"
    )
    .value =
        "";


    const preview =
        document
        .getElementById(
            "photoPreview"
        );


    preview.src =
        "";

    preview.style.display =

    delete preview.dataset.photo;

}


/* =====================================================
   관리자 매물 목록
===================================================== */

async function loadAdminProperties(){

    if(
        !isAdmin()
    ){

        return;

    }


    const container =
        document
        .getElementById(
            "adminPropertyList"
        );


    container.innerHTML =
        "불러오는 중...";


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "properties"
                )
            );


        container.innerHTML =
            "";


        if(
            snapshot.empty
        ){

            container.innerHTML =
                "<div style='color:#888'>등록된 매물이 없습니다.</div>";

            return;

        }


        snapshot.forEach(
            item => {

                const data =
                    item.data();


                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "admin-property";


                div.innerHTML = `

                    <div class="admin-property-info">

                        <div class="admin-property-title">
                            ${escapeHtml(
                                data.title
                                || "매물"
                            )}
                        </div>

                        <div class="admin-property-address">
                            ${escapeHtml(
                                data.address
                                || ""
                            )}
                        </div>

                    </div>

                    <button
                        class="delete-btn"
                        data-id="${item.id}"
                    >
                        삭제
                    </button>

                `;


                div
                .querySelector(
                    ".delete-btn"
                )
                .addEventListener(
                    "click",
                    () =>
                        deleteProperty(
                            item.id
                        )
                );


                container.appendChild(
                    div
                );

            }
        );


    }catch(error){

        container.innerHTML =
            "불러오기 오류";

        console.error(error);

    }

}


/* =====================================================
   매물 삭제
===================================================== */

async function deleteProperty(
    id
){

    if(
        !isAdmin()
    ){

        alert(
            "관리자만 삭제할 수 있습니다."
        );

        return;

    }


    if(
        !confirm(
            "정말 이 매물을 삭제할까요?"
        )
    ){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "properties",
                id
            )
        );


        alert(
            "삭제되었습니다."
        );


        await loadProperties();

        await loadAdminProperties();


    }catch(error){

        console.error(error);

        alert(
            "삭제 오류:\n\n"
            + error.message
        );

    }

}


/* =====================================================
   상세정보
===================================================== */

function showPropertyDetail(
    property
){

    document
    .getElementById(
        "detailCategory"
    )
    .textContent =
        property.category
        ||
        "";


    document
    .getElementById(
        "detailTitle"
    )
    .textContent =
        property.title
        ||
        "매물";


    const image =
        document
        .getElementById(
            "detailImage"
        );


    const noImage =
        document
        .getElementById(
            "detailNoImage"
        );


    if(
        property.photo
    ){

        image.src =
            property.photo;

        image.style.display =
            "block";

        noImage.style.display =
            "none";

    }else{

        image.style.display =
            "none";

        noImage.style.display =
            "flex";

    }


    const rows =
        document
        .getElementById(
            "detailRows"
        );


    let html = "";


    html += `

        <div class="detail-row">

            <span>주소</span>

            <strong>
                ${escapeHtml(
                    property.address
                    || "-"
                )}
            </strong>

        </div>

    `;


    html += `

        <div class="detail-row">

            <span>거래조건</span>

            <strong>
                ${priceText(
                    property
                )}
            </strong>

        </div>

    `;


    if(
        property.rights
    ){

        html += `

            <div class="detail-row">

                <span>권리금</span>

                <strong style="color:#d4512d">
                    ${escapeHtml(
                        property.rights
                    )}만원
                </strong>

            </div>

        `;

    }


    if(
        property.area
    ){

        html += `

            <div class="detail-row">

                <span>면적</span>

                <strong>
                    ${escapeHtml(
                        property.area
                    )}
                </strong>

            </div>

        `;

    }


    if(
        property.floor
    ){

        html += `

            <div class="detail-row">

                <span>층수</span>

                <strong>
                    ${escapeHtml(
                        property.floor
                    )}
                </strong>

            </div>

        `;

    }


    rows.innerHTML =
        html;


    document
    .getElementById(
        "detailDescription"
    )
    .textContent =
        property.description
        ||
        "";


    const external =
        document
        .getElementById(
            "detailExternal"
        );


    if(
        property.externalUrl
    ){

        external.href =
            property.externalUrl;

        external.style.display =
            "block";

    }else{

        external.style.display =
            "none";

    }


    document
    .getElementById(
        "detailModal"
    )
    .classList.add(
        "show"
    );


    /*
     지도에서 선택한 매물로 이동
    */

    if(
        map &&
        typeof property._lat
        ===
        "number"
    ){

        map.setCenter(
            new kakao.maps.LatLng(
                property._lat,
                property._lng
            )
        );

    }

}

function(){

    document
    .getElementById(
        "detailModal"
    )
    .classList.remove(
        "show"
    );

};

/* =====================================================
   고객 접수 관리자 확인
===================================================== */

async function loadRequests(){

    if(
        !isAdmin()
    ){

        return;

    }


    const container =
        document
        .getElementById(
            "requestList"
        );


    container.innerHTML =
        "불러오는 중...";


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "propertyRequests"
                )
            );


        container.innerHTML =
            "";


        if(
            snapshot.empty
        ){

            container.innerHTML =
                "<div style='color:#888'>접수된 매물이 없습니다.</div>";

            return;

        }


        const requests =
            [];


        snapshot.forEach(
            item => {

                requests.push({

                    id:
                        item.id,

                    ...item.data()

                });

            }
        );


        requests.sort(
            (a,b) => {

                const aa =
                    a.createdAt?.seconds
                    ||
                    0;

                const bb =
                    b.createdAt?.seconds
                    ||
                    0;

                return bb-aa;

            }
        );


        requests.forEach(
            item => {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "request-card";


                div.innerHTML = `

                    <strong>
                        ${escapeHtml(
                            item.name
                            || ""
                        )}
                        /
                        ${escapeHtml(
                            item.phone
                            || ""
                        )}
                    </strong>

                    <div>
                        종류:
                        ${escapeHtml(
                            item.category
                            || ""
                        )}
                    </div>

                    <div>
                        주소:
                        ${escapeHtml(
                            item.address
                            || ""
                        )}
                    </div>

                    <div>
                        내용:
                        ${escapeHtml(
                            item.description
                            || ""
                        )}
                    </div>

                `;


                container.appendChild(
                    div
                );

            }
        );


    }catch(error){

        console.error(error);

        container.innerHTML =
            "접수내역을 불러오지 못했습니다.";

    }

}
