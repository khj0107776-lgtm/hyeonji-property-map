<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>현지공인중개사 매물지도</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, "Malgun Gothic", sans-serif;
    background: #f5f6f8;
    color: #222;
}

header {
    height: 64px;
    background: #fff;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    position: relative;
    z-index: 1000;
}

.logo {
    font-size: 22px;
    font-weight: 800;
}

.user-area {
    display: flex;
    align-items: center;
    gap: 10px;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 11px 15px;
    cursor: pointer;
    font-size: 14px;
}

.login-btn {
    background: #4285f4;
    color: white;
}

.logout-btn {
    background: #eee;
}

.admin-badge {
    background: #eef3ff;
    color: #315bd6;
    padding: 8px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
}

.main {
    display: flex;
    width: 100%;
    height: calc(100vh - 64px);
}

.sidebar {
    width: 400px;
    background: white;
    border-right: 1px solid #ddd;
    overflow-y: auto;
    padding: 18px;
}

.map-area {
    flex: 1;
    position: relative;
}

#map {
    width: 100%;
    height: 100%;
}

.section-title {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 15px;

.form-box {
    background: #fff;
    border: 1px solid #e0e3e8;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 15px;
}

input,
select,
textarea {
    width: 100%;
    border: 1px solid #d7dbe2;
    border-radius: 9px;
    padding: 12px;
    margin-bottom: 9px;
    font-size: 14px;
    outline: none;
}

textarea {
    height: 100px;
    resize: vertical;
}

input:focus,
select:focus,
textarea:focus {
    border-color: #4285f4;
}

.register-btn {
    width: 100%;
    background: #4169e1;
    color: white;
    font-weight: bold;
    padding: 14px;
}

.photo-preview {
    width: 100%;

    object-fit: cover;
    border-radius: 10px;
    margin-top: 5px;

}

.search-box {

}

.property-list {

}

.property-item {

.property-item:hover {

.property-title {

.property-address {

    margin-top: 5px;
}

.status {

    color: #16833b;
}

}

.login-required {

}

.info-window {

    padding: 0;

    background: white;

}

.info-photo {

    height: 150px;
    object-fit: cover;
}

.info-content {
    padding: 12px;
}

.info-title {
    font-weight: bold;
    font-size: 17px;
    margin-bottom: 7px;
}

.info-price {
    color: #315bd6;
    font-weight: bold;
    margin-bottom: 7px;
}

.info-address {
    font-size: 13px;
    color: #555;
    margin-bottom: 7px;

.info-description {

}

.detail-btn {

}

@media(max-width: 800px) {

        border-bottom: 1px solid #ddd;
    }

    .map-area {
        height: 55%;
    }

    }

    }
}
</style>
</head>

    <div class="user-area">

<div class="main">

                </select>

                <input

                    placeholder="보증금 (만원)"

                <input

    </aside>


    <main class="map-area">

</div>


<!-- 카카오맵 -->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=175758acb1d968a612c27e344b435346&libraries=services"></script>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    query,
    orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ============================
   Firebase
============================ */

const firebaseConfig = {

    apiKey: "AIzaSyAC9YI78OLAKD4KJNJZTT6KRrhevG5GpVM",

    authDomain:
        "hyunji-8fc9c.firebaseapp.com",

    projectId:
        "hyunji-8fc9c",

    storageBucket:
        "hyunji-8fc9c.firebasestorage.app",

    messagingSenderId:
        "659657503337",

    appId:
        "1:659657503337:web:aa2e24ae4d37ed29d6a8f8",

    measurementId:
        "G-1LPMGC6317"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const provider = new GoogleAuthProvider();


/* ============================
   관리자 이메일
============================ */

const ADMIN_EMAIL =
    "khj0107776@gmail.com";


/* ============================
   카카오맵
============================ */

const container =
    document.getElementById("map");

const options = {

    center: new kakao.maps.LatLng(
        36.8151,
        127.1139
    ),

    level: 5
};

const map =
    new kakao.maps.Map(
        container,
        options
    );

const geocoder =
    new kakao.maps.services.Geocoder();


let markers = [];

let properties = [];


/* ============================
   DOM
============================ */

const loginBtn =
    document.getElementById("loginBtn");

const logoutBtn =
    document.getElementById("logoutBtn");

const adminPanel =
    document.getElementById("adminPanel");

const adminBadge =
    document.getElementById("adminBadge");

const userEmail =
    document.getElementById("userEmail");

const loginMessage =
    document.getElementById("loginMessage");

const photoInput =
    document.getElementById("photo");

const photoPreview =
    document.getElementById("photoPreview");

const searchInput =
    document.getElementById("searchInput");

const propertyList =
    document.getElementById("propertyList");


/* ============================
   Google 로그인
============================ */

loginBtn.addEventListener(
    "click",
    async () => {

        try {

            await signInWithPopup(
                auth,
                provider
            );

        } catch(error) {

            console.error(error);

            alert(
                "Google 로그인 중 오류가 발생했습니다.\n\n"
                + error.message
            );
        }
    }
);


/* ============================
   로그아웃
============================ */

logoutBtn.addEventListener(
    "click",
    async () => {

        await signOut(auth);

    }
);


/* ============================
   로그인 상태
============================ */

onAuthStateChanged(
    auth,
    user => {

        if(user) {

            userEmail.textContent =
                user.email;

            loginBtn.style.display =
                "none";

            logoutBtn.style.display =
                "inline-block";


            if(
                user.email.toLowerCase()
                === ADMIN_EMAIL.toLowerCase()
            ) {

                adminPanel.style.display =
                    "block";

                adminBadge.style.display =
                    "inline-block";

                loginMessage.style.display =
                    "none";

            } else {

                adminPanel.style.display =
                    "none";

                adminBadge.style.display =
                    "none";

                loginMessage.style.display =
                    "block";
            }

        } else {

            userEmail.textContent = "";

            loginBtn.style.display =
                "inline-block";

            logoutBtn.style.display =
                "none";

            adminPanel.style.display =
                "none";

            adminBadge.style.display =
                "none";

            loginMessage.style.display =
                "block";
        }

    }
);


/* ============================
   사진 미리보기
============================ */

photoInput.addEventListener(
    "change",
    () => {

        const file =
            photoInput.files[0];

        if(!file) {

            photoPreview.style.display =
                "none";

            return;
        }

        const reader =
            new FileReader();

        reader.onload =
            event => {

                photoPreview.src =
                    event.target.result;

                photoPreview.style.display =
                    "block";
            };

        reader.readAsDataURL(file);

    }
);


/* ============================
   사진 압축
============================ */

function compressImage(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                event => {

                    const img =
                        new Image();

                    img.onload =
                        () => {

                            const maxWidth =
                                1200;

                            let width =
                                img.width;

                            let height =
                                img.height;


                            if(width > maxWidth) {

                                height =
                                    height *
                                    maxWidth /
                                    width;

                                width =
                                    maxWidth;
                            }


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );

                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );

                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            const result =
                                canvas.toDataURL(
                                    "image/jpeg",
                                    0.72
                                );

                            resolve(result);

                        };

                    img.onerror =
                        reject;

                    img.src =
                        event.target.result;
                };

            reader.onerror =
                reject;

            reader.readAsDataURL(file);

        }
    );
}


/* ============================
   매물 등록
============================ */

document
.getElementById("registerBtn")
.addEventListener(
    "click",
    async () => {

        const user =
            auth.currentUser;


        if(!user) {

            alert(
                "먼저 Google 로그인을 해주세요."
            );

            return;
        }


        if(
            user.email.toLowerCase()
            !== ADMIN_EMAIL.toLowerCase()
        ) {

            alert(
                "관리자 계정만 매물을 등록할 수 있습니다."
            );

            return;
        }


        const title =
            document.getElementById(
                "title"
            ).value.trim();

        const address =
            document.getElementById(
                "address"
            ).value.trim();

        const type =
            document.getElementById(
                "type"
            ).value;

        const deposit =
            document.getElementById(
                "deposit"
            ).value.trim();

        const rent =
            document.getElementById(
                "rent"
            ).value.trim();

        const area =
            document.getElementById(
                "area"
            ).value.trim();

        const floor =
            document.getElementById(
                "floor"
            ).value.trim();

        const description =
            document.getElementById(
                "description"
            ).value.trim();

        const detailUrl =
            document.getElementById(
                "detailUrl"
            ).value.trim();

        const file =
            photoInput.files[0];


        if(!title) {

            alert(
                "매물 제목을 입력해주세요."
            );

            return;
        }


        if(!address) {

            alert(
                "주소를 입력해주세요."
            );

            return;
        }


        const status =
            document.getElementById(
                "registerStatus"
            );

        status.className =
            "status";

        status.textContent =
            "📍 주소를 확인하는 중입니다...";


        geocoder.addressSearch(
            address,
            async (result, statusCode) => {

                if(
                    statusCode
                    !== kakao.maps.services.Status.OK
                ) {

                    status.className =
                        "status error";

                    status.textContent =
                        "주소를 찾을 수 없습니다.";

                    return;
                }


                try {

                    const lat =
                        Number(
                            result[0].y
                        );

                    const lng =
                        Number(
                            result[0].x
                        );


                    let photoData = "";


                    /* 사진이 있으면 압축 */

                    if(file) {

                        status.textContent =
                            "📷 사진을 압축하는 중입니다...";

                        photoData =
                            await compressImage(
                                file
                            );


                        /*
                         Firestore 문서가 너무 커지는 것을
                         방지하기 위한 안전장치
                        */

                        if(
                            photoData.length
                            > 900000
                        ) {

                            status.className =
                                "status error";

                            status.textContent =
                                "사진 용량이 너무 큽니다. 다른 사진을 선택해주세요.";

                            return;
                        }
                    }


                    status.textContent =
                        "💾 매물을 저장하는 중입니다...";


                    await addDoc(
                        collection(
                            db,
                            "properties"
                        ),
                        {

                            title:
                                title,

                            address:
                                address,

                            type:
                                type,

                            deposit:
                                deposit,

                            rent:
                                rent,

                            area:
                                area,

                            floor:
                                floor,

                            description:
                                description,

                            detailUrl:
                                detailUrl,

                            photo:
                                photoData,

                            lat:
                                lat,

                            lng:
                                lng,

                            createdBy:
                                user.email,

                            createdAt:
                                new Date()
                        }
                    );


                    status.className =
                        "status success";

                    status.textContent =
                        "✅ 매물이 등록되었습니다.";


                    /* 입력 초기화 */

                    document
                    .getElementById("title")
                    .value = "";

                    document
                    .getElementById("address")
                    .value = "";

                    document
                    .getElementById("deposit")
                    .value = "";

                    document
                    .getElementById("rent")
                    .value = "";

                    document
                    .getElementById("area")
                    .value = "";

                    document
                    .getElementById("floor")
                    .value = "";

                    document
                    .getElementById("description")
                    .value = "";

                    document
                    .getElementById("detailUrl")
                    .value = "";

                    photoInput.value = "";

                    photoPreview.style.display =
                        "none";


                    await loadProperties();

                } catch(error) {

                    console.error(error);

                    status.className =
                        "status error";

                    status.textContent =
                        "❌ 저장 실패";

                    alert(
                        "매물 등록 중 오류가 발생했습니다.\n\n"
                        + error.message
                    );
                }

            }
        );

    }
);


/* ============================
   매물 불러오기
============================ */

async function loadProperties() {

    try {

        const q =
            query(
                collection(
                    db,
                    "properties"
                ),
                orderBy(
                    "createdAt",
                    "desc"
                )
            );


        const snapshot =
            await getDocs(q);


        properties = [];


        snapshot.forEach(
            item => {

                properties.push({

                    id:
                        item.id,

                    ...item.data()

                });

            }
        );


        displayProperties(
            properties
        );

        drawMarkers(
            properties
        );

    } catch(error) {

        console.error(error);

        propertyList.innerHTML = `
            <div class="empty">
                매물을 불러오지 못했습니다.
            </div>
        `;
    }
}


/* ============================
   지도 마커
============================ */

function drawMarkers(list) {

    markers.forEach(
        marker => {

            marker.setMap(null);

        }
    );

    markers = [];


    list.forEach(
        property => {

            if(
                !property.lat
                ||
                !property.lng
            ) return;


            const position =
                new kakao.maps.LatLng(
                    property.lat,
                    property.lng
                );


            const marker =
                new kakao.maps.Marker({

                    position:
                        position,

                    map:
                        map
                });


            const photoHtml =
                property.photo
                ?
                `<img class="info-photo"
                    src="${property.photo}">
                `
                :
                "";


            const price =
                `${property.deposit || 0} / ${property.rent || 0}만원`;


            const detailButton =
                property.detailUrl
                ?
                `
                <a
                    class="detail-btn"
                    href="${property.detailUrl}"
                    target="_blank"
                    rel="noopener"
                >
                    🔗 상세정보 보기
                </a>
                `
                :
                "";


            const deleteButton =
                auth.currentUser
                &&
                auth.currentUser.email
                    .toLowerCase()
                ===
                    ADMIN_EMAIL.toLowerCase()
                ?
                `
                <button
                    class="delete-btn"
                    onclick="deleteProperty('${property.id}')"
                >
                    🗑 매물 삭제
                </button>
                `
                :
                "";


            const content = `

                <div class="info-window">

                    ${photoHtml}

                    <div class="info-content">

                        <div class="info-title">
                            ${escapeHtml(property.title || "")}
                        </div>

                        <div class="info-price">
                            💰 ${escapeHtml(price)}
                        </div>

                        <div class="info-address">
                            📍 ${escapeHtml(property.address || "")}
                        </div>

                        <div class="info-description">
                            ${escapeHtml(property.description || "")}
                        </div>

                        ${detailButton}

                        ${deleteButton}

                    </div>

                </div>
            `;


            const infowindow =
                new kakao.maps.InfoWindow({

                    content:
                        content

                });


            kakao.maps.event.addListener(
                marker,
                "click",
                () => {

                    infowindow.open(
                        map,
                        marker
                    );

                }
            );


            markers.push(
                marker
            );

        }
    );


    if(list.length > 0) {

        const first =
            list.find(
                p =>
                    p.lat
                    &&
                    p.lng
            );

        if(first) {

            map.setCenter(
                new kakao.maps.LatLng(
                    first.lat,
                    first.lng
                )
            );
        }
    }
}


/* ============================
   매물 목록
============================ */

function displayProperties(
    list
) {

    if(list.length === 0) {

        propertyList.innerHTML = `
            <div class="empty">
                등록된 매물이 없습니다.
            </div>
        `;

        return;
    }


    propertyList.innerHTML =
        list
        .map(
            property => {

                return `

                <div
                    class="property-item"
                    onclick="moveToProperty(
                        ${property.lat},
                        ${property.lng}
                    )"
                >

                    <div class="property-title">
                        ${escapeHtml(
                            property.title || ""
                        )}
                    </div>

                    <div class="property-price">
                        💰
                        ${escapeHtml(
                            property.deposit || 0
                        )}
                        /
                        ${escapeHtml(
                            property.rent || 0
                        )}
                        만원
                    </div>

                    <div class="property-address">
                        📍
                        ${escapeHtml(
                            property.address || ""
                        )}
                    </div>

                </div>

                `;

            }
        )
        .join("");

}


/* ============================
   검색
============================ */

searchInput.addEventListener(
    "input",
    () => {

        const keyword =
            searchInput.value
                .trim()
                .toLowerCase();


        if(!keyword) {

            displayProperties(
                properties
            );

            drawMarkers(
                properties
            );

            return;
        }


        const filtered =
            properties.filter(
                property => {

                    return (

                        String(
                            property.title || ""
                        )
                        .toLowerCase()
                        .includes(keyword)

                        ||

                        String(
                            property.address || ""
                        )
                        .toLowerCase()
                        .includes(keyword)

                        ||

                        String(
                            property.type || ""
                        )
                        .toLowerCase()
                        .includes(keyword)

                    );

                }
            );


        displayProperties(
            filtered
        );

        drawMarkers(
            filtered
        );

    }
);


/* ============================
   지도 이동
============================ */

window.moveToProperty =
function(lat, lng) {

    if(!lat || !lng) return;

    const position =
        new kakao.maps.LatLng(
            lat,
            lng
        );

    map.setCenter(
        position
    );

    map.setLevel(
        4
    );
};


/* ============================
   매물 삭제
============================ */

window.deleteProperty =
async function(id) {

    const user =
        auth.currentUser;


    if(!user) {

        alert(
            "로그인이 필요합니다."
        );

        return;
    }


    if(
        user.email.toLowerCase()
        !== ADMIN_EMAIL.toLowerCase()
    ) {

        alert(
            "관리자만 삭제할 수 있습니다."
        );

        return;
    }


    if(
        !confirm(
            "이 매물을 삭제하시겠습니까?"
        )
    ) {

        return;
    }


    try {

        await deleteDoc(
            doc(
                db,
                "properties",
                id
            )
        );


        await loadProperties();


        alert(
            "매물이 삭제되었습니다."
        );

    } catch(error) {

        console.error(error);

        alert(
            "삭제 중 오류가 발생했습니다.\n\n"
            + error.message
        );
    }
};


/* ============================
   HTML 문자 처리
============================ */

function escapeHtml(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


/* ============================
   시작
============================ */

loadProperties();

</script>
