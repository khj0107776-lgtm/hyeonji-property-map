<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>현지공인중개사 매물지도</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",
    "Malgun Gothic",Arial,sans-serif;
    background:#fff;
    color:#222;
}

button,input,select,textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* =========================
   상단
========================= */

header{
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    border-bottom:1px solid #ddd;
    background:#fff;
    position:relative;
    z-index:1000;
}

.logo{
    font-size:21px;
    font-weight:800;
    white-space:nowrap;
}

.logo span{
    color:#16884b;
}

.header-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.user-email{
    font-size:14px;
    color:#555;
}

.btn{
    border:1px solid #ddd;
    background:#fff;
    border-radius:8px;
    padding:9px 14px;
    font-size:14px;
}

.btn-green{
    background:#16884b;
    color:#fff;
    border-color:#16884b;
}

.btn-red{
    background:#fff;
    color:#e33;
    border-color:#e33;
}

/* =========================
   필터
========================= */

.filter-bar{
    height:64px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 15px;
    border-bottom:1px solid #ddd;
    background:#fff;
    position:relative;
    z-index:900;
}

.filter{
    height:42px;
    border:1px solid #d8d8d8;
    border-radius:8px;
    background:#fff;
    padding:0 14px;
    font-size:14px;
}

.search{
    width:320px;
    padding-left:15px;
}

.filter.active{
    border-color:#16884b;
    color:#16884b;
    font-weight:700;
}

.count-box{
    margin-left:auto;
    background:#eef7f1;
    color:#16884b;
    padding:11px 17px;
    border-radius:8px;
    font-weight:700;
}

/* =========================
   메인
========================= */

.main{
    display:flex;
    height:calc(100vh - 128px);
    min-height:600px;
}

.map-wrap{
    position:relative;
    flex:1;
    min-width:0;
}

#map{
    width:100%;
    height:100%;
}

/* =========================
   동별 숫자
========================= */

.dong-marker{
    width:58px;
    height:58px;
    border-radius:50%;
    background:#2676d9;
    border:4px solid rgba(255,255,255,.95);
    box-shadow:0 3px 12px rgba(0,0,0,.3);
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-weight:700;
    text-align:center;
}

.dong-marker .count{
    font-size:18px;
    line-height:18px;
}

.dong-marker .name{
    font-size:10px;
    margin-top:3px;
    white-space:nowrap;
}

/* =========================
   오른쪽 목록
========================= */

.list-panel{
    width:650px;
    max-width:48vw;
    border-left:1px solid #ddd;
    background:#fff;
    overflow-y:auto;
}

.list-header{
    height:50px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #eee;
    position:sticky;
    top:0;
    background:#fff;
    z-index:10;
}

.list-header strong{
    font-size:17px;
}

.property-card{
    display:flex;
    gap:15px;
    padding:15px;
    border-bottom:1px solid #eee;
    transition:.15s;
}

.property-card:hover{
    background:#fafafa;
}

.photo-wrap{
    width:210px;
    height:145px;
    flex-shrink:0;
    border-radius:5px;
    overflow:hidden;
    background:#eee;
    position:relative;
}

.photo-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.no-photo{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#999;
    background:#f3f3f3;
}

.card-info{
    flex:1;
    min-width:0;
}

.card-address{
    font-size:13px;
    color:#777;
    margin-bottom:6px;
}

.card-title{
    font-size:18px;
    font-weight:800;
    margin-bottom:8px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.card-sub{
    font-size:13px;
    color:#666;
    margin-bottom:9px;
}

.price-row{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}

.price-item{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:14px;
    font-weight:700;
}

.badge{
    color:#fff;
    padding:4px 7px;
    border-radius:3px;
    font-size:12px;
    font-weight:700;
}

.deposit{
    background:#46b94e;
}

.rent{
    background:#46b94e;
}

.fee{
    background:#ed9d2e;
}

.premium{
    background:#e43d32;
}

.card-buttons{
    margin-top:10px;
    display:flex;
    gap:6px;
}

.detail-btn{
    padding:7px 12px;
    border:1px solid #ccc;
    background:#fff;
    border-radius:5px;
}

.external-btn{
    padding:7px 12px;
    border:1px solid #16884b;
    background:#16884b;
    color:#fff;
    border-radius:5px;
}

/* =========================
   관리자 등록 버튼
========================= */

.admin-button{
    position:absolute;
    top:15px;
    right:15px;
    z-index:500;
}

/* =========================
   등록창
========================= */

.modal-bg{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:5000;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-bg.show{
    display:flex;
}

.modal{
    width:620px;
    max-width:100%;
    max-height:90vh;
    overflow-y:auto;
    background:#fff;
    border-radius:14px;
    padding:25px;
    box-shadow:0 10px 40px rgba(0,0,0,.3);
}

.modal h2{
    margin:0 0 20px;
}

.form-row{
    display:flex;
    gap:10px;
}

.form-group{
    margin-bottom:13px;
    flex:1;
}

.form-group label{
    display:block;
    margin-bottom:5px;
    font-size:13px;
    font-weight:700;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    border:1px solid #ddd;
    border-radius:7px;
    padding:11px;
    font-size:14px;
}

.form-group textarea{
    height:110px;
    resize:vertical;
}

.photo-preview{
    width:100%;
    height:220px;
    border:1px dashed #bbb;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:#fafafa;
    margin-top:7px;
}

.photo-preview img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.modal-buttons{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:20px;
}

/* =========================
   상세창
========================= */

.detail-modal{
    width:700px;
}

.detail-photo{
    width:100%;
    height:350px;
    border-radius:8px;
    overflow:hidden;
    background:#eee;
    margin-bottom:20px;
}

.detail-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.detail-title{
    font-size:23px;
    font-weight:800;
    margin-bottom:8px;
}

.detail-address{
    color:#777;
    margin-bottom:18px;
}

.detail-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    border-top:1px solid #ddd;
    border-left:1px solid #ddd;
}

.detail-item{
    padding:12px;
    border-right:1px solid #ddd;
    border-bottom:1px solid #ddd;
}

.detail-item strong{
    display:block;
    color:#777;
    font-size:12px;
    margin-bottom:4px;
}

.detail-description{
    margin-top:18px;
    padding:15px;
    background:#f7f7f7;
    border-radius:8px;
    line-height:1.7;
    white-space:pre-wrap;
}

/* =========================
   로그인
========================= */

.login-screen{
    position:fixed;
    inset:0;
    background:#fff;
    z-index:10000;
    display:flex;
    align-items:center;
    justify-content:center;
}

.login-box{
    width:380px;
    max-width:90%;
    text-align:center;
    padding:35px;
    border:1px solid #eee;
    border-radius:15px;
    box-shadow:0 8px 30px rgba(0,0,0,.1);
}

.login-box h1{
    margin-top:0;
}

.google-btn{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    background:#fff;
    border-radius:8px;
    font-size:15px;
    font-weight:700;
}

/* =========================
   모바일
========================= */

@media(max-width:900px){

    header{
        height:55px;
        padding:0 10px;
    }

    .logo{
        font-size:16px;
    }

    .user-email{
        display:none;
    }

    .filter-bar{
        overflow-x:auto;
        height:55px;
    }

    .search{
        width:220px;
    }

    .main{
        height:calc(100vh - 110px);
        flex-direction:column;
    }

    .map-wrap{
        height:50%;
        min-height:350px;
    }

    .list-panel{
        width:100%;
        max-width:none;
        height:50%;
        border-left:0;
        border-top:1px solid #ddd;
    }

    .property-card{
        padding:10px;
    }

    .photo-wrap{
        width:125px;
        height:95px;
    }

    .card-title{
        font-size:15px;
    }

    .card-sub{
        font-size:11px;
    }

    .price-item{
        font-size:11px;
    }

    .badge{
        font-size:10px;
    }

    .detail-photo{
        height:250px;
    }
}
</style>

     로그인

<!-- Firebase -->
<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==========================================
   Firebase 설정
========================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAC9YI78OLAKD4KJNJZTT6KRrhevG5GpVM",

    authDomain:
        "hyunji-8fc9c.firebaseapp.com",

    projectId:
        "hyunji-8fc9c",

    storageBucket:
        "hyunji-8fc9c.firebasestorage.app",

    messagingSenderId:
        "659657503337",

    appId:
        "1:659657503337:web:aa2e24ae4d37ed29d6a8f8",

    measurementId:
        "G-1LPMGC6317"
};


/* ==========================================
   Firebase 시작
========================================== */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const provider = new GoogleAuthProvider();


/* ==========================================
   관리자 이메일
========================================== */

const ADMIN_EMAIL =
    "khj0107776@gmail.com";


/* ==========================================
   변수
========================================== */

let map;

let geocoder;

let properties = [];

let filteredProperties = [];

let dongMarkers = [];

let selectedDong = null;

let selectedPhotoData = "";


/* ==========================================
   지도 시작
========================================== */

function initMap(){

    const container =
        document.getElementById("map");

    const options = {

        center:
            new kakao.maps.LatLng(
                36.8151,
                127.1139
            ),

        level:8

    };

    map =
        new kakao.maps.Map(
            container,
            options
        );

    geocoder =
        new kakao.maps.services.Geocoder();

}


/* ==========================================
   Google 로그인
========================================== */

document
.getElementById("googleLoginBtn")
.addEventListener("click", async () => {

    const message =
        document.getElementById("loginMessage");

    message.textContent =
        "Google 로그인 중입니다...";

    try{

        await signInWithPopup(
            auth,
            provider
        );

    }catch(error){

        console.error(error);

        message.textContent =
            "로그인 오류 : " +
            error.message;

        alert(
            "Google 로그인 오류가 발생했습니다.\n\n" +
            error.code
        );

    }

});


/* ==========================================
   로그인 상태
========================================== */

onAuthStateChanged(
    auth,
    async user => {

        const loginScreen =
            document.getElementById(
                "loginScreen"
            );

        if(user){

            loginScreen.style.display =
                "none";

            document.getElementById(
                "userEmail"
            ).textContent =
                user.email;

            const isAdmin =
                user.email === ADMIN_EMAIL;

            document.getElementById(
                "adminBtn"
            ).style.display =
                isAdmin ? "block" : "none";

            document.getElementById(
                "addPropertyBtn"
            ).style.display =
                isAdmin ? "block" : "none";

            await loadProperties();

        }else{

            loginScreen.style.display =
                "flex";

        }

    }
);


/* ==========================================
   로그아웃
========================================== */

document
.getElementById("logoutBtn")
.addEventListener("click", async () => {

    await signOut(auth);

});


/* ==========================================
   매물 불러오기
========================================== */

async function loadProperties(){

    try{

        const snapshot =
            await getDocs(
                collection(db,"properties")
            );

        properties = [];

        snapshot.forEach(
            item => {

                properties.push({

                    id:item.id,

                    ...item.data()

                });

            }
        );

        filteredProperties =
            [...properties];

        renderList();

        renderDongMarkers();

    }catch(error){

        console.error(error);

        alert(
            "매물 불러오기 오류\n\n" +
            error.message
        );

    }

}


/* ==========================================
   주소 → 좌표
========================================== */

function getCoordinates(address){

    return new Promise(
        (resolve,reject) => {

            geocoder.addressSearch(
                address,
                (result,status) => {

                    if(
                        status ===
                        kakao.maps.services.Status.OK
                    ){

                        const item =
                            result[0];

                        resolve({

                            lat:
                                Number(item.y),

                            lng:
                                Number(item.x),

                            dong:
                                item.address
                                ?.region_3depth_name
                                || ""

                        });

                    }else{

                        reject(
                            new Error(
                                "주소를 찾을 수 없습니다."
                            )
                        );

                    }

                }
            );

        }
    );

}

/* ==========================================
   사진 압축
========================================== */

document
.getElementById("photo")
.addEventListener("change", event => {

    const file =
        event.target.files[0];

    if(!file){

        selectedPhotoData = "";

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            const img =
                new Image();


            img.onload =
                function(){

                    const canvas =
                        document
                        .createElement("canvas");


                    const MAX =
                        1000;


                    let width =
                        img.width;

                    let height =
                        img.height;


                    if(width > MAX){

                        height =
                            height *
                            MAX /
                            width;

                        width =
                            MAX;

                    }


                    if(height > MAX){

                        width =
                            width *
                            MAX /
                            height;

                        height =
                            MAX;

                    }


                    canvas.width =
                        width;

                    canvas.height =
                        height;


                    const ctx =
                        canvas
                        .getContext("2d");


                    ctx.drawImage(
                        img,
                        0,
                        0,
                        width,
                        height
                    );


                    selectedPhotoData =
                        canvas.toDataURL(
                            "image/jpeg",
                            0.72
                        );


                    document
                    .getElementById(
                        "photoPreview"
                    )
                    .innerHTML =
                        `<img src="${selectedPhotoData}">`;

                };


            img.src =
                e.target.result;

        };


    reader.readAsDataURL(file);

});


/* ==========================================
   동별 숫자 표시
========================================== */

function renderDongMarkers(){

    dongMarkers.forEach(
        marker =>
            marker.setMap(null)
    );

    dongMarkers = [];


    const groups = {};


    properties.forEach(
        property => {

            if(!property.dong)
                return;

            if(!groups[property.dong]){

                groups[property.dong] = [];

            }

            groups[property.dong]
                .push(property);

        }
    );


    Object.keys(groups)
    .forEach(
        dong => {

            const items =
                groups[dong];


            const lat =
                items.reduce(
                    (sum,item) =>
                        sum +
                        Number(item.lat),
                    0
                ) / items.length;


            const lng =
                items.reduce(
                    (sum,item) =>
                        sum +
                        Number(item.lng),
                    0
                ) / items.length;


            const content = `

                <div class="dong-marker">

                    <div class="count">
                        ${items.length}
                    </div>

                    <div class="name">
                        ${dong}
                    </div>

                </div>

            `;


            const customOverlay =
                new kakao.maps.CustomOverlay({

                    position:
                        new kakao.maps.LatLng(
                            lat,
                            lng
                        ),

                    content,

                    yAnchor:0.5,

                    zIndex:5

                });


            customOverlay.setMap(
                map
            );


            customOverlay
            .getContent()
            .onclick = () => {

                selectedDong =
                    dong;

                filteredProperties =
                    properties.filter(
                        p =>
                            p.dong === dong
                    );

                document
                .getElementById(
                    "listTitle"
                )
                .textContent =
                    dong + " 매물";

                renderList();

                map.setCenter(
                    new kakao.maps.LatLng(
                        lat,
                        lng
                    )
                );

            };


            dongMarkers.push(
                customOverlay
            );

        }
    );

}

            user.email !== ADMIN_EMAIL
        ){

            alert(
                "관리자만 삭제할 수 있습니다."
            );

            return;

        }


        if(
            !confirm(
                "이 매물을 삭제하시겠습니까?"
            )
        )
            return;


        try{

            await deleteDoc(
                doc(

                )
            );


            await loadProperties();


        }catch(error){

            alert(
                "삭제 오류\n\n" +

/* ==========================================
   검색
========================================== */

function applyFilters(){

    const search =
        document
        .getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    const deal =
        document
        .getElementById(
            "typeFilter"
        )
        .value;


    const category =
        document
        .getElementById(
            "categoryFilter"
        )
        .value;


    const theme =
        document
        .getElementById(
            "themeFilter"
        )
        .value;


    filteredProperties =
        properties.filter(
            property => {

                const text =
                    (
                        property.title +
                        " " +
                        property.address +
                        " " +
                        property.id
                    )
                    .toLowerCase();


                const searchOK =
                    !search ||
                    text.includes(search);


                const dealOK =
                    !deal ||
                    property.dealType === deal;


                const categoryOK =
                    !category ||
                    property.category === category;


                let themeOK = true;


                if(theme === "권리금"){

                    themeOK =
                        Number(
                            property.premium || 0
                        ) > 0;

                }


                return (
                    searchOK &&
                    dealOK &&
                    categoryOK &&
                    themeOK
                );

            }
        );


    selectedDong = null;

    document
    .getElementById(
        "listTitle"
    )
    .textContent =
        "전체 매물";


    renderList();

}
