<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>현지공인중개사 매물지도</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f5f6f8;color:#222}
    header{height:64px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 22px;font-size:25px;font-weight:800}
    .pin{margin-right:10px}
    .wrap{height:calc(100vh - 64px);display:flex}
    .side{width:370px;background:#fff;border-right:1px solid #ddd;padding:18px;overflow:auto}
    .map{flex:1;min-width:0}
    #map{width:100%;height:100%}
    h2{margin:4px 0 18px;font-size:22px}
    label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
    input,select{width:100%;height:44px;border:1px solid #ccc;border-radius:9px;padding:0 12px;font-size:15px;background:#fff}
    button{width:100%;height:46px;border:0;border-radius:9px;background:#222;color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:16px}
    button:hover{background:#111}
    .hint{font-size:12px;color:#777;line-height:1.5;margin-top:12px}
    .list{margin-top:20px;border-top:1px solid #eee}
    .item{padding:14px 4px;border-bottom:1px solid #eee;cursor:pointer}
    .item b{display:block;margin-bottom:5px}
    .item small{color:#777}
    .empty{padding:25px 4px;color:#999;text-align:center;font-size:13px}
  </style>
</head>
<body>
<header><span class="pin">📍</span>현지공인중개사 매물지도</header>

<div class="wrap">
  <aside class="side">
    <h2>매물 등록</h2>

    <label>주소</label>
    <input id="address" placeholder="예: 천안시 서북구 성정동 1063">

    <label>매물 종류</label>
    <select id="type">
      <option>상가</option>
      <option>사무실</option>
      <option>원룸</option>
      <option>투룸</option>
      <option>공장</option>
      <option>창고</option>
      <option>아파트</option>
      <option>토지</option>
    </select>

    <label>매물명</label>
    <input id="name" placeholder="예: 성정동 대로변 1층 상가">

    <label>상세 페이지 주소 (선택)</label>
    <input id="url" placeholder="https://...">

    <button onclick="addProperty()">📍 지도에 매물 등록</button>

    <div class="hint">
      주소를 입력하면 카카오 주소검색으로 위치를 찾고 지도에 핀을 표시합니다.
      매물명과 상세 페이지 주소를 넣으면 핀을 눌렀을 때 함께 표시됩니다.
    </div>

    <div class="list" id="list">
      <div class="empty">등록된 매물이 없습니다.</div>
    </div>
  </aside>

  <main class="map"><div id="map"></div></main>
</div>

<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=175758acb1d968a612c27e344b435346&libraries=services"></script>
<script>
  const container = document.getElementById('map');
  const options = { center: new kakao.maps.LatLng(36.8151, 127.1139), level: 5 };
  const map = new kakao.maps.Map(container, options);
  const geocoder = new kakao.maps.services.Geocoder();
  const properties = [];

  function addProperty(){
    const address = document.getElementById('address').value.trim();
    const type = document.getElementById('type').value;
    const name = document.getElementById('name').value.trim() || type + ' 매물';
    const url = document.getElementById('url').value.trim();

    if(!address){
      alert('주소를 입력해주세요.');
      return;
    }

    geocoder.addressSearch(address, function(result, status){
      if(status !== kakao.maps.services.Status.OK || !result.length){
        alert('주소를 찾지 못했습니다. 도로명주소 또는 지번주소를 정확하게 입력해주세요.');
        return;
      }

      const lat = Number(result[0].y);
      const lng = Number(result[0].x);
      const position = new kakao.maps.LatLng(lat, lng);

      const marker = new kakao.maps.Marker({map, position});

      let content = `
        <div style="padding:12px 14px;min-width:220px;font-size:13px">
          <div style="font-size:11px;color:#777;margin-bottom:4px">${escapeHtml(type)}</div>
          <div style="font-weight:800;font-size:15px;margin-bottom:6px">${escapeHtml(name)}</div>
          <div style="color:#555;line-height:1.4">${escapeHtml(address)}</div>
          ${url ? `<a href="${safeUrl(url)}" target="_blank" rel="noopener"
             style="display:inline-block;margin-top:9px;color:#1677ff;font-weight:700;text-decoration:none">매물 자세히 보기 →</a>` : ''}
        </div>`;

      const infowindow = new kakao.maps.InfoWindow({content});
      kakao.maps.event.addListener(marker, 'click', () => infowindow.open(map, marker));

      properties.push({address,type,name,url,marker,position});
      map.setCenter(position);
      map.setLevel(3);
      renderList();

      document.getElementById('address').value = '';
      document.getElementById('name').value = '';
      document.getElementById('url').value = '';
    });
  }

  function renderList(){
    const list = document.getElementById('list');
    if(!properties.length){
      list.innerHTML = '<div class="empty">등록된 매물이 없습니다.</div>';
      return;
    }
    list.innerHTML = properties.map((p,i)=>`
      <div class="item" onclick="focusProperty(${i})">
        <b>${escapeHtml(p.name)}</b>
        <small>${escapeHtml(p.type)} · ${escapeHtml(p.address)}</small>
      </div>
    `).join('');
  }

  function focusProperty(i){
    const p = properties[i];
    map.setCenter(p.position);
    map.setLevel(3);
    kakao.maps.event.trigger(p.marker,'click');
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
    }[c]));
  }

  function safeUrl(s){
    try{
      const u = new URL(s);
      if(u.protocol !== 'http:' && u.protocol !== 'https:') return '#';
      return u.href.replace(/"/g,'%22');
    }catch(e){ return '#'; }
  }

  renderList();
</script>
</body>
</html>
